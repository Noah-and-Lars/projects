<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Test builds · The Arcade</title>
<meta name="theme-color" content="#0f0d1f">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../arcade.css?v=13">
<style>
  .tb { padding-bottom: 40px; max-width: 640px; }
  .tb form { display: flex; gap: 8px; margin: 22px 0 14px; }
  .tb input {
    flex: 1; min-width: 0; padding: 10px 14px; border-radius: 10px;
    border: 1px solid #ffffff22; background: var(--panel); color: var(--text); font: inherit;
  }
  .tb input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #status { margin: 0 0 12px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: #ff8a8a; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../"><img class="logo" src="../logo.svg" alt="">The Arcade</a>
</header>
<main class="wrap tb">
  <div class="hero">
    <h1>Test builds</h1>
    <p>Play a branch before it goes live. Paste its name, then pick a game.</p>
  </div>
  <form id="form">
    <input id="branch" placeholder="Branch name" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <button class="btn">Open</button>
  </form>
  <p id="status" role="status"></p>
  <div id="games" class="chips"></div>
</main>
<script>
  // Each game opens at play/<commit>/<folder>/, which sw.js serves straight from GitHub.
  // Links to share: ?branch=<name> lists its games, ?branch=<name>&game=<folder> starts one.
  const API = 'https://api.github.com/repos/Noah-and-Lars/projects';
  const form = document.getElementById('form');
  const input = document.getElementById('branch');
  const status = document.getElementById('status');
  const games = document.getElementById('games');

  const worker = 'serviceWorker' in navigator
    ? navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
    : Promise.reject(new Error('unsupported'));
  worker.catch(() => {}); // reported when a game is opened

  function say(text, isError) {
    status.textContent = text;
    status.classList.toggle('error', !!isError);
  }

  function link(branch, game) {
    return '?branch=' + encodeURIComponent(branch) + (game ? '&game=' + encodeURIComponent(game) : '');
  }

  async function github(path, accept) {
    let res;
    try {
      res = await fetch(API + path, { headers: { Accept: accept } });
    } catch {
      throw new Error('Couldn’t reach GitHub. Check your connection and try again.');
    }
    if (res.ok) return accept.endsWith('sha') ? (await res.text()).trim() : res.json();
    if (res.status === 404 || res.status === 422) throw new Error('missing');
    if (res.status === 403 || res.status === 429) {
      const reset = new Date(Number(res.headers.get('X-RateLimit-Reset')) * 1000);
      const when = isNaN(reset) ? 'in an hour' : 'after ' + reset.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      throw new Error('GitHub allows 60 lookups an hour from one network, and they’re used up. Try again ' + when + '.');
    }
    throw new Error('GitHub had a problem (' + res.status + '). Try again in a moment.');
  }

  async function open(branch, game) {
    branch = branch.trim();
    if (!branch) return;
    input.value = branch;
    // Keep ?branch in the address bar (to share or bookmark), but not ?game,
    // so Back from a game returns to this list instead of starting it again.
    history.replaceState(null, '', link(branch));
    games.replaceChildren();
    say('Looking up ' + branch + '…');

    let commit, folders;
    try {
      commit = await github('/commits/' + encodeURIComponent(branch), 'application/vnd.github.sha');
      if (game) return play(commit, game);
      folders = await gamesIn(commit);
    } catch (e) {
      say(e.message === 'missing' ? 'There’s no branch called “' + branch + '”.' : e.message, true);
      return;
    }
    if (!folders.length) return say('No games on this branch.', true);

    say('Latest commit ' + commit.slice(0, 7) + '. Pick a game:');
    for (const folder of folders) {
      const a = document.createElement('a');
      a.className = 'chip';
      a.textContent = folder;
      a.href = link(branch, folder);
      a.addEventListener('click', (e) => {
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return; // opening in a new tab
        e.preventDefault();
        play(commit, folder);
      });
      games.append(a);
    }
  }

  // Folders with an index.html. A commit never changes, so the answer is kept
  // for this tab and coming back to the list doesn't ask GitHub again.
  async function gamesIn(commit) {
    const key = 'test-builds-' + commit;
    try {
      const saved = sessionStorage.getItem(key);
      if (saved) return JSON.parse(saved);
    } catch {}
    const tree = await github('/git/trees/' + commit + '?recursive=1', 'application/vnd.github+json');
    const folders = tree.tree
      .filter((t) => t.type === 'blob' && /^[^/]+\/index\.html$/.test(t.path))
      .map((t) => t.path.slice(0, -'/index.html'.length))
      .filter((f) => f !== 'test');
    try { sessionStorage.setItem(key, JSON.stringify(folders)); } catch {}
    return folders;
  }

  async function play(commit, folder) {
    say('Starting ' + folder + '…');
    try {
      await worker;
    } catch {
      say('This browser can’t run test builds here. Private windows sometimes block it; try a normal window.', true);
      return;
    }
    location.href = 'play/' + commit + '/' + encodeURIComponent(folder) + '/';
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    open(input.value);
  });

  const params = new URLSearchParams(location.search);
  if (params.get('branch')) open(params.get('branch'), params.get('game'));
  else input.focus();
</script>
</body>
</html>
