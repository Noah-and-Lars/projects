<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snow Rider 3D</title>
<style>
  :root { --bg: #0b1622; --fg: #eaf4ff; --accent: #6cc4ff; --muted: #8aa4bd; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: radial-gradient(circle at 50% 35%, #1d3550, var(--bg) 70%);
    transition: opacity .4s; z-index: 5; padding: 16px; box-sizing: border-box; text-align: center; }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); letter-spacing: .04em; }
  #bar { width: min(360px, 80vw); height: 10px; border-radius: 5px; background: #1c2d40; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #status { color: var(--muted); font-size: 14px; min-height: 1.4em; max-width: 520px; line-height: 1.5; }
  #status.error { color: #ff9b9b; }
  #status code { background: #1c2d40; padding: 2px 6px; border-radius: 4px; color: var(--fg); }
  #fs { position: fixed; right: 12px; top: 12px; z-index: 4; border: 0; border-radius: 8px;
    padding: 8px 12px; background: rgba(0,0,0,.45); color: #fff; font: 600 13px system-ui; cursor: pointer; }
  #fs:hover { background: rgba(0,0,0,.7); }
  /* On-screen controls for touch devices */
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between;
    padding: 0 16px 20px; pointer-events: none; z-index: 4; }
  body.touch #touch { display: flex; }
  #touch button { pointer-events: auto; width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5);
    background: rgba(0,0,0,.3); color: #fff; font-size: 34px; touch-action: none; user-select: none; -webkit-user-select: none; }
  #touch button.down { background: rgba(108,196,255,.5); }
  #touch .group { display: flex; gap: 14px; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>

<div id="loader">
  <h1>Snow Rider 3D</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Starting…</div>
</div>

<button id="fs" title="Fullscreen">⛶ Fullscreen</button>

<div id="touch">
  <div class="group">
    <button data-key="ArrowLeft">◀</button>
    <button data-key="ArrowRight">▶</button>
  </div>
  <div class="group">
    <button data-key="ArrowUp">▲</button>
  </div>
</div>

<script>
(() => {
  const BUILD = "Build/";
  const FILES = {
    framework: BUILD + "SnowRider3D.wasm.framework.js",
    code:      BUILD + "SnowRider3D.wasm.code.unityweb",
    data:      BUILD + "SnowRider3D.data.unityweb",
  };

  const canvas = document.getElementById("canvas");
  const loader = document.getElementById("loader");
  const fill = document.getElementById("fill");
  const statusEl = document.getElementById("status");

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle("error", !!isError);
  }

  // ---- Download with combined progress -------------------------------------
  const progress = {};
  function report(key, loaded, total) {
    progress[key] = { loaded, total: total || progress[key]?.total || 0 };
    let l = 0, t = 0;
    for (const k in progress) { l += progress[k].loaded; t += progress[k].total || progress[k].loaded; }
    const pct = t ? Math.min(100, (l / t) * 100) : 0;
    fill.style.width = (pct * 0.9).toFixed(1) + "%"; // last 10% = engine start-up
    setStatus(BUNDLED ? "Loading…" : `Downloading… ${(l / 1048576).toFixed(1)} MB`);
  }

  // The built single-file index.html carries each file as base64 in a
  // <script type="application/octet-stream" id="build-KEY"> block, so it
  // works when opened straight from disk. src/index.html has no such blocks
  // and fetches the files from Build/ instead.
  function embedded(key) {
    const el = document.getElementById("build-" + key);
    if (!el) return null;
    const b64 = el.textContent.replace(/\s+/g, "");
    el.remove(); // free the text from the DOM
    let bytes;
    if (typeof Uint8Array.fromBase64 === "function") {
      bytes = Uint8Array.fromBase64(b64);
    } else {
      const bin = atob(b64);
      bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    }
    return bytes.buffer;
  }
  const BUNDLED = !!document.getElementById("build-code"); // checked once, blocks are removed as they are read

  async function download(key, url) {
    const inline = embedded(key);
    if (inline) { report(key, inline.byteLength, inline.byteLength); return inline; }
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
    const total = +res.headers.get("Content-Length") || 0;
    if (!res.body) { const b = await res.arrayBuffer(); report(key, b.byteLength, b.byteLength); return b; }
    const reader = res.body.getReader();
    const chunks = []; let loaded = 0;
    report(key, 0, total);
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); loaded += value.length;
      report(key, loaded, total);
    }
    const out = new Uint8Array(loaded); let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out.buffer;
  }

  // .unityweb files are gzip. Some servers already strip it (Content-Encoding),
  // so only decompress when the gzip magic bytes are actually there.
  async function gunzipIfNeeded(buf) {
    const b = new Uint8Array(buf, 0, 2);
    if (b[0] !== 0x1f || b[1] !== 0x8b) return buf;
    if (typeof DecompressionStream === "undefined")
      throw new Error("This browser can't unpack the game files. Please use a current Chrome, Edge, Firefox or Safari.");
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).arrayBuffer();
  }

  // ---- Unity's packed data file ("UnityWebData1.0") -------------------------
  function unpackData(Module, buf) {
    const bytes = new Uint8Array(buf);
    const view = new DataView(buf);
    const magic = "UnityWebData1.0\0";
    if (new TextDecoder().decode(bytes.subarray(0, magic.length)) !== magic)
      throw new Error("Data file is not a UnityWebData1.0 package");
    let pos = magic.length;
    const headerSize = view.getUint32(pos, true); pos += 4;
    const made = new Set();
    while (pos < headerSize) {
      const offset = view.getUint32(pos, true);
      const size = view.getUint32(pos + 4, true);
      const pathLen = view.getUint32(pos + 8, true);
      const path = new TextDecoder().decode(bytes.subarray(pos + 12, pos + 12 + pathLen));
      pos += 12 + pathLen;
      const parts = path.split("/");
      let dir = "/";
      for (let i = 0; i < parts.length - 1; i++) {
        const next = (dir === "/" ? "" : dir) + "/" + parts[i];
        if (!made.has(next)) { Module.FS_createPath(dir, parts[i], true, true); made.add(next); }
        dir = next;
      }
      Module.FS_createDataFile(dir, parts[parts.length - 1], bytes.subarray(offset, offset + size), true, true, true);
    }
  }

  // ---- What the original UnityLoader.js exposed to the framework -----------
  function systemInfo() {
    const ua = navigator.userAgent;
    const pick = (list) => { for (const [name, re] of list) { const m = ua.match(re); if (m) return [name, m[1] || ""]; } return ["Unknown", ""]; };
    const [browser, browserVersion] = pick([
      ["Edge", /Edg(?:e|A|iOS)?\/([\d.]+)/], ["Opera", /OPR\/([\d.]+)/], ["Firefox", /Firefox\/([\d.]+)/],
      ["Chrome", /Chrome\/([\d.]+)/], ["Safari", /Version\/([\d.]+).*Safari/],
    ]);
    const [os, osVersion] = pick([
      ["Windows", /Windows NT ([\d.]+)/], ["Android", /Android ([\d.]+)/], ["iOS", /OS ([\d_]+) like Mac/],
      ["Mac OS X", /Mac OS X ([\d_.]+)/], ["Linux", /(Linux)/],
    ]);
    let gpu = "Unknown", hasWebGL = 0;
    try {
      const c = document.createElement("canvas");
      let gl = c.getContext("webgl2"); hasWebGL = gl ? 2 : 0;
      if (!gl) { gl = c.getContext("webgl"); hasWebGL = gl ? 1 : 0; }
      if (gl) {
        const ext = gl.getExtension("WEBGL_debug_renderer_info");
        gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
        gl.getExtension("WEBGL_lose_context")?.loseContext();
      }
    } catch (e) {}
    return {
      width: screen.width, height: screen.height, userAgent: ua.trim(),
      browser, browserVersion, os, osVersion: osVersion.replace(/_/g, "."),
      gpu, language: navigator.userLanguage || navigator.language,
      hasWebGL, hasCursorLock: !!document.body.requestPointerLock,
      hasFullscreen: !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen),
      mobile: /Mobile|Android|iP(hone|od|ad)/.test(ua),
    };
  }

  function hasIndexedDB() {
    try { return !!window.indexedDB; } catch (e) { return false; }
  }

  // The game calls GameDistribution's ad SDK. We don't load it; instead a
  // no-op stand-in answers so ad prompts never hang and rewards still pay out.
  function installAdStub(getModule) {
    const AdType = { Interstitial: "interstitial", Rewarded: "rewarded" };
    window.gdsdk = {
      AdType,
      preloadAd: () => Promise.resolve(),
      showAd: () => Promise.resolve(),
    };
    // Prevent the framework from injecting the external SDK <script>.
    if (!document.getElementById("gamedistribution-jssdk")) {
      const s = document.createElement("script");
      s.id = "gamedistribution-jssdk"; s.type = "text/plain";
      document.head.appendChild(s);
    }
  }

  function loadFramework(url, text) {
    return new Promise((resolve, reject) => {
      const blob = new Blob(["window.__unityFramework = ", text, "\n//# sourceURL=" + url], { type: "text/javascript" });
      const s = document.createElement("script");
      s.src = URL.createObjectURL(blob);
      s.onload = () => { URL.revokeObjectURL(s.src); resolve(window.__unityFramework); };
      s.onerror = () => reject(new Error("Could not evaluate the game framework"));
      document.body.appendChild(s);
    });
  }

  async function start() {
    if (location.protocol === "file:" && !BUNDLED) {
      statusEl.innerHTML = "This is the source page, which loads the game files from <code>Build/</code> and so only works over HTTP.<br>" +
        "Open the built <code>snow-rider-3d/index.html</code> instead, or serve this folder with <code>python3 -m http.server 8000</code>.";
      statusEl.classList.add("error");
      return;
    }
    if (typeof WebAssembly !== "object") throw new Error("Your browser doesn't support WebAssembly.");
    if (!systemInfo().hasWebGL) throw new Error("Your browser doesn't support WebGL.");

    const [fwBuf, codeBuf, dataBuf] = await Promise.all([
      download("framework", FILES.framework),
      download("code", FILES.code),
      download("data", FILES.data),
    ]);

    setStatus("Unpacking…");
    const [fwRaw, wasm, data] = await Promise.all([
      gunzipIfNeeded(fwBuf), gunzipIfNeeded(codeBuf), gunzipIfNeeded(dataBuf),
    ]);
    const fwText = new TextDecoder().decode(fwRaw);

    window.UnityLoader = { SystemInfo: systemInfo() };
    installAdStub();

    const Module = {
      canvas,
      wasmBinary: wasm,
      TOTAL_MEMORY: 268435456,
      webglContextAttributes: { premultipliedAlpha: true, preserveDrawingBuffer: false },
      indexedDB: hasIndexedDB(),
      streamingAssetsUrl: () => new URL("StreamingAssets", location.href).href,
      locateFile: (name) => BUILD + name,
      preRun: [() => unpackData(Module, data)],
      postRun: [() => {
        fill.style.width = "100%";
        setTimeout(() => loader.classList.add("hidden"), 300);
        canvas.focus();
      }],
      print: (t) => console.log(t),
      printErr: (t) => console.warn(t),
      setStatus: () => {},
      onAbort: (what) => fail(new Error("The game stopped: " + what)),
    };
    window.Module = Module;
    window.gameInstance = { Module, SendMessage: (...a) => Module.SendMessage(...a) };

    setStatus("Starting engine…");
    fill.style.width = "93%";
    const framework = await loadFramework(FILES.framework, fwText);
    framework(Module);
  }

  function fail(err) {
    console.error(err);
    setStatus(String(err && err.message || err), true);
    loader.classList.remove("hidden");
  }

  // ---- Fullscreen -----------------------------------------------------------
  document.getElementById("fs").addEventListener("click", () => {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
    }
    canvas.focus();
  });

  // ---- Touch controls: synthesize the keyboard events Unity listens for ----
  const KEYS = {
    ArrowLeft:  { key: "ArrowLeft",  code: "ArrowLeft",  keyCode: 37 },
    ArrowRight: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
    ArrowUp:    { key: "ArrowUp",    code: "ArrowUp",    keyCode: 38 },
  };
  function sendKey(type, k) {
    const ev = new KeyboardEvent(type, { key: k.key, code: k.code, bubbles: true, cancelable: true });
    for (const p of ["keyCode", "which"]) Object.defineProperty(ev, p, { get: () => k.keyCode });
    Object.defineProperty(ev, "charCode", { get: () => 0 });
    (document.activeElement || window).dispatchEvent(ev);
  }
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) document.body.classList.add("touch");
  document.querySelectorAll("#touch button").forEach((btn) => {
    const k = KEYS[btn.dataset.key];
    const down = (e) => { e.preventDefault(); if (!btn.classList.contains("down")) { btn.classList.add("down"); sendKey("keydown", k); } };
    const up = (e) => { e.preventDefault(); if (btn.classList.contains("down")) { btn.classList.remove("down"); sendKey("keyup", k); } };
    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointercancel", up);
    btn.addEventListener("pointerleave", up);
  });

  window.addEventListener("keydown", (e) => {
    // Keep arrow keys / space from scrolling the page.
    if ([32, 37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
  });

  start().catch(fail);
})();
</script>
</body>
</html>
