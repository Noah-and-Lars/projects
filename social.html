<script>
// 2026-11-07: phones and tablets get their own layout (html.mob, see the end of arcade.css). It goes by the device,
// not the window width, so desktops stay exactly as they were. ?mob=phone, ?mob=tab or ?mob=off forces one (tests).
(function () {
  var u = navigator.userAgent || '', c = document.documentElement.classList, f = '';
  try { f = (/[?&]mob=(phone|tab|off)/.exec(location.search) || [])[1] || sessionStorage.getItem('arcade-mob') || ''; if (f) sessionStorage.setItem('arcade-mob', f); } catch (e) {}
  var ipad = /iPad/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var phone = /iPhone|iPod|Windows Phone|BlackBerry|webOS|Android.+Mobile|Mobile.+Firefox/.test(u);
  var tab = !phone && (ipad || /Android|Tablet|Silk|Kindle|PlayBook/.test(u));
  if (f) { phone = f === 'phone'; tab = f === 'tab'; }
  if (phone || tab) { c.add('mob'); c.add(phone ? 'mob-phone' : 'mob-tab'); }
  var vh = function () { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); };
  vh(); window.addEventListener('resize', vh);
  if (window.Element && !Element.prototype.replaceChildren) Element.prototype.replaceChildren = function () { while (this.firstChild) this.removeChild(this.firstChild); for (var i = 0; i < arguments.length; i++) { var n = arguments[i]; this.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); } };
})();
</script>
<title>Social · The Arcade</title>
<meta name="description" content="Clips, photos and videos from players on The Arcade: watch, like, comment, follow and message.">
<meta name="theme-color" content="#0f0d1f">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Arcade">
<link rel="stylesheet" href="arcade.css?v=16">
<style>
:root { --ring: linear-gradient(45deg, #f9ce34, #ee2a7b 55%, #6228d7); --line: #ffffff17; --like: #ff3040; --blue: #3797f0; }
.ig { width: 100%; max-width: 940px; margin: 0 auto; padding: 0 16px 60px; }
/* top bar and section nav */
.ig-top { display: flex; align-items: center; gap: 6px; padding: 14px 0 6px; }
.ig-brand { font: italic 800 28px/1 Georgia, "Times New Roman", serif; letter-spacing: -0.02em; margin-right: auto; background: var(--ring); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ib { position: relative; display: inline-grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 12px; background: none; color: var(--text); cursor: pointer; }
.ib:hover { background: #ffffff10; }
.ib svg { width: 26px; height: 26px; }
.badge { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--like); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
.badge[hidden] { display: none; }
.ig-nav { position: sticky; top: 0; z-index: 30; display: flex; justify-content: space-around; gap: 4px; margin: 4px 0 14px; padding: 6px; border-radius: 16px; background: rgba(27, 24, 53, .92); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.ig-nav a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 6px; border-radius: 11px; color: var(--muted); font-weight: 700; font-size: 14px; }
.ig-nav a:hover { background: #ffffff0d; color: var(--text); }
.ig-nav a.on { color: var(--text); background: #ffffff14; }
.ig-nav svg { width: 24px; height: 24px; flex: none; }
.ig-nav a.on svg { stroke-width: 2.6; }
@media (max-width: 700px) { .ig-nav a span { display: none; } }
svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.empty { margin: 30px auto; padding: 30px; max-width: 460px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }
.note { color: var(--muted); font-size: 13px; text-align: center; margin: 20px 0; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: hsl(var(--h) 55% 42%); color: #fff; font-weight: 800; font-size: 15px; position: relative; }
.av.pic { background-size: cover; background-position: center; color: transparent; }
.av-edit { position: relative; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
.av-edit .cam-b { position: absolute; right: 4px; bottom: 4px; width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; border: 3px solid var(--bg); }
.av-edit .cam-b svg { width: 15px; height: 15px; }
.ring { padding: 2.5px; border-radius: 50%; background: var(--ring); flex: none; display: inline-grid; }
.ring.seen { background: #ffffff33; }
.ring > .av { border: 2.5px solid var(--bg); }
.on-dot::after { content: ""; position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: #2ecc71; border: 2.5px solid var(--bg); }

/* stories */
.stories { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: none; max-width: 470px; margin: 0 auto 6px; }
.stories::-webkit-scrollbar { display: none; }
.story { flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 0; background: none; color: var(--text); cursor: pointer; padding: 0; font: inherit; }
.story .av { width: 60px; height: 60px; font-size: 24px; }
.story small { width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; text-align: center; color: var(--muted); }
.story .plus { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 17px; font-weight: 800; display: grid; place-items: center; border: 3px solid var(--bg); line-height: 1; }
.chips { display: flex; gap: 6px; justify-content: center; margin: 0 0 14px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; white-space: nowrap; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }

/* a post (home feed) */
.feed { display: flex; flex-direction: column; gap: 10px; max-width: 470px; margin: 0 auto; }
.post { border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.ph { display: flex; align-items: center; gap: 10px; padding: 8px 2px; }
.ph .ring .av { width: 32px; height: 32px; font-size: 13px; }
.ph .who { flex: 1; min-width: 0; line-height: 1.25; font-size: 14px; }
.ph .who a.nm { font-weight: 800; }
.ph .who a.nm:hover { color: var(--muted); }
.ph .who small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .who small a:hover { text-decoration: underline; }
.dot { color: var(--muted); }
.fol { border: 0; background: none; color: var(--blue); font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; padding: 0; }
.fol.on { color: var(--muted); }
.media { position: relative; background: #000; border-radius: 6px; overflow: hidden; cursor: pointer; aspect-ratio: 16 / 9; }
.post .media { border: 1px solid var(--line); }
.media img.pic, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.media .bg { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(26px) brightness(.5); }
.media video { opacity: 0; transition: opacity .2s; }
.media.ready video { opacity: 1; }
.media .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.media .snd { position: absolute; right: 10px; bottom: 12px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: #000a; color: #fff; cursor: pointer; display: grid; place-items: center; }
.media .snd svg { width: 15px; height: 15px; }
.media .paused { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; }
.media .paused svg { width: 64px; height: 64px; fill: #fffd; filter: drop-shadow(0 4px 18px #000a); }
.media.stopped.ready .paused { display: grid; }
.media .load { position: absolute; left: 10px; bottom: 12px; font-size: 12px; color: #fffc; background: #000a; padding: 3px 9px; border-radius: 999px; display: none; }
.media.loading .load { display: block; }
.media .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #ffffff26; }
.media .prog i { display: block; height: 100%; width: 0; background: #fff; }
.media .heart { position: absolute; left: 50%; top: 50%; width: 100px; height: 100px; transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; }
.media .heart svg { width: 100%; height: 100%; fill: #fff; filter: drop-shadow(0 6px 24px #0009); }
.media .heart.pop { animation: heartpop .9s ease-out; }
@keyframes heartpop { 15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(.95); } 70% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
.tag-kind { position: absolute; top: 10px; right: 10px; padding: 3px 8px; border-radius: 999px; background: #000a; color: #fff; font-size: 11px; font-weight: 800; pointer-events: none; }
.acts { display: flex; align-items: center; gap: 2px; padding: 6px 0 2px; margin-left: -8px; }
.acts button { border: 0; background: none; color: var(--text); padding: 8px; cursor: pointer; border-radius: 50%; display: grid; place-items: center; }
.acts button:hover { color: var(--muted); }
.acts svg { width: 25px; height: 25px; }
.acts .like.on svg { fill: var(--like); stroke: var(--like); }
.acts .save { margin-left: auto; }
.acts .save.on svg { fill: currentColor; }
.likes { font-weight: 800; font-size: 14px; margin: 2px 0; }
.likes a { font-weight: 800; }
.likes .views { color: var(--muted); font-weight: 600; margin-left: 8px; }
.cap { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; margin: 2px 0; white-space: pre-line; }
.cap a { font-weight: 800; margin-right: 6px; }
.allcm { display: block; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 2px 0; cursor: pointer; }
.when { display: block; color: var(--muted); font-size: 11px; letter-spacing: .03em; text-transform: uppercase; margin-top: 4px; }
.play-link { font-size: 13px; color: var(--accent-2); font-weight: 700; }
.play-link:hover { text-decoration: underline; }
.menu { position: absolute; z-index: 300; min-width: 200px; padding: 6px; background: var(--panel-2); border: 1px solid #ffffff22; border-radius: 12px; box-shadow: 0 16px 40px #000a; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text); font: inherit; font-size: 14px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.menu button:hover { background: #ffffff12; }
.menu button.bad { color: #ff8a8a; }

/* reels */
.reels { position: relative; height: 70vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; max-width: 460px; margin: 0 auto; border-radius: 16px; background: #000; overscroll-behavior: contain; }
.reels::-webkit-scrollbar { display: none; }
.reel { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; }
.reel .media { position: absolute; inset: 0; border-radius: 0; aspect-ratio: auto !important; }
.reel .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(transparent, #000c); pointer-events: none; }
.reel .side { position: absolute; right: 8px; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 14px; z-index: 2; }
.reel .side button { border: 0; background: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 12px; font-weight: 700; padding: 0; text-shadow: 0 1px 6px #000; }
.reel .side svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 5px #0008); }
.reel .side .like.on svg { fill: var(--like); stroke: var(--like); }
.reel .side .save.on svg { fill: #fff; }
.reel .info { position: absolute; left: 14px; right: 70px; bottom: 22px; z-index: 2; color: #fff; text-shadow: 0 1px 6px #000; font-size: 14px; }
.reel .info .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.reel .info .av { width: 32px; height: 32px; font-size: 13px; text-shadow: none; }
.reel .info a.nm { font-weight: 800; }
.reel .info .fol { color: #fff; border: 1px solid #ffffffb0; border-radius: 8px; padding: 3px 10px; font-size: 13px; text-shadow: none; }
.reel .info .fol.on { border-color: #ffffff55; color: #ffffffb0; }
.reel .info .cap { margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.reel .info .cap.open { -webkit-line-clamp: unset; }
.reel .info .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; opacity: .9; }
.reel .info .meta a { font-weight: 800; }
.reel .media .snd { top: 64px; bottom: auto; }
.reel .tag-kind { display: none; } /* the game is in the caption area, and the corner is for Back and × */
.reel .media .prog { bottom: 0; z-index: 3; }
.reels-end { height: 100%; scroll-snap-align: start; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 30px; }
.reels-end b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
.viewer { position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, .92); display: flex; align-items: center; justify-content: center; }
.viewer .reels { height: 100vh; height: 100dvh; max-width: min(520px, 100vw); border-radius: 0; }
.viewer .x { position: fixed; top: max(12px, calc(env(safe-area-inset-top) + 8px)); right: 14px; z-index: 210; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #0008; color: #fff; font-size: 26px; cursor: pointer; line-height: 1; }
.rback { position: absolute; top: 12px; left: 12px; z-index: 5; display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px 0 8px; border-radius: 999px; border: 0; background: #0009; color: #fff; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.rback svg { width: 22px; height: 22px; }
.viewer .rback { position: fixed; top: max(12px, calc(env(safe-area-inset-top) + 8px)); left: 14px; z-index: 210; }
.reels-wrap { position: relative; max-width: 460px; margin: 0 auto; }
.mob-phone .reels-wrap { max-width: none; }
.updown { position: fixed; right: max(16px, calc(50% - 330px)); top: 50%; transform: translateY(-50%); z-index: 205; display: flex; flex-direction: column; gap: 10px; }
.updown button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; }
.mob .updown { display: none; }

/* grids (profile, explore) */
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.grid3 a { position: relative; display: block; aspect-ratio: 1; background: #000; overflow: hidden; }
.grid3 img { width: 100%; height: 100%; object-fit: cover; transition: filter .2s; }
.grid3 a:hover img { filter: brightness(.6); }
.grid3 .kind { position: absolute; top: 6px; right: 6px; color: #fff; filter: drop-shadow(0 1px 4px #000); }
.grid3 .kind svg { width: 20px; height: 20px; }
.grid3 .kind.pin { font-size: 18px; line-height: 1; }
.review { max-width: 560px; margin: 0 auto; padding: 8px 0 40px; }
.rv-head h2 { margin: 6px 0 4px; font-size: 20px; }
.rv-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 14px 0; background: #ffffff08; }
.rv-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.rv-who { font-weight: 800; } .rv-meta { color: var(--muted); font-size: 13px; margin-left: auto; }
.rv-media img, .rv-media video { width: 100%; max-height: 70vh; object-fit: contain; background: #000; border-radius: 10px; display: block; }
.rv-cap { margin: 10px 0; white-space: pre-line; overflow-wrap: anywhere; }
.rv-acts { display: flex; gap: 10px; } .rv-acts .btn { flex: 1; }
.prof .bio { margin: 8px 0 6px; font-size: 14px; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; max-width: 520px; }
.cap a.lnk, .body a.lnk { color: #7cb3ff; font-weight: 600; margin: 0; text-decoration: underline; }
.grid3 .vw { position: absolute; left: 8px; bottom: 6px; color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 6px #000; display: flex; align-items: center; gap: 4px; }
.grid3 .vw svg { width: 14px; height: 14px; fill: #fff; stroke: none; }
.grid3 .hov { position: absolute; inset: 0; display: none; place-items: center; grid-auto-flow: column; gap: 18px; color: #fff; font-weight: 800; }
.grid3 a:hover .hov { display: grid; }
.grid3 .hov span { display: flex; align-items: center; gap: 6px; }
.grid3 .hov svg { width: 20px; height: 20px; fill: #fff; stroke: #fff; }
.search { width: 100%; padding: 11px 16px; border-radius: 12px; border: 0; background: var(--panel-2); color: var(--text); font: inherit; font-size: 15px; }
.search:focus { outline: 2px solid var(--accent); }
.people { list-style: none; margin: 0; padding: 4px 0; }
.people a { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 10px; }
.people a:hover { background: #ffffff0a; }
.people .av { width: 44px; height: 44px; font-size: 18px; }
.people b { display: block; font-size: 14px; }
.people small { color: var(--muted); font-size: 13px; }
.people .none { color: var(--muted); padding: 20px; text-align: center; }

/* profile */
.prof { max-width: 935px; margin: 0 auto; }
.prof-h { display: flex; gap: 28px; align-items: center; padding: 10px 6px 24px; flex-wrap: wrap; }
.prof-h .ring .av, .prof-h > .av { width: 110px; height: 110px; font-size: 46px; }
.prof-h .info { flex: 1; min-width: 230px; }
.prof-h .nmrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.prof-h h1 { margin: 0 8px 0 0; font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.prof-h .btn { padding: 7px 16px; font-size: 14px; border-radius: 9px; }
.btn.grey { background: #ffffff1c; color: var(--text); box-shadow: none; }
.btn.blue { background: var(--blue); color: #fff; box-shadow: none; }
.tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #ffffff14; color: var(--muted); }
.stats { display: flex; gap: 26px; flex-wrap: wrap; margin: 16px 0 10px; }
.stats button, .stats span { border: 0; background: none; color: var(--text); font: inherit; padding: 0; font-size: 15px; }
.stats button { cursor: pointer; }
.stats b { font-weight: 800; margin-right: 4px; }
.ptabs { display: flex; justify-content: center; gap: 50px; border-top: 1px solid var(--line); margin-bottom: 4px; }
.ptabs button { display: flex; align-items: center; gap: 6px; padding: 14px 0; border: 0; border-top: 1px solid transparent; margin-top: -1px; background: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.ptabs button.on { color: var(--text); border-top-color: var(--text); }
.ptabs svg { width: 14px; height: 14px; }

/* comments and sheets */
.cmts { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.cm-list { list-style: none; margin: 0; padding: 6px 14px; overflow-y: auto; flex: 1; min-height: 0; }
.cm-list li { display: flex; gap: 10px; padding: 8px 0; }
.cm-list .av { width: 32px; height: 32px; font-size: 13px; }
.cm-list .body { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.4; font-size: 14px; }
.cm-list .body a.nm { font-weight: 800; margin-right: 6px; }
.cm-list .body .re { color: var(--blue); font-weight: 700; margin-right: 4px; }
.cm-list .meta { display: flex; gap: 12px; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 600; }
.cm-list .meta button { border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; }
.cm-list .meta button:hover { color: var(--text); }
.cm-list .cl { border: 0; background: none; color: var(--muted); cursor: pointer; align-self: center; padding: 4px; }
.cm-list .cl svg { width: 14px; height: 14px; }
.cm-list .cl.on svg { fill: var(--like); stroke: var(--like); }
.cm-list .none { color: var(--muted); justify-content: center; padding: 26px 0; }
.cm-form { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.cm-form input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px; border: 1px solid #ffffff22; background: var(--bg); color: var(--text); font: inherit; }
.cm-form button { border: 0; background: none; color: var(--blue); font: inherit; font-weight: 800; cursor: pointer; }
.cm-form button:disabled { opacity: .4; cursor: default; }
.cm-reply { display: flex; justify-content: space-between; padding: 6px 14px 0; color: var(--muted); font-size: 12px; }
.cm-reply button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; }
.single .cmts { border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; max-height: 480px; }
.ov { position: fixed; inset: 0; z-index: 250; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .7); }

<script>
/* Social (2026-11-10, Instagram style): clips recorded in games (clips.js on play.html, the last 30 seconds), and
   players' own photos and videos. The server is the Worker's /clips/* routes (see the comment block above `clips()`
   in realtime-worker/src/worker.js); messages use the accounts' DMs (/acct/dm, the same chats as the Players page).
   Views (the hash): #home (stories + posts), #reels (one post per screen, scroll), #explore (find players, grid),
   #create, #me / #u=<name> (a profile: posts, videos, saved), #c=<id> (one post with its comments), #dm (inbox),
   #dm=<name> (a chat). A view counts once a video has played 2 s (or most of a short one) or a photo has been on
   screen for 1 s, once per viewer (the account, or this device for guests). */
const $ = id => document.getElementById(id);
const ROOM = ((/[?&]clipsroom=([a-z0-9-]+)/i.exec(location.search) || [])[1] || '').toLowerCase(); // tests: a separate Social
const ADMIN_Q = /[?&]admin\b/.test(location.search);
// 2026-11-11: the admin tools show with ?admin (password) or for a signed-in admin account (no password)
const owner = () => { try { return !!(window.ArcadeAccount && ArcadeAccount.isAdmin && ArcadeAccount.isAdmin()); } catch (e) { return false; } };
const isAdm = () => ADMIN_Q || owner();
const API = () => ArcadeAccount.server + '/clips/';
const me = () => ArcadeAccount.kind() === 'online' ? ArcadeAccount.name() : '';
const lc = s => String(s || '').toLowerCase();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const hue = id => { let h = 0; for (const c of lc(id)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = n => { const s = el('span', 'av', (String(n).match(/[a-z0-9]/i) || [String(n)[0] || '?'])[0].toUpperCase()); s.setAttribute('aria-hidden', 'true'); s.style.setProperty('--h', hue(n)); fillAvatar(s, n); return s; };
/* profile pictures: every avatar asks for its player's picture; the names are gathered and fetched together
   (/clips/avatars, up to 60 a request) and kept for 10 minutes in sessionStorage. No picture = the coloured letter. */
const AV_KEY = 'arcade-social-av', avWait = new Map();
let avCache = new Map(), avQ = new Set(), avT = 0;
try { const c = JSON.parse(sessionStorage.getItem(AV_KEY) || 'null'); if (c && Date.now() - c.at < 600000) avCache = new Map(Object.entries(c.av)); } catch (e) {}
function saveAv() { try { sessionStorage.setItem(AV_KEY, JSON.stringify({ at: Date.now(), av: Object.fromEntries(avCache) })); } catch (e) {} }
function paintAv(span, url) { span.classList.toggle('pic', !!url); span.style.backgroundImage = url ? 'url("' + url + '")' : ''; }
function fillAvatar(span, n) {
  const k = lc(n);
  if (!/^[a-z0-9_]{3,16}$/.test(k)) return;
  span.dataset.n = k;
  if (avCache.has(k)) return paintAv(span, avCache.get(k));
  if (!avWait.has(k)) avWait.set(k, []);
  avWait.get(k).push(span); avQ.add(k);
  clearTimeout(avT); avT = setTimeout(fetchAvs, 40);
}
async function fetchAvs() {
  const ks = [...avQ].slice(0, 60); ks.forEach(k => avQ.delete(k));
  if (!ks.length) return;
  const r = await get('avatars', { n: ks.join(','), me: '' });
  for (const k of ks) {
    const url = r.status === 200 && r.av ? r.av[k] || '' : '';
    if (r.status === 200) avCache.set(k, url);
    (avWait.get(k) || []).forEach(sp => paintAv(sp, url)); avWait.delete(k);
  }
  saveAv();
  if (avQ.size) fetchAvs();
}
function setMyAvatar(url) { const k = lc(me()); avCache.set(k, url); saveAv(); document.querySelectorAll('.av[data-n="' + k + '"]').forEach(sp => paintAv(sp, url)); }
const ringed = (n, seen) => { const r = el('span', 'ring' + (seen ? ' seen' : '')); r.append(avatar(n)); return r; };
const num = n => n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'K' : (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
const plural = (n, w) => num(n) + ' ' + w + (n === 1 ? '' : 's');
const ago = t => { const s = (Date.now() - t) / 1000; if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; if (s < 604800) return Math.floor(s / 86400) + 'd'; return Math.floor(s / 604800) + 'w'; };
const agoLong = t => { const s = (Date.now() - t) / 1000, u = (n, w) => n + ' ' + w + (n === 1 ? '' : 's') + ' ago'; if (s < 60) return 'Just now'; if (s < 3600) return u(Math.floor(s / 60), 'minute'); if (s < 86400) return u(Math.floor(s / 3600), 'hour'); if (s < 604800) return u(Math.floor(s / 86400), 'day'); return new Date(t).toLocaleDateString([], { month: 'long', day: 'numeric' }); };
const gameOf = id => GAMES.find(g => g.id === id);
const ls = { get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const userLink = n => '#u=' + encodeURIComponent(n);
const MODS = ['claude']; // moderators can delete any post or comment (checked again on the server: CLIP_MODS)
const isMod = () => MODS.includes(lc(me()));
const svg = (d, extra) => '<svg class="i" viewBox="0 0 24 24"' + (extra || '') + '>' + d + '</svg>';
const IC = {
  heart: '<path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8 3.5 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.5 0 5.5 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/>',
  comment: '<path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-4.6A8.5 8.5 0 1 1 20.5 11.5z"/>',
  send: '<path d="M22 3 9.2 10.1M22 3l-7 18-3.8-8.8L2 9.5 22 3Z"/>',
  save: '<path d="M19 21l-7-5-7 5V4.5A1.5 1.5 0 0 1 6.5 3h11A1.5 1.5 0 0 1 19 4.5z"/>',
  more: '<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>',
  play: '<path d="M8 5v14l11-7z"/>',
  muted: '<path d="M11 5 6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/>',
  sound: '<path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  grid: '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>',
  reel: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M8 3l3 5.5M14 3l3 5.5M10 12.5v5l4.5-2.5z"/>',
  cam: '<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.8"/>',
  video: '<rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="m15.5 10.5 6-3.5v10l-6-3.5"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  photo: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="m21 15-5-5L5 21"/>'
};

/* ---------- the server ---------- */
function qs(o) { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o || {})) if (v !== '' && v != null) p.set(k, v); if (ROOM) p.set('r', ROOM); const s = p.toString(); return s ? '?' + s : ''; }
async function get(path, o) {
  try { const r = await fetch(API() + path + qs(Object.assign({ me: me() }, o)), { cache: 'no-store' }); const j = await r.json().catch(() => ({})); j.status = r.status; return j; }
  catch (e) { return { error: 'offline', status: 0 }; }
}
async function post(path, body, noAuth) {
  const h = { 'content-type': 'application/json' };

  if (!mine && me()) add('Message ' + c.by, () => { location.hash = 'dm=' + encodeURIComponent(c.by); });

    const r = await post('report', { id: c.id }); if (r.status === 200) ArcadeAccount.toast('Thanks', 'The post was reported.', location.href); else if (r.status !== 401) failed(r);
  }, true);

function gone(node) { node.style.transition = 'opacity .3s'; node.style.opacity = 0; setTimeout(() => node.remove(), 300); }
let adminPw = '';
// the owner's request: as an admin account no password is asked; otherwise the admin password (once per page)
async function adminCall(body) {
  if (!owner() && !adminPw) adminPw = prompt('Admin password') || '';
  if (!owner() && !adminPw) return { status: 0, error: 'cancel' };
  const r = await acct('admin', { method: 'POST', auth: owner(), body: Object.assign({ pw: owner() ? '' : adminPw, r: ROOM }, body) });
  if (r.status === 401) adminPw = '';
  return r;
}
async function adminDelete(c, node) {
  if (!confirm('Delete this post by ' + c.by + ' for everyone?')) return;
  const r = await adminCall({ op: 'clipdel', id: c.id });
  if (r.status === 200) gone(node); else if (r.error !== 'cancel') alert(r.error === 'wrong' ? 'Wrong password.' : 'Couldn’t delete it (' + (r.error || r.status) + ').');
}

/* ---------- send a post to people (Instagram's paper-plane button) ----------
   Shows your recent chats, group chats, friends and people you follow, and searches everyone; each one picked gets
   the post as a private message (the post's link, which chats show as a small card), plus your note if you write one. */
async function sendSheet(c) {
  const b = el('div'), q = el('input', 'search'), grid = el('div', 'snd-grid'), foot = el('div', 'snd-foot');
  q.type = 'search'; q.placeholder = 'Search'; q.setAttribute('aria-label', 'Search people'); q.style.cssText = 'margin:12px 14px 0;width:calc(100% - 28px)';
  const note = el('input'); note.type = 'text'; note.maxLength = 300; note.placeholder = 'Write a message…'; note.hidden = true;
  const send = el('button', 'btn blue', 'Send'); send.type = 'button'; send.hidden = true;
  const msg = el('div', 'snd-msg'), more = el('div', 'snd-more');
  const opt = (label, ic, f) => { const x = el('button'); x.type = 'button'; const ci = el('span', 'c'); ci.innerHTML = ic; x.append(ci, label); x.onclick = f; more.append(x); };
  opt('Copy link', svg('<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'), () => share(c, 'copy'));
  if (navigator.share) opt('Share to…', svg(IC.send), () => share(c, 'native'));
  foot.append(note, send, msg, more);
  b.append(q, grid, foot); b.style.cssText = 'display:flex;flex-direction:column;min-height:0';
  const ov = sheet('Share', b, true);
  ov.querySelector('.sheet').style.maxWidth = '560px';
  const picked = new Map(); // key -> { n, g (group id) }
  const paintFoot = () => { const n = picked.size; note.hidden = send.hidden = !n; send.textContent = n > 1 ? 'Send separately (' + n + ')' : 'Send'; };
  if (!me()) {
    grid.replaceChildren(el('div', 'snd-none', 'Sign in to send posts to your friends.'));
    const si = el('button', 'btn', 'Make an account'); si.type = 'button'; si.style.cssText = 'grid-column:1/-1;justify-self:center'; si.onclick = () => { ov.close(); needAccount(); }; grid.append(si);
    return;
  }
  grid.append(el('div', 'snd-none', 'Loading…'));
  if (!soc) await loadSoc();
  // suggestions: recent chats first (people and groups), then friends, then people you follow
  const sug = [], seenK = new Set();
  const add = (k, n, g) => { if (seenK.has(k) || lc(n) === lc(me()) || (soc && soc.b[k])) return; seenK.add(k); sug.push({ k, n, g }); };
  if (soc) Object.entries(soc.c).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0)).forEach(([k, x]) => add(k, x.n, x.g ? k.slice(2) : ''));
  friends().forEach(n => add(lc(n), n, ''));
  [...following].forEach(k => add(k, k, ''));
  let everyone = null;
  const tile = p => {
    const t = el('button', 'snd-p' + (picked.has(p.k) ? ' on' : '')), wrap = el('span'); t.type = 'button';
    wrap.style.position = 'relative'; const av = p.g ? avatar('G') : avatar(p.n); if (p.g) av.style.background = 'linear-gradient(135deg, #6c5ce7, #00d2a8)';
    wrap.append(av, el('span', 'tick', '✓'));
    t.append(wrap, el('small', '', p.n));
    t.onclick = () => { if (picked.has(p.k)) picked.delete(p.k); else picked.set(p.k, p); t.classList.toggle('on', picked.has(p.k)); paintFoot(); };
    return t;
  };
  const paint = async () => {
    const t = lc(q.value.trim());

    if (t) {
      if (!everyone) { const r = await acct('players'); everyone = r.status === 200 ? r.players.map(x => ({ k: lc(x[0]), n: x[0], g: '' })) : []; }
      const pool = sug.concat(everyone.filter(x => !seenK.has(x.k) && x.k !== lc(me()) && !(soc && soc.b[x.k])));
      list = pool.filter(x => lc(x.n).includes(t)).sort((a, b) => lc(a.n).indexOf(t) - lc(b.n).indexOf(t)).slice(0, 60);
    }

  };
  q.oninput = paint; paint();
  send.onclick = async () => {
    const link = location.href.split('#')[0] + '#c=' + c.id, text = (note.value.trim() ? note.value.trim().slice(0, 300) + '\n' : '') + link;
    send.disabled = true; msg.className = 'snd-msg'; msg.textContent = 'Sending…';
    let ok = 0, bad = [];
    for (const p of picked.values()) { // one at a time, so the server's message limits aren't hit all at once
      const r = p.g ? await acct('group', { method: 'POST', auth: true, body: { op: 'say', id: p.g, text } }) : await acct('dm', { method: 'POST', auth: true, body: { to: p.n, text } });
      if (r.status === 200) { ok++; if (!p.g && r.m) gotDm(p.k, r.n || p.n, r.m); }
      else { bad.push(p.n); if (r.error === 'slow') break; }
    }
    if (ok) post('share', { id: c.id }, true);
    if (!bad.length) { ov.close(); ArcadeAccount.toast('Sent', ok === 1 ? 'Sent to ' + [...picked.values()][0].n + '.' : 'Sent to ' + ok + ' people.', '#dm'); return; }
    send.disabled = false; msg.className = 'snd-msg err'; msg.textContent = 'Couldn’t send to ' + bad.join(', ') + (ok ? ' (the others got it).' : '. Try again in a moment.');
  };
}

/* ---------- For you: ranked for this player ---------- */
// The server sends its hottest posts (likes, comments, shares and how much of each video people watch, cooled by
// age) and its newest. Here they're ranked for you: games you play, games whose posts you like and people you follow
// or are friends with count more, posts you've already seen far less, then no more than a couple from one player in a row.
function rank(list) {
  const played = Arcade.played(), fol = new Set([...following, ...friends().map(lc)]), likedGame = {}, now = Date.now();
  for (const c of list) if (c.me && c.g) likedGame[c.g] = (likedGame[c.g] || 0) + 1;
  let pool = list.map(c => {
    let s = c.hot || 0.001;
    if (c.g && played[c.g]) s *= 1.5;
    if (likedGame[c.g]) s *= 1 + Math.min(1, likedGame[c.g] * 0.25);
    if (fol.has(lc(c.by))) s *= 2;
    if (now - c.at < 6 * 36e5) s *= 1.3;
    if (seen[c.id]) s *= 0.12;
    if (lc(c.by) === lc(me())) s *= 0.4;
    return { c, s: s * (0.85 + Math.random() * 0.3) };
  });
  const out = [], byCount = {};
  while (pool.length) {
    let best = 0, bs = -1;
    pool.forEach((x, i) => { const k = x.s * Math.pow(0.5, byCount[lc(x.c.by)] || 0) * (out.length && out[out.length - 1].g === x.c.g ? 0.8 : 1); if (k > bs) { bs = k; best = i; } });
    const [x] = pool.splice(best, 1); out.push(x.c); byCount[lc(x.c.by)] = (byCount[lc(x.c.by)] || 0) + 1;
  }
  return out;
}
let forYouCache = null;
async function forYou(fresh) {
  if (forYouCache && !fresh && Date.now() - forYouCache.at < 120000) return forYouCache;
  const r = await get('feed', { tab: 'foryou' });
  if (r.status !== 200) return r;
  if (me()) setFollowing(r.following || []);
  const hide = blocked();
  forYouCache = { status: 200, at: Date.now(), clips: rank(r.clips.filter(c => !hide.has(lc(c.by)))) };
  return forYouCache;
}

async function showHome() {
  const my = ++gen; setNav('home'); loading();

// a caption as text; in the site's own (Claude) posts, https links are clickable
// 2026-11-11: words are shown as written; the account panel's "Filter swear words on Social" stars them out (per account)
const SWEAR = /\b(f+u+c+k+\w*|f+u+k+\w*|s+h+i+t+\w*|b+i+t+c+h+\w*|c+u+n+t+\w*|d+i+c+k+s?\b|p+u+s+s+y+\w*|a+s+s+h+o+l+e+\w*|bastard\w*|slut\w*|whore\w*|nigg\w*|n+i+g+a+\w*|fag\w*|retard\w*|twat\w*|wank\w*|porn\w*|penis\w*|vagina\w*|rape\w*)/gi;
const filterOn = () => { try { return localStorage.getItem('arcade-swear-filter') === '1'; } catch (e) { return false; } };
const fw = t => filterOn() ? String(t == null ? '' : t).replace(SWEAR, w => w[0] + '*'.repeat(w.length - 1)) : String(t == null ? '' : t);
addEventListener('arcade-filter', () => { try { route(); } catch (e) {} });
function capNodes(c) {
