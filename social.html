<script>
// 2026-11-07: phones and tablets get their own layout (html.mob, see the end of arcade.css). It goes by the device,
// not the window width, so desktops stay exactly as they were. ?mob=phone, ?mob=tab or ?mob=off forces one (tests).
(function () {
  var u = navigator.userAgent || '', c = document.documentElement.classList, f = '';
  try { f = (/[?&]mob=(phone|tab|off)/.exec(location.search) || [])[1] || sessionStorage.getItem('arcade-mob') || ''; if (f) sessionStorage.setItem('arcade-mob', f); } catch (e) {}
  var ipad = /iPad/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var phone = /iPhone|iPod|Windows Phone|BlackBerry|webOS|Android.+Mobile|Mobile.+Firefox/.test(u);
  var tab = !phone && (ipad || /Android|Tablet|Silk|Kindle|PlayBook/.test(u));
  if (f) { phone = f === 'phone'; tab = f === 'tab'; }
  if (phone || tab) { c.add('mob'); c.add(phone ? 'mob-phone' : 'mob-tab'); }
  var vh = function () { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); };
  vh(); window.addEventListener('resize', vh);
  if (window.Element && !Element.prototype.replaceChildren) Element.prototype.replaceChildren = function () { while (this.firstChild) this.removeChild(this.firstChild); for (var i = 0; i < arguments.length; i++) { var n = arguments[i]; this.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); } };
})();
</script>

<style>
.soc { max-width: 980px; padding-bottom: 50px; }
.soc-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 20px 0 16px; }
.soc-seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid #ffffff14; }
.soc-seg button { padding: 7px 14px; border: 0; border-radius: 9px; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.soc-seg button:hover { color: var(--text); }
.soc-seg button.on { background: var(--accent); color: #fff; }
.soc-top .sp { flex: 1; }

.empty .btn { margin-top: 14px; }
.more { display: block; margin: 0 auto; }

/* a clip */
.card { background: var(--panel); border: 1px solid #ffffff14; border-radius: 18px; overflow: hidden; }
.ch { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: hsl(var(--h) 55% 42%); color: #fff; font-weight: 800; font-size: 15px; }
.ch .who { flex: 1; min-width: 0; line-height: 1.25; }
.ch .who a.nm { font-weight: 800; }
.ch .who a.nm:hover { text-decoration: underline; }
.ch .who small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch .who small a:hover { color: var(--text); text-decoration: underline; }
.fol { border: 0; background: none; color: var(--accent-2); font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; padding: 0 0 0 6px; }
.fol.on { color: var(--muted); }
.dots { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.dots:hover { background: #ffffff10; color: var(--text); }
.vid { position: relative; background: #000; aspect-ratio: 16 / 9; cursor: pointer; overflow: hidden; }
.vid img, .vid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.vid video { opacity: 0; transition: opacity .2s; }
.vid.ready video { opacity: 1; }
.vid .snd { position: absolute; right: 10px; bottom: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #000a; color: #fff; font-size: 15px; cursor: pointer; }
.vid .paused { position: absolute; inset: 0; display: none; place-items: center; font-size: 54px; color: #fffd; text-shadow: 0 4px 20px #000; pointer-events: none; }
.vid.stopped .paused { display: grid; }
.vid .load { position: absolute; left: 10px; bottom: 14px; font-size: 12px; color: #fffc; background: #000a; padding: 3px 8px; border-radius: 999px; display: none; }
.vid.loading .load { display: block; }
.vid .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #ffffff22; }
.vid .prog i { display: block; height: 100%; width: 0; background: #fff; }
.vid .heart { position: absolute; left: 50%; top: 50%; font-size: 90px; transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; filter: drop-shadow(0 6px 20px #0008); }
.vid .heart.pop { animation: heartpop .8s ease-out; }
@keyframes heartpop { 15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(.95); } 70% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
.acts { display: flex; align-items: center; gap: 4px; padding: 8px 8px 0; }
.acts button { display: flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--text); font: inherit; font-weight: 700; font-size: 14px; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.acts button:hover { background: #ffffff0d; }
.acts .ic { font-size: 21px; line-height: 1; }
.acts .like.on .ic { color: #ff4d6d; }
.acts .views { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 600; padding-right: 6px; white-space: nowrap; }
.cap { margin: 4px 14px 0; overflow-wrap: anywhere; line-height: 1.45; }
.cap a { font-weight: 800; margin-right: 6px; }
.cap a:hover { text-decoration: underline; }
.allcm { display: block; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 4px 14px 0; cursor: pointer; }
.allcm:hover { color: var(--text); }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 14px 12px; }
.card-foot time { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.card-foot a { font-size: 13px; font-weight: 700; color: var(--accent-2); }
.card-foot a:hover { text-decoration: underline; }
.menu { position: absolute; z-index: 60; min-width: 190px; padding: 6px; background: var(--panel-2); border: 1px solid #ffffff22; border-radius: 12px; box-shadow: 0 16px 40px #000a; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text); font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.menu button:hover { background: #ffffff12; }
.menu button.bad { color: #ff8a8a; }

/* comments */
.cmts { display: flex; flex-direction: column; min-height: 0; }
.cm-list { list-style: none; margin: 0; padding: 6px 14px; overflow-y: auto; flex: 1; min-height: 0; }
.cm-list li { display: flex; gap: 10px; padding: 8px 0; }
.cm-list .av { width: 30px; height: 30px; font-size: 13px; }
.cm-list .body { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.4; font-size: 14px; }
.cm-list .body a.nm { font-weight: 800; margin-right: 6px; }
.cm-list .body .re { color: var(--accent-2); font-weight: 700; margin-right: 4px; }
.cm-list .meta { display: flex; gap: 12px; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 600; }
.cm-list .meta button { border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; }
.cm-list .meta button:hover { color: var(--text); }
.cm-list .cl { border: 0; background: none; color: var(--muted); font-size: 14px; cursor: pointer; align-self: center; padding: 4px; }
.cm-list .cl.on { color: #ff4d6d; }
.cm-list .none { color: var(--muted); justify-content: center; padding: 26px 0; }
.cm-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #ffffff12; }
.cm-form input { flex: 1; min-width: 0; padding: 9px 14px; border-radius: 999px; border: 1px solid #ffffff22; background: #0f0d1f; color: var(--text); font: inherit; }
.cm-form button { border: 0; background: none; color: var(--accent-2); font: inherit; font-weight: 800; cursor: pointer; padding: 0 6px; }
.cm-form button:disabled { opacity: .4; cursor: default; }
.cm-reply { display: flex; justify-content: space-between; padding: 6px 14px 0; color: var(--muted); font-size: 12px; }
.cm-reply button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; }
.card .cmts { border-top: 1px solid #ffffff12; max-height: 520px; }

/* pop-ups */
.ov { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 16px; background: rgba(5, 4, 14, .72); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.sheet { width: min(520px, 100%); height: min(640px, calc(100vh - 32px)); display: flex; flex-direction: column; background: var(--panel); border: 1px solid #ffffff1f; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px #000c; }
.sheet.short { height: auto; max-height: min(560px, calc(100vh - 32px)); }
.sheet-h { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid #ffffff12; font-weight: 800; }
.sheet-h span { flex: 1; text-align: center; }
.sheet-h button { border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; width: 30px; }
.people { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.people a { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; font-weight: 700; }
.people a:hover { background: #ffffff0d; }
.people .none { color: var(--muted); padding: 20px; text-align: center; }
.howto-clip ol { margin: 0; padding: 14px 18px 4px 36px; line-height: 1.6; color: var(--muted); }
.howto-clip ol b { color: var(--text); }
.howto-clip .btn { margin: 10px 16px 16px; }

/* a profile */
.prof { max-width: 860px; margin: 0 auto; }
.prof-h { display: flex; gap: 26px; align-items: center; padding: 10px 6px 22px; border-bottom: 1px solid #ffffff14; flex-wrap: wrap; }
.prof-h .av { width: 96px; height: 96px; font-size: 42px; }
.prof-h .info { flex: 1; min-width: 220px; }
.prof-h h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.prof-h h1 .tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #ffffff14; color: var(--muted); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 10px 0 14px; }
.stats button, .stats span { border: 0; background: none; color: var(--muted); font: inherit; padding: 0; font-size: 15px; }
.stats button { cursor: pointer; }
.stats button:hover { color: var(--text); }
.stats b { color: var(--text); font-size: 17px; margin-right: 4px; }
.prof-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.prof-acts .btn { padding: 8px 16px; font-size: 14px; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 4px; }
.pgrid a { position: relative; display: block; aspect-ratio: 16 / 10; background: #000; overflow: hidden; border-radius: 4px; }
.pgrid img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s, filter .2s; }
.pgrid a:hover img { transform: scale(1.04); filter: brightness(.7); }
.pgrid .ov2 { position: absolute; left: 8px; bottom: 6px; right: 8px; display: flex; justify-content: space-between; color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 6px #000; pointer-events: none; }
.pgrid .hov { position: absolute; inset: 0; display: none; place-items: center; gap: 18px; grid-auto-flow: column; color: #fff; font-weight: 800; pointer-events: none; }
.pgrid a:hover .hov { display: grid; }
.pgrid-none { text-align: center; color: var(--muted); padding: 50px 10px; }
.back { display: inline-flex; margin: 0 0 12px; }
.single { max-width: 640px; margin: 0 auto; }
@media (max-width: 640px) {
  .soc-seg { width: 100%; } .soc-seg button { flex: 1; padding: 7px 4px; font-size: 13px; }
  .prof-h { gap: 16px; } .prof-h .av { width: 72px; height: 72px; font-size: 30px; }
  .pgrid { gap: 2px; }
}
.mob-phone .soc { padding-left: 0; padding-right: 0; }
.mob-phone .soc-top, .mob-phone .soc-note, .mob-phone .prof-h, .mob-phone .back { margin-left: 12px; margin-right: 12px; }
.mob-phone .card { border-radius: 0; border-left: 0; border-right: 0; }

<script src="games.js?v=184"></script>
<script src="account.js?v=14"></script>
<script src="call.js?v=6"></script>
<script>
/* Social (2026-11-10): gameplay clips, Instagram style. The server is the Worker's /clips/* routes (see the comment
   block above `clips()` in realtime-worker/src/worker.js); clips are recorded on play.html by clips.js.
   Views: #t=foryou|following|new|top (feeds), #u=<name> (a profile), #c=<id> (one clip with its comments).
   A view counts once a clip has played for 2 seconds (or most of a short one), once per viewer (the account, or this
   device for guests); how much of each clip people watch is sent too and helps rank For you. */
const $ = id => document.getElementById(id);
const ROOM = ((/[?&]clipsroom=([a-z0-9-]+)/i.exec(location.search) || [])[1] || '').toLowerCase(); // tests: a separate Social
const ADMIN = /[?&]admin\b/.test(location.search);
const KEEP = ROOM ? '?clipsroom=' + ROOM + (ADMIN ? '&admin' : '') : ADMIN ? '?admin' : '';
const API = () => ArcadeAccount.server + '/clips/';
const me = () => ArcadeAccount.kind() === 'online' ? ArcadeAccount.name() : '';
const lc = s => String(s || '').toLowerCase();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const hue = id => { let h = 0; for (const c of lc(id)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = n => { const s = el('span', 'av', (String(n).match(/[a-z0-9]/i) || [String(n)[0] || '?'])[0].toUpperCase()); s.setAttribute('aria-hidden', 'true'); s.style.setProperty('--h', hue(n)); return s; };
const num = n => n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'K' : (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
const plural = (n, w) => num(n) + ' ' + w + (n === 1 ? '' : 's');
const ago = t => { const s = (Date.now() - t) / 1000; if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; if (s < 604800) return Math.floor(s / 86400) + 'd'; if (s < 2592000) return Math.floor(s / 604800) + 'w'; return new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' }); };
const gameOf = id => GAMES.find(g => g.id === id);
const ls = { get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const userLink = n => '#u=' + encodeURIComponent(n);

/* ---------- the server ---------- */
function qs(o) { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o || {})) if (v !== '' && v != null) p.set(k, v); if (ROOM) p.set('r', ROOM); const s = p.toString(); return s ? '?' + s : ''; }
async function get(path, o) {
  try { const r = await fetch(API() + path + qs(Object.assign({ me: me() }, o)), { cache: 'no-store' }); const j = await r.json().catch(() => ({})); j.status = r.status; return j; }
  catch (e) { return { error: 'offline', status: 0 }; }
}
async function post(path, body, noAuth) {
  const h = { 'content-type': 'application/json' };
  if (!noAuth) { if (!me()) { needAccount(); return { error: 'auth', status: 401 }; } h.authorization = 'Bearer ' + ArcadeAccount.token(); }
  try { const r = await fetch(API() + path + qs(), { method: 'POST', headers: h, body: JSON.stringify(body), keepalive: !!noAuth }); const j = await r.json().catch(() => ({})); j.status = r.status; return j; }
  catch (e) { return { error: 'offline', status: 0 }; }
}
function needAccount() { ArcadeAccount.welcome(); }
function failed(r) { alert(r.error === 'slow' ? 'Slow down a little and try again.' : r.status === 0 ? 'Couldn’t reach the server. Check your connection.' : 'That didn’t work (' + (r.error || r.status) + ').'); }

/* ---------- who you follow, friends, blocks ---------- */
let following = new Set(ls.get('arcade-social-following', []));
function setFollowing(list) { following = new Set(list.map(lc)); ls.set('arcade-social-following', [...following]); }
function friends() { const s = ArcadeAccount.social && ArcadeAccount.social(); return s && s.f ? Object.values(s.f).filter(f => f.st === 'f').map(f => f.n) : []; }
function blocked() { const s = ArcadeAccount.social && ArcadeAccount.social(); return new Set(s && s.b ? Object.keys(s.b) : []); }
async function follow(name, on, btns) {
  const r = await post('follow', { name, on: on ? 1 : 0 });
  if (r.status !== 200) return r.status === 401 ? null : failed(r);
  if (on) following.add(lc(name)); else following.delete(lc(name));
  ls.set('arcade-social-following', [...following]);
  document.querySelectorAll('[data-follow="' + CSS.escape(lc(name)) + '"]').forEach(b => paintFollow(b, on));
  return r;
}
function paintFollow(b, on) {
  b.classList.toggle('on', on);
  if (b.classList.contains('btn')) { b.textContent = on ? 'Following' : 'Follow'; b.className = 'btn ' + (on ? 'ghost2' : ''); b.classList.toggle('on', on); }
  else b.textContent = on ? 'Following' : 'Follow';
}
function followBtn(name, big) {
  const b = el('button', big ? 'btn' : 'fol'); b.type = 'button'; b.dataset.follow = lc(name);
  paintFollow(b, following.has(lc(name)));
  b.onclick = e => { e.stopPropagation(); follow(name, !following.has(lc(name))); };
  return b;
}

/* ---------- views: once a clip has played 2 s, once per viewer; how much of it was watched ---------- */
let devId = ls.get('arcade-social-dev', '');
if (!devId) { devId = Math.random().toString(36).slice(2, 12); ls.set('arcade-social-dev', devId); }
const viewer = () => me() ? 'a:' + lc(me()) : 'd:' + devId;
const seen = ls.get('arcade-social-seen', {}); // clip id -> when this device first viewed it (For you shows those less)
const watch = new Map(), pending = new Map(); // id -> { t: seconds watched, last, counted }
function watched(c, v, card) {
  const w = watch.get(c.id) || { t: 0, last: v.currentTime };
  watch.set(c.id, w);
  let d = v.currentTime - w.last; if (d < 0 || d > 1.5) d = 0.25; // looped round, or a jump
  w.last = v.currentTime; w.t += d;
  const dur = c.dur || v.duration || 10, frac = Math.min(1, w.t / dur);
  if (!w.counted && w.t >= Math.min(2, dur * 0.8)) {
    w.counted = true;
    if (!seen[c.id]) { seen[c.id] = Date.now(); const ks = Object.keys(seen); if (ks.length > 3000) ks.sort((a, b) => seen[a] - seen[b]).slice(0, 500).forEach(k => delete seen[k]); ls.set('arcade-social-seen', seen); c.vw++; paintViews(card, c); }
  }
  if (w.counted && !w.sent) pending.set(c.id, frac);
}
function flushViews() {
  if (!pending.size) return;
  const l = [...pending].slice(0, 50); l.forEach(([id]) => { pending.delete(id); watch.get(id).sent = true; });
  post('seen', { v: viewer(), l }, true);
}
setInterval(flushViews, 15000);
addEventListener('pagehide', flushViews);
document.addEventListener('visibilitychange', () => { if (document.hidden) { flushViews(); if (playing) playing.pause(); } });

/* ---------- videos: fetched whole (so seeking works everywhere), a few kept ---------- */
const blobs = new Map();
function videoUrl(id) {
  if (blobs.has(id)) { const p = blobs.get(id); blobs.delete(id); blobs.set(id, p); return p; }
  const p = fetch(API() + 'v/' + id).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); }).then(b => URL.createObjectURL(b));
  p.catch(() => blobs.delete(id));
  blobs.set(id, p);
  while (blobs.size > 12) { const [old, op] = blobs.entries().next().value; blobs.delete(old); op.then(u => { if (!document.querySelector('video[src="' + u + '"]')) URL.revokeObjectURL(u); }, () => {}); }
  return p;
}
let muted = ls.get('arcade-social-muted', true), playing = null;
const io = new IntersectionObserver(es => {
  for (const e of es) { const v = e.target.querySelector('video'); if (e.isIntersecting && e.intersectionRatio >= 0.6) startVideo(e.target); else if (v && !v.paused) v.pause(); }
}, { threshold: [0, 0.6] });
function startVideo(box) {
  const v = box.querySelector('video'), c = box._clip;
  if (playing && playing !== v) playing.pause();
  playing = v; v.muted = muted;
  box.querySelector('.snd').textContent = muted ? '🔇' : '🔊';
  if (v.src) { v.play().catch(() => {}); return; }
  box.classList.add('loading');
  videoUrl(c.id).then(u => {
    box.classList.remove('loading');
    if (!v.src) v.src = u;
    if (playing === v) v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
    // fetch the next clip in the feed while this one plays
    const next = box.closest('.card') && box.closest('.card').nextElementSibling;
    if (next && next._clip) videoUrl(next._clip.id);
  }, () => { box.classList.remove('loading'); box.querySelector('.load').textContent = 'Couldn’t load this clip'; box.classList.add('loading'); });
}

/* ---------- For you: ranked for this player ---------- */
// The server sends its hottest clips (engagement: likes, comments, shares and how much of each view was watched,
// cooled by age) and its newest. Here they're ranked for you: games you play, games whose clips you like and people
// you follow count more, clips you've already seen far less, then no more than a couple from one player in a row.
function rank(list) {
  const played = Arcade.played(), fol = new Set([...following, ...friends().map(lc)]), likedGame = {}, now = Date.now();
  for (const c of list) if (c.me) likedGame[c.g] = (likedGame[c.g] || 0) + 1;
  let pool = list.map(c => {
    let s = c.hot || 0.001;
    if (played[c.g]) s *= 1.5;
    if (likedGame[c.g]) s *= 1 + Math.min(1, likedGame[c.g] * 0.25);
    if (fol.has(lc(c.by))) s *= 2;
    if (now - c.at < 6 * 36e5) s *= 1.3;
    if (seen[c.id]) s *= 0.12;
    if (lc(c.by) === lc(me())) s *= 0.4;
    return { c, s: s * (0.85 + Math.random() * 0.3) };
  });
  const out = [], byCount = {};
  while (pool.length) {
    let best = 0, bs = -1;
    pool.forEach((x, i) => { const k = x.s * Math.pow(0.5, byCount[lc(x.c.by)] || 0) * (out.length && out[out.length - 1].g === x.c.g ? 0.8 : 1); if (k > bs) { bs = k; best = i; } });
    const [x] = pool.splice(best, 1); out.push(x.c); byCount[lc(x.c.by)] = (byCount[lc(x.c.by)] || 0) + 1;
  }
  return out;
}

    const o = el('div', 'ov2'); o.append(el('span', '', '▶ ' + num(c.vw)), el('span', '', Math.round(c.dur) + 's'));
    const hov = el('div', 'hov'); hov.append(el('span', '', '❤️ ' + num(c.lk)), el('span', '', '💬 ' + num(c.cm)));
    a.append(img, o, hov); grid.append(a);
  }
  p.append(h, grid);
  if (!r.clips.length) p.append(el('p', 'pgrid-none', isMe ? 'You haven’t posted any clips yet. Open a game and press 🎬 Clip.' : r.n + ' hasn’t posted any clips yet.'));
  view.replaceChildren(p);
}
async function showClip(id) {
  const my = ++gen; setTab('');
  view.replaceChildren(el('p', 'soc-note', 'Loading the clip…'));
  const r = await get('one', { id });
  if (my !== gen) return;
  if (r.status !== 200) { view.replaceChildren(r.status === 404 ? empty('This clip isn’t here', 'It may have been deleted.', 'Back to For you', '#t=foryou') : offline(() => showClip(id))); return; }
  const back = el('button', 'btn ghost2 small back', '← Back'); back.type = 'button';
  back.onclick = () => { if (history.length > 1 && document.referrer.indexOf(location.pathname) >= 0) history.back(); else location.hash = 't=foryou'; };
  const wrap = el('div', 'single'); wrap.append(back, card(r.clip, { inline: true }));
  view.replaceChildren(wrap);
  document.title = r.clip.by + (r.clip.t ? ': ' + r.clip.t : '') + ' · Social · The Arcade';
}
function route() {
  closeMenu();
  if (playing) { playing.pause(); playing = null; }
  const h = decodeURIComponent(location.hash.slice(1)), [k, v] = [h.split('=')[0], h.slice(h.indexOf('=') + 1)];
  document.title = 'Social · The Arcade';
  scrollTo(0, 0);
  if (k === 'u' && v) return showUser(v);
  if (k === 'c' && v) return showClip(v);
  showFeed(k === 't' && ['foryou', 'following', 'new', 'top'].includes(v) ? v : 'foryou');
}
function howTo() {
  const d = el('div', 'howto-clip');
  d.innerHTML = '<ol><li>Open any game from <b>Games</b>.</li><li>Press <b>🎬 Clip</b> at the top (or <b>F8</b> in the game) to start recording, and again to stop. Clips can be up to a minute long.</li><li>Add a caption and press <b>Post to Social</b>. Posting needs an online Arcade account.</li></ol>';
  const b = el('a', 'btn', 'Pick a game'); b.href = 'index.html'; d.append(b);
  sheet('Make a clip', d, true);
}
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) location.hash = 't=' + b.dataset.t; });
$('make').onclick = howTo;
$('mine').onclick = () => { if (!me()) return needAccount(); location.hash = 'u=' + encodeURIComponent(me()); };
addEventListener('hashchange', route);
// keep the test room and ?admin on links within the page's own feeds (they're hash links, so nothing to do) and on
// links out to play.html (a clip posted from a test room goes to that room)
if (KEEP) document.addEventListener('click', e => { const a = e.target.closest('a[href^="play.html"]'); if (a && !/clipsroom=/.test(a.href) && ROOM) a.href += '&clipsroom=' + ROOM; }, true);
ArcadeAccount.ready().then(route);
if (ArcadeAccount.onSocial) ArcadeAccount.onSocial(() => {}); // friends and blocks arrive with the account's sync
</script>
