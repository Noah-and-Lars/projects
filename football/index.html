<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Football</title>
<meta name="description" content="Football 1.0: classic matches and Ultimate Team, in 3D in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root { --ink: #1d2440; --ink2: #4a5070; --tile: #eef0f3; --tile2: #e3e6eb; --accent: #e5245e; --lime: #c6f432; --navy: #1b2350; --font: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1520; font-family: var(--font); color: #fff; user-select: none; -webkit-user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: filter .5s; }
body.menu #c { filter: blur(7px) brightness(.92) saturate(1.15) hue-rotate(-6deg); transform: scale(1.04); }
button { font-family: var(--font); cursor: pointer; }
[hidden] { display: none !important; }
.layer { position: fixed; inset: 0; }
/* the stadium lights over the blurred background */
#glare { pointer-events: none; background:
  radial-gradient(ellipse 9% 6% at 8% 7%, rgba(255,255,255,.85), transparent 70%), radial-gradient(ellipse 9% 6% at 22% 5%, rgba(255,255,255,.8), transparent 70%),
  radial-gradient(ellipse 9% 6% at 38% 6%, rgba(255,255,255,.75), transparent 70%), radial-gradient(ellipse 9% 6% at 55% 5%, rgba(255,255,255,.75), transparent 70%),
  radial-gradient(ellipse 9% 6% at 72% 6%, rgba(255,255,255,.8), transparent 70%), radial-gradient(ellipse 9% 6% at 90% 7%, rgba(255,255,255,.85), transparent 70%),
  linear-gradient(180deg, rgba(200,214,240,.35) 0%, rgba(40,70,150,.32) 22%, rgba(30,55,130,.28) 48%, rgba(10,40,20,.05) 62%, rgba(10,40,10,.2) 100%); opacity: 0; transition: opacity .5s; }
body.menu #glare { opacity: 1; }

/* ================= the start-up screen ================= */
#boot { display: flex; align-items: center; justify-content: center; z-index: 20; }
#boot .bootIn { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: -6vh; }
.bootLogo { display: flex; align-items: center; gap: 18px; filter: drop-shadow(0 10px 30px rgba(0,0,0,.45)); animation: logoIn .9s cubic-bezier(.2,.9,.25,1) backwards; }
.bootLogo .s { width: 92px; height: 92px; border-radius: 50%; border: 6px solid #fff; display: grid; place-items: center; font-size: 30px; font-weight: 800; }
.bootLogo b { font-size: clamp(80px, 12vw, 160px); font-weight: 900; font-style: italic; letter-spacing: -2px; line-height: .9; } .bootLogo b span { color: #f5d63d; }
.bootTag { font-size: 22px; letter-spacing: 6px; text-transform: uppercase; color: #e7ecf7; text-shadow: 0 2px 8px rgba(0,0,0,.5); animation: logoIn .9s .15s cubic-bezier(.2,.9,.25,1) backwards; }
#bootPlay { margin-top: 26px; width: min(520px, 80vw); height: 96px; border: 0; background: #fff; color: var(--ink); font-size: 56px; font-weight: 900; font-style: italic; letter-spacing: 4px; position: relative; overflow: hidden;
  clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); box-shadow: 0 0 0 3px rgba(255,255,255,.3); animation: logoIn .9s .3s cubic-bezier(.2,.9,.25,1) backwards, pulse 2.2s 1.3s ease-in-out infinite; transition: background .15s, transform .15s; }
#bootPlay:hover, #bootPlay.focus { background: var(--lime); transform: scale(1.04); }
#bootPlay::after { content: ''; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); animation: shine 2.6s 1.5s ease-in-out infinite; }
.bootHint { font-size: 17px; letter-spacing: 2px; color: #cfd6e8; text-transform: uppercase; animation: logoIn .9s .5s backwards; }
@keyframes logoIn { from { opacity: 0; transform: translateY(30px) scale(.94); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.45); } }
/* PLAY flies off into the menu: the logo shrinks away, the button sweeps up into the tabs */
#boot.go .bootLogo { animation: logoOut .55s cubic-bezier(.6,0,.4,1) forwards; } #boot.go .bootTag, #boot.go .bootHint { animation: fadeOut .3s forwards; }
#boot.go #bootPlay { animation: playOut .6s cubic-bezier(.6,0,.4,1) forwards; }
@keyframes logoOut { to { opacity: 0; transform: translate(34vw, 40vh) scale(.25); } }
@keyframes playOut { 40% { transform: scale(1.08); } to { opacity: 0; transform: translate(-14vw, -12vh) scale(.28, .4); } }
@keyframes fadeOut { to { opacity: 0; } }
/* ================= main menu ================= */
#mainMenu { display: flex; align-items: center; justify-content: center; }
#mm { position: relative; width: min(820px, 94vw); }
#topbar { position: fixed; top: 4.2vh; right: 4.6vw; display: flex; align-items: stretch; height: 36px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.18)); }
#topbar .bar { display: flex; align-items: center; gap: 30px; padding: 0 18px 0 46px; background: rgba(240,242,246,.94); color: var(--ink2); font-weight: 600; font-size: 15px; letter-spacing: .4px;
  clip-path: polygon(28px 0, 100% 0, 100% 100%, 0 100%); }
#topbar .bar b { color: var(--ink); font-weight: 600; } #topbar .coin { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd38a, #d47a1c); margin-right: 6px; vertical-align: -1px; }
#topbar .cart { font-size: 20px; color: #5d6380; cursor: pointer; } #topbar .me { width: 40px; background: var(--navy); display: grid; place-items: center; font-size: 18px; cursor: pointer; }
#tabs { display: flex; width: 50%; background: rgba(226,229,235,.92); margin-bottom: 6px; }
#tabs button { flex: 1; border: 0; background: none; color: #6b7088; font-size: 19px; font-weight: 500; letter-spacing: .6px; padding: 4px 0 3px; text-transform: uppercase; }
#tabs button.on { background: #fff; color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
#grid { display: grid; grid-template-columns: 26% 25% 1fr; grid-template-rows: 233px 112px; gap: 6px; }
.tile { position: relative; background: linear-gradient(180deg, #f7f8fa, #eceef2); color: var(--ink); overflow: hidden; border: 0; text-align: left; padding: 0; cursor: pointer;
  transition: transform .14s, box-shadow .14s, filter .14s; outline: none; }
.tile::before { content: ''; position: absolute; left: 0; top: 10px; width: 3px; height: 34px; background: var(--accent); }
.tile.focus, .tile:hover { transform: translateY(-2px); box-shadow: 0 0 0 3px #fff, 0 14px 34px rgba(0,0,0,.35); z-index: 2; }
.tile h2 { margin: 0; position: absolute; left: 12px; top: 6px; font-size: 31px; font-weight: 500; line-height: .95; letter-spacing: .3px; text-transform: uppercase; color: #232a46; }
.tile .dots { position: absolute; right: 0; bottom: 0; background: #2b2f3e; padding: 5px 10px 4px 16px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%); display: flex; gap: 9px; }
.tile .dots i { width: 7px; height: 7px; border-radius: 50%; background: #8b90a3; } .tile .dots i.on { background: #fff; }
.wip { position: absolute; left: 12px; bottom: 8px; background: #2b2f3e; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 2px 7px; }
#tStory { grid-row: 1; grid-column: 1; background: linear-gradient(160deg, #6b1c7d 0%, #431257 45%, #2a0d3a 100%); }
#tStory::before { display: none; }
#tStory .pat { position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 18px, transparent 18px 40px); }
#tStory .big { position: absolute; left: 10px; top: 4px; font-size: 36px; font-weight: 900; font-style: italic; color: var(--lime); letter-spacing: .2px; line-height: 1; }
#tStory .sub { position: absolute; left: 10px; right: 10px; top: 40px; text-align: center; font-size: 15px; letter-spacing: 3px; color: #f0e8f6; font-weight: 600; }
#tStory .cont { position: absolute; left: 0; right: 0; top: 58px; text-align: center; font-size: 17px; letter-spacing: 1px; color: #fff; font-weight: 600; }
#tStory .cont::after { content: ''; display: block; width: 46%; margin: 1px auto 0; border-bottom: 1px solid rgba(255,255,255,.6); }
#tStory img#storyImg { position: absolute; left: 8%; bottom: 22px; width: 84%; height: 58%; object-fit: contain; object-position: bottom; -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent); mask-image: linear-gradient(180deg, #000 80%, transparent); }
#tStory .bigword { position: absolute; right: -10px; bottom: 40px; font-size: 92px; font-weight: 900; font-style: italic; color: rgba(255,255,255,.06); transform: rotate(-90deg); transform-origin: right bottom; }
#tStory .chap { position: absolute; left: 56px; bottom: 30px; font-size: 16px; font-weight: 600; letter-spacing: .5px; }
#tStory .chap::after { content: ''; display: block; height: 3px; width: 78px; margin-top: 2px; background: linear-gradient(90deg, var(--lime) 30%, rgba(255,255,255,.35) 30%); }
#tStory .crest { position: absolute; left: 30px; bottom: 26px; width: 24px; }
#tStory .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; }
#tStory .nav i { width: 8px; height: 8px; border-radius: 50%; background: #fff; } #tStory .nav i:first-of-type { background: var(--accent); }
#tStory .nav span { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #fff; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
#tCareer { grid-row: 1; grid-column: 1 / 3; }
#tCareer .rk { position: absolute; left: 18px; top: 72px; font-size: 13px; color: var(--ink2); font-weight: 600; }
#tCareer .ring { position: absolute; left: 62%; top: 54%; width: 150px; height: 150px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, #fff 48%, #f0f1f4 49%, #f0f1f4 60%, #fff 61%, #fff 64%, #eef0f4 65%); }
#tCareer .ring img { position: absolute; inset: 22%; width: 56%; }
#tCareer .next { position: absolute; right: 12px; bottom: 34px; text-align: right; font-size: 11px; color: var(--ink2); line-height: 1.15; } #tCareer .next b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
#tCareer .next img { position: absolute; right: -2px; top: -26px; width: 22px; }
#tUlt { grid-row: 1; grid-column: 3; }
#tUlt .club { position: absolute; left: 14px; top: 48px; display: flex; align-items: center; gap: 10px; }
#tUlt .club img { width: 40px; height: 40px; border-radius: 50%; background: #1f3c6f; } #tUlt .club b { display: block; font-size: 16px; font-weight: 600; color: #3c4260; } #tUlt .club span { font-size: 15px; color: #3c4260; font-weight: 600; }
.packs { position: absolute; right: 14px; bottom: 6px; width: 260px; height: 170px; }
.pack { position: absolute; width: 84px; height: 124px; clip-path: polygon(14% 0, 86% 0, 100% 9%, 100% 88%, 50% 100%, 0 88%, 0 9%); display: flex; flex-direction: column; justify-content: center; align-items: center;
  font-weight: 900; font-style: italic; color: #1b1b1f; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,0,0,.3); }
.pack b { font-size: 17px; letter-spacing: -.3px; transform: rotate(-35deg); line-height: .9; } .pack small { font-size: 8px; letter-spacing: 1px; transform: rotate(-35deg); font-weight: 800; }
.pack.silver { background: linear-gradient(135deg, #f6f7f9 0%, #c9cdd3 45%, #8e959e 100%); } .pack.gold { background: linear-gradient(135deg, #fff1b3 0%, #f5cc4f 40%, #b8860b 100%); } .pack.bronze { background: linear-gradient(135deg, #f3c9a0 0%, #c8834d 45%, #7a4523 100%); }
.pack.prem { background: linear-gradient(135deg, #2b2b2b 0%, #0f0f10 50%, #d4af37 51%, #f8e08e 100%); color: #f8e08e; }
#tUlt .pack.silver { left: 6px; top: 34px; transform: rotate(-7deg); } #tUlt .pack.gold { left: 82px; top: 2px; width: 92px; height: 136px; z-index: 2; transform: rotate(2deg); } #tUlt .pack.bronze { left: 160px; top: 30px; transform: rotate(8deg); }
#tKick { grid-row: 2; grid-column: 1 / 3; }
#tKick .side { position: absolute; top: 34px; display: flex; align-items: center; gap: 8px; } #tKick .side.l { left: 26px; } #tKick .side.r { right: 30px; flex-direction: row-reverse; text-align: right; }
#tKick .side img { width: 46px; } #tKick .side .rk { font-size: 15px; font-weight: 600; color: #3a4060; } #tKick .side .nm { font-size: 15px; font-weight: 600; color: #3a4060; text-transform: uppercase; }
.form { display: flex; gap: 2px; margin: 2px 0; } .form i { width: 11px; height: 11px; font-size: 9px; font-style: normal; font-weight: 700; color: #fff; display: grid; place-items: center; }
.form .W { background: #31b04a; } .form .D { background: #9aa0a6; } .form .L { background: #e53935; }
#tKick .mid { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); text-align: center; font-size: 13px; font-weight: 600; color: #3a4060; line-height: 1.1; }
#tKick .vs { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #9ba1b5; margin: 6px auto 0; display: grid; place-items: center; font-size: 13px; color: #6b7088; position: relative; }
#tKick .vs::before { content: ''; position: absolute; width: 70px; height: 1px; background: #9ba1b5; transform: rotate(-35deg); }
#tTour { grid-row: 2; grid-column: 3; width: 49.4%; } #tSkill { grid-row: 2; grid-column: 3; width: 49.4%; justify-self: end; }
.ico { position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%); font-size: 40px; color: #3c4260; }
#mmFoot { position: fixed; left: 4.6vw; bottom: 4.5vh; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 500; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.xbtn { width: 20px; height: 20px; border-radius: 50%; background: #1b1d29; display: inline-grid; place-items: center; font-size: 12px; color: #8fb4ff; font-weight: 800; }
#logo { position: fixed; right: 4.6vw; bottom: 3.8vh; display: flex; align-items: center; gap: 8px; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
#logo .s { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; letter-spacing: .5px; line-height: .8; text-align: center; }
#logo b { font-size: 38px; font-weight: 900; font-style: italic; letter-spacing: -.5px; } #logo b span { color: #f5d63d; }
#toast { position: fixed; left: 50%; bottom: 14vh; transform: translateX(-50%); background: rgba(20,24,40,.92); padding: 10px 18px; font-size: 18px; letter-spacing: .5px; border-left: 4px solid var(--accent); z-index: 90; transition: opacity .3s; }
/* the other tabs */
.tabPane { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tabPane .tile { height: 172px; } .tabPane .tile p { position: absolute; left: 14px; right: 14px; top: 50px; margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #4a5070; }
.tabPane .tile .val { position: absolute; left: 14px; bottom: 14px; font-size: 30px; font-weight: 700; color: var(--accent); text-transform: uppercase; }
.tabPane .tile .arr { position: absolute; right: 14px; bottom: 16px; font-size: 22px; color: #9aa0b5; }

/* ================= menu animations: tiles come in one after another, screens slide out, buttons press ================= */
@keyframes tileIn { from { opacity: 0; transform: translateY(18px) scale(.97); } }
@keyframes leave { to { opacity: 0; transform: translateX(-30px); } }
@keyframes boxIn { from { opacity: 0; transform: translateY(14px) scale(.95); } }
@keyframes shine { from { transform: translateX(-120%) skewX(-20deg); } to { transform: translateX(260%) skewX(-20deg); } }
.in { animation: tileIn .42s cubic-bezier(.2, .9, .25, 1) backwards; }
.leaving { animation: leave .17s ease-in forwards !important; pointer-events: none; }
.box { animation: boxIn .3s cubic-bezier(.2, .9, .25, 1); }
.tile::after, .btn::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 34%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-120%) skewX(-20deg); pointer-events: none; }
.btn { position: relative; overflow: hidden; }
.tile.focus::after, .tile:hover::after, .btn:hover::after, .btn.focus::after { animation: shine .7s ease-out; }
.tile:active { transform: translateY(0) scale(.97) !important; transition-duration: .06s; } .btn:active { transform: scale(.95) !important; transition-duration: .06s; }
.pc { transition: transform .15s, filter .15s; } .pc:active { transform: scale(.96); }
#tabs button { transition: background .15s, color .15s, box-shadow .2s; } #tabs button:hover { color: var(--ink); background: rgba(255,255,255,.6); }
.tile .val, .tile .num { transition: transform .2s; } .tile:hover .val, .tile:hover .num { transform: translateX(4px); }
/* ================= full-screen panels (team select, ultimate, results) ================= */
.panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 3.5vh 4vw; background: linear-gradient(180deg, rgba(10,16,32,.55), rgba(10,16,32,.78)); overflow: auto; }
.panel h1 { margin: 0 0 4px; font-size: 44px; font-weight: 800; font-style: italic; letter-spacing: .5px; text-transform: uppercase; }
.panel .eyebrow { font-size: 15px; letter-spacing: 3px; color: var(--lime); font-weight: 700; text-transform: uppercase; }
.btn { border: 0; padding: 10px 26px; font-size: 21px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; background: #fff; color: var(--ink); transition: transform .12s, background .12s; }
.btn:hover, .btn.focus { transform: translateY(-2px); background: var(--lime); }
.btn.alt { background: rgba(255,255,255,.14); color: #fff; } .btn.alt:hover { background: rgba(255,255,255,.26); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
/* team select */
#ts .teams { display: grid; grid-template-columns: 1fr 120px 1fr; gap: 10px; width: min(980px, 100%); margin: 18px 0; align-items: center; }
.tcard { background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(232,235,241,.96)); color: var(--ink); padding: 18px; text-align: center; position: relative; min-height: 330px; }
.tcard .who { position: absolute; left: 0; top: 0; background: var(--navy); color: #fff; padding: 4px 12px; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
.tcard img { width: 130px; height: 150px; object-fit: contain; margin-top: 18px; filter: drop-shadow(0 8px 12px rgba(0,0,0,.25)); }
.tcard h3 { margin: 6px 0 0; font-size: 36px; font-weight: 800; text-transform: uppercase; }
.tcard .ovr { display: flex; justify-content: center; gap: 18px; margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--ink2); } .tcard .ovr b { display: block; font-size: 28px; color: var(--ink); }
.tcard .arrows { position: absolute; top: 46%; left: 6px; right: 6px; display: flex; justify-content: space-between; pointer-events: none; }
.tcard .arrows button { pointer-events: auto; width: 44px; height: 64px; border: 0; background: rgba(27,35,80,.1); font-size: 26px; color: var(--ink); } .tcard .arrows button:hover { background: var(--lime); }
.tcard .stars { color: #f5b82e; font-size: 20px; letter-spacing: 2px; margin-top: 2px; }
.vsBig { text-align: center; font-size: 56px; font-weight: 900; font-style: italic; color: #fff; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 6px; width: min(980px, 100%); margin-bottom: 14px; }
.opt { background: rgba(255,255,255,.1); padding: 8px 12px; border: 0; color: #fff; text-align: left; } .opt small { display: block; font-size: 13px; letter-spacing: 1.5px; color: #b6bdd6; text-transform: uppercase; font-weight: 600; }
.opt b { font-size: 22px; font-weight: 700; } .opt:hover { background: rgba(255,255,255,.2); }

/* ================= HUD ================= */
#hud { pointer-events: none; }
#sb { position: absolute; left: 22px; top: 18px; display: flex; align-items: stretch; height: 30px; font-size: 21px; font-weight: 700; letter-spacing: .5px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
#sb .lg { width: 34px; background: #fff; color: #3d1d6b; display: grid; place-items: center; font-size: 18px; }
#sb .t { background: #3d1d6b; display: flex; align-items: center; gap: 7px; padding: 0 12px; } #sb .t i { width: 6px; height: 22px; display: block; }
#sb .s { background: #17d1a6; color: #12162a; padding: 0 12px; display: flex; align-items: center; font-size: 22px; min-width: 64px; justify-content: center; }
#clk { position: absolute; left: 56px; top: 48px; background: #fff; color: #12162a; font-size: 20px; font-weight: 700; padding: 1px 10px; display: flex; gap: 6px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
#clk .stp { background: #12162a; color: #fff; padding: 0 5px; margin-right: -10px; } #clk .half { color: #6a6f88; font-size: 14px; align-self: center; }
#mini { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 168px; height: 104px; background: rgba(20,40,20,.35); border: 1px solid rgba(255,255,255,.55); }
.tag { position: absolute; bottom: 22px; height: 30px; display: flex; align-items: center; font-size: 19px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.tag .in { background: #241a4b; padding: 0 16px; height: 100%; display: flex; align-items: center; min-width: 170px; position: relative; }
.tag .bar { position: absolute; left: 0; top: -4px; height: 4px; background: #fff; transition: width .3s; } .tag .bg { position: absolute; left: 0; right: 0; top: -4px; height: 4px; background: rgba(255,255,255,.25); }

// the shirt: pattern, collar, number and name on the back; the front shows a small number
function shirtTexture(kit, num, name) {
  return canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = kit.shirt; g.fillRect(0, 0, w, h);
    g.fillStyle = kit.trim;
    if (kit.pattern === 'stripes') for (let i = 0; i < 10; i++) g.fillRect(i * w / 10 + 12, 0, w / 20, h);
    if (kit.pattern === 'checks') { const s = w / 16; for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) if (((x + y) / s) % 2 === 0) g.fillRect(x, y, s, s); }
    if (kit.pattern === 'hoops') for (let y = 0; y < h; y += 36) g.fillRect(0, y, w, 16);
    g.fillRect(0, 0, w, 10); // collar
    // back: name and number (u = 0.5 is the back of the cylinder)
    g.fillStyle = kit.pattern === 'checks' || kit.pattern === 'stripes' ? '#ffffff' : kit.shirt; if (kit.pattern !== 'plain') g.fillRect(w * 0.5 - 70, 26, 140, 150);
    g.fillStyle = kit.num; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 22px "Barlow Condensed", Arial Narrow, Arial, sans-serif'; g.fillText(String(name).toUpperCase(), w * 0.5, 40);
    g.font = '800 104px "Barlow Condensed", Arial Narrow, Arial, sans-serif'; g.fillText(String(num), w * 0.5, 118);
    // front: number on the chest and a badge
    g.font = '800 40px "Barlow Condensed", Arial Narrow, Arial, sans-serif'; g.fillText(String(num), w * 0.035, 108); g.fillText(String(num), w * 1.035 - w, 108);
    g.fillStyle = kit.trim; g.beginPath(); g.arc(w * 0.93, 64, 13, 0, Math.PI * 2); g.fill();
  });
}

  const sockMat = stdMat(kit.socks, 0.8), bootMat = stdMat(BOOTS[(r() * BOOTS.length) | 0], 0.4), trimMat = stdMat(kit.trim, 0.7);
  const gloves = opts.gk ? stdMat('#f2f2f2', 0.6) : skin;
  const mesh = (g, m, parent, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = true; parent.add(o); return o; };

  mesh(GEO.pelvis, shortsMat, hips, 0, 0.0);
  const spine = new THREE.Group(); spine.position.y = 0.1; hips.add(spine);
  mesh(GEO.torso, shirtMat, spine); const ch = mesh(GEO.chest, sleeveMat, spine, 0, 0.56); ch.scale.y = 1;
  const neck = new THREE.Group(); neck.position.y = 0.6; spine.add(neck);

  const head = new THREE.Group(); head.position.y = 0.17; neck.add(head);
  mesh(GEO.head, skin, head); const bald = r() < 0.12;
  if (!bald) { const h = mesh(GEO.hair, stdMat(hairC, 0.9), head, 0, 0.02, -0.01); h.rotation.x = -0.25; }
  mesh(GEO.nose, skin, head, 0, -0.005, 0.11); for (const s of [-1, 1]) { mesh(GEO.ear, skin, head, s * 0.1, 0, 0); mesh(GEO.eye, stdMat('#1a1410', 0.3), head, s * 0.038, 0.025, 0.098); const b = mesh(GEO.brow, stdMat(hairC, 0.9), head, s * 0.04, 0.052, 0.1); b.rotation.z = s * -0.12; }
  r(); // (no beards: the shape covered half the face)
  const arm = s => {
    const sh = new THREE.Group(); sh.position.set(s * 0.235, 0.5, 0); spine.add(sh);
    mesh(GEO.sleeve, opts.longSleeve ? sleeveMat : sleeveMat, sh); mesh(GEO.upper, opts.longSleeve ? sleeveMat : skin, sh, 0, -0.16);
    const el = new THREE.Group(); el.position.y = -0.29; sh.add(el);

    const kn = new THREE.Group(); kn.position.y = -0.43; hp.add(kn);

}

// the ball: a panelled texture, rolling with its speed
const ball3D = (() => {
  const tex = canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = '#f7f7f7'; g.fillRect(0, 0, w, h);
    const cols = ['#1b1b1f', '#e5245e', '#1b1b1f', '#1fb6ff'];
    for (let i = 0; i < 12; i++) { const x = (i % 6) * w / 6 + (i < 6 ? 0 : w / 12), y = i < 6 ? h * 0.3 : h * 0.72; g.fillStyle = cols[i % cols.length];
      g.beginPath(); for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 - Math.PI / 2; g.lineTo(x + Math.cos(a) * 22 + 20, y + Math.sin(a) * 18); } g.fill(); }
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 2; for (let i = 0; i < 8; i++) { g.beginPath(); g.moveTo(i * w / 8, 0); g.lineTo(i * w / 8 + 30, h); g.stroke(); }
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 18), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45 }));
  m.castShadow = true; scene.add(m); return m;
})();

// ---------- Input: keyboard, mouse, controller and touch ----------
// Buttons have neutral names; what they do depends on whether your team has the ball (see userInput in match.js):
//   S  pass / slide tackle        A  through ball / rush the keeper    D  lob, cross / tackle

//   space (left mouse)  shoot / tackle      rmb (right mouse)  contain      sprint      switch (change player)

const LAYOUTS = {
  fifa: { move: { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'] },
    keys: { KeyS: ['S'], KeyA: ['A'], KeyD: ['D'], KeyW: ['W'], KeyZ: ['Z'], KeyQ: ['Q', 'switch'], Space: ['space', 'skip'], ShiftLeft: ['sprint'], ShiftRight: ['sprint'] },
    label: { skip: 'Space', S: 'S', A: 'A', D: 'D', W: 'W', Z: 'Z', Q: 'Q', space: 'Space', sprint: 'Shift', switch: 'Q', rmb: 'Right click', lmb: 'Left click', move: '← ↑ → ↓' } },
  classic: { move: { up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'] },
    keys: { KeyJ: ['S'], KeyL: ['A'], KeyU: ['D'], KeyK: ['space'], KeyE: ['W'], KeyZ: ['Z'], KeyX: ['Q'], KeyR: ['rmb'], ShiftLeft: ['sprint'], ShiftRight: ['sprint'], KeyQ: ['switch'], Space: ['skip'] },
    label: { skip: 'Space', S: 'J', A: 'L', D: 'U', W: 'E', Z: 'Z', Q: 'X', space: 'K', sprint: 'Shift', switch: 'Q', rmb: 'R', lmb: 'Left click', move: 'WASD' } },
};

  ['S', 'Ground pass / sliding tackle'], ['A', 'Through pass / rush keeper'], ['D', 'Lob, cross / tackle'], ['W', 'Shield / jockey'], ['space', 'Shoot / tackle'],
  ['Z', 'Finesse shot'], ['Q', 'Driven ground pass'], ['rmb', 'Contain']];

  Enter: 'Enter', Tab: 'Tab', CapsLock: 'Caps', Backspace: 'Backspace', Backquote: '`', Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Backslash: '\\', Minus: '-', Equal: '=' };

const inp = { keys: {}, held: {}, pressed: {}, released: {}, stick: { x: 0, y: 0 }, touch: { x: 0, y: 0, on: false }, padPrev: {}, padAct: {}, device: 'kb', attacking: true };
const press = a => { if (!inp.held[a]) inp.pressed[a] = true; inp.held[a] = true; };

// a player portrait (for the Story tile), rendered with the game's own renderer
function portrait(kit, num, name) {
  const W = 300, H = 400, sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(26, W / H, 0.1, 50);
  sc.add(new THREE.HemisphereLight(0xf0e6ff, 0x3a2050, 0.9)); const k = new THREE.DirectionalLight(0xffffff, 1.4); k.position.set(2, 3, 4); sc.add(k);
  const r2 = new THREE.DirectionalLight(0xd36bff, 1.2); r2.position.set(-3, 2, -2); sc.add(r2);
  const p = makeFootballer(kit, num, name, { skin: '#5a3420' }); pose(p, ANIM.run, 2, 0, 0, 1); p.rotation.y = 0.35; sc.add(p);
  cam.position.set(0.5, 1.6, 1.45); cam.lookAt(0, 1.5, 0);
  const rt = new THREE.WebGLRenderTarget(W, H); rt.texture.encoding = THREE.sRGBEncoding;
  const prevC = renderer.getClearColor(new THREE.Color()), prevA = renderer.getClearAlpha();
  renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(sc, cam);
  const buf = new Uint8Array(W * H * 4); renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf); renderer.setRenderTarget(null); renderer.setClearColor(prevC, prevA); rt.dispose();
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), img = g.createImageData(W, H);
  for (let y = 0; y < H; y++) img.data.set(buf.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4);
  g.putImageData(img, 0, 0); return c.toDataURL();
}

  function newRing() { if (D.ringObjs) for (const o of D.ringObjs) { scene.remove(o); D.objs.splice(D.objs.indexOf(o), 1); }
    D.ring = { x: rand(-5, 25), z: rand(-24, 24) }; const P0 = U().players[6]; D.ringDist = Math.hypot(D.ring.x - P0.pos.x, D.ring.z - P0.pos.z); D.ringObjs = [ring(D.ring.x, D.ring.z, 4.5, 0xffffff, 0.3), disc(D.ring.x, D.ring.z, 4.5, 0x1fb6ff), disc(D.ring.x, D.ring.z, 1.6, 0xff2d55), ring(D.ring.x, D.ring.z, 1.6, 0xffffff, 0.15)]; }
  function newAttacker() { const A = C().players[9], a = rand(0, Math.PI * 2); place(A, Math.cos(a) * 9, Math.sin(a) * 9); const B = M.ball; B.owner = A; B.held = false; B.vel.set(0, 0, 0); B.pos.copy(A.pos); B.shot = B.pass = null; A.cool = 0; A.drillAI = true; M.phase = 'play'; M.restart = null; D.wander = null; const P = U().players[2]; P.slide = null; P.busy = 0; }
  function corners() { const gx = PL; for (const s of [-1, 1]) { panel(gx - 0.05, 2.0, s * 3.0, 1.3, 0.8, 0xc6f432); panel(gx - 0.05, 0.5, s * 3.0, 1.3, 0.8, 0x1fb6ff); } }
  function nextPen() { if (D.round >= D.def.rounds) { finish(); return; } D.round++; D.dead = 0; M.ball.shot = null; startRestart('penalty', C(), C().dir * (PL - 11), 0); HUD.hint('penaltyKeep'); M.ctrl = U().players[0]; }
  function nextFk() { if (D.round >= D.def.rounds) { finish(); return; } D.round++; D.dead = 0; const x = PL - rand(19, 27), z = rand(-13, 13); for (const [i, k] of [5, 6, 7, 8].entries()) place(C().players[k], 0, 0); startRestart('freekick', U(), x, z); }
  function newShot() { const P = U().players[9], K = C().players[0]; D.dead = 0; giveBall(P, PL - rand(15, 26), rand(-14, 14)); place(K, PL - 1, 0); K.dive = null; K.busy = 0; }
  function newCounter() { const [L, S, R] = [8, 9, 10].map(k => U().players[k]); place(L, 0, -16); place(R, 0, 16); giveBall(S, -2, 0); [L, R].forEach(p => p.face = angTo(1, 0));
    const [K, c1, c2] = [0, 2, 3].map(k => C().players[k]); place(K, PL - 1, 0); place(c1, 24, -6); place(c2, 26, 7); D.startT = M.simT; M.ctrl = S; }
  // ---------- running a drill ----------
  function start(def) {
    MENUS.startMatch({ mode: 'skill', drill: def.id, home: { nation: profile.fav || 'ENG', ids: bestXI(profile.fav || 'ENG') }, away: { nation: 'GER', ids: bestXI('GER') }, halfMin: 99, diff: 2 });
    D = { def, score: 0, t: def.time || 0, objs: [], busy: false, timer: 0, lockCtrl: !!def.lock, round: 0 };
    M.drill = D; M.phase = 'play'; M.restart = null; M.pt = 0; HUD.hint(null); HUD.banner(null);
    document.body.classList.add('drill'); def.setup(); paintHud();
  }
  function ev(e, a) { if (D && D.def.ev) D.def.ev(e, a); }
  function step(dt, inRestart) {
    if (!D) return;
    if (D.busy) { if ((D.timer -= dt) <= 0) { D.busy = false; const f = D.then; D.then = null; if (f) f(); } }
    else if (!inRestart) D.def.step && D.def.step(dt);
    if (D.def.time && !inRestart) { D.t -= dt; if (D.t <= 0) { D.t = 0; finish(); return; } }
    paintHud();
  }
  const tierOf = (d, s) => { let t = -1; d.tiers.forEach((v, i) => { if (s >= v) t = i; }); return t; };
  function paintHud() {
    let el = $('drillHud'); if (!el) { el = document.createElement('div'); el.id = 'drillHud'; $('hud').appendChild(el); }
    if (!D) { el.hidden = true; return; } el.hidden = false;
    const d = D.def, ti = tierOf(d, D.score), nx = d.tiers[ti + 1], max = d.tiers[3];
    el.innerHTML = `<div class="dh1"><span>${d.cat}</span><b>${d.name}</b></div><div class="dh2"><b>${fmt(D.score)}</b><span>${d.time ? Math.ceil(D.t) + 's' : `${d.rounds === 10 ? 'Penalty' : 'Kick'} ${D.round}/${d.rounds}`}</span></div>
      <div class="dbar"><i style="width:${Math.min(100, D.score / max * 100)}%"></i>${d.tiers.map((v, i) => `<em style="left:${v / max * 100}%;background:${TIERS[i][1]}"></em>`).join('')}</div>
      <div class="dnext">${ti >= 0 ? `<b style="color:${TIERS[ti][1]}">${TIERS[ti][0]}</b>` : ''}${nx ? ` · ${TIERS[ti + 1][0]} at ${fmt(nx)}` : ' · Top tier!'}</div>`;
  }
  function finish() {
    if (!D || D.done) return; D.done = true; M.phase = 'fulltime'; HUD.hint(null);
    const d = D.def, s = D.score, ti = tierOf(d, s); profile.skills = profile.skills || {}; profile.skillTier = profile.skillTier || {};
    const best = Math.max(profile.skills[d.id] || 0, s), prevT = profile.skillTier[d.id] ?? -1; let coins = 0;
    for (let i = prevT + 1; i <= ti; i++) coins += TIERS[i][2];
    profile.skills[d.id] = best; if (ti > prevT) profile.skillTier[d.id] = ti; profile.coins += coins; const up = addXp(100 + Math.round(s / 50)); saveProfile();
    const o = MENUS.overlay(`<span class="wipTag" style="background:${ti >= 0 ? TIERS[ti][1] : '#6b7088'};color:#111">${ti >= 0 ? TIERS[ti][0].toUpperCase() : 'NO TIER YET'}</span><h2>${d.name}</h2>
      <div class="scoreLine" style="font-size:60px">${fmt(s)}</div><p style="text-align:center">Best: <b>${fmt(best)}</b>${s >= best && s > 0 ? ' · New best!' : ''}</p>
      <div class="tierRow">${d.tiers.map((v, i) => `<div class="${s >= v ? 'got' : ''}" style="--tc:${TIERS[i][1]}"><b>${TIERS[i][0]}</b><span>${fmt(v)}</span></div>`).join('')}</div>
      ${coins || up ? `<div class="reward">${coins ? `Coins <span>+${fmt(coins)}</span>` : ''} ${up ? '<span>LEVEL UP!</span>' : ''}</div>` : ''}
      <div class="row" style="justify-content:flex-start"><button class="btn" data-s="again">Try again</button><button class="btn alt" data-s="back">Skill Games</button></div>`);
    o.onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; sfx.click(); o.remove(); const def = D.def; end(); if (b.dataset.s === 'again') start(def); else MENUS.swap(open); };
  }
  function end() { if (D) { clear(); D = null; } document.body.classList.remove('drill'); paintHud(); }
  // ---------- the Skill Games screen ----------
  function open() {
    end(); MENUS.screen = 'skills'; $('mainMenu').hidden = true; document.body.className = 'menu'; $('hud').hidden = true; if (typeof M !== 'undefined' && M) disposeMatch(); MUSIC.start();
    const best = profile.skills || {}, tiers = profile.skillTier || {};
    ui.innerHTML = `<div class="panel" id="skills"><div class="eyebrow">Learn to play</div><h1>Skill Games</h1>
      <p style="font-family:system-ui;font-size:14px;color:#c9cfe6;margin:0 0 12px">Nine drills, one for each part of your game. Reach Bronze, Silver, Gold and the Skill Challenge for coins.</p>
      <div class="skGrid">${DRILLS.map(d => { const t = tiers[d.id] ?? -1; return `<button class="tile skTile" data-d="${d.id}"><h2>${d.cat}</h2><div class="ico">${d.icon}</div><p><b>${d.name}</b><br>${best[d.id] ? 'Best ' + fmt(best[d.id]) : 'Not played yet'}</p>
        <div class="medals">${TIERS.map((T, i) => `<i style="background:${i <= t ? T[1] : 'rgba(0,0,0,.12)'}" title="${T[0]}"></i>`).join('')}</div></button>`; }).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn alt" data-b>Back</button></div></div>`;
    ui.onclick = e => { const b = e.target.closest('[data-d],[data-b]'); if (!b) return; sfx.click(); if (b.dataset.b !== undefined) { MENUS.showMain(); return; } intro(DRILLS.find(d => d.id === b.dataset.d)); };
  }
  function intro(d) {
    const k = (b, c) => `<kbd>${keyLabel(b, c)}</kbd>`;
    const keys = { basics: `${k('S', 'attack')} pass`, dribble: `${k('move')} move · ${k('sprint')} sprint · ${k('W', 'attack')} shield`, gpass: `${k('S', 'attack')} pass · ${k('Q', 'attack')} driven pass`, lob: `${k('D', 'attack')} lob (aim with ${k('move')})`,
      defend: `${k('D', 'defend')} tackle · ${k('S', 'defend')} slide · ${k('W', 'defend')} jockey`, keeper: `hold ${k('move')} left or right before the kick`, fk: `${k('space', 'attack')} shoot (hold) · ${k('Z', 'attack')} finesse`, shoot: `${k('space', 'attack')} shoot · ${k('Z', 'attack')} finesse`, counter: 'all the attacking controls' };
    const o = MENUS.overlay(`<span class="wipTag">${d.cat.toUpperCase()}</span><h2>${d.name}</h2><p>${d.how}</p><p>Controls: ${keys[d.id]}</p>
      <div class="tierRow">${d.tiers.map((v, i) => `<div style="--tc:${TIERS[i][1]}"><b>${TIERS[i][0]}</b><span>${fmt(v)}</span></div>`).join('')}</div>
      <div class="row" style="justify-content:flex-start"><button class="btn" data-go>Start ▶</button><button class="btn alt" data-x>Back</button></div>`);
    o.onclick = e => { const b = e.target.closest('[data-go],[data-x]'); if (!b) return; sfx.click(); o.remove(); if (b.dataset.go !== undefined) start(d); };
  }
  return { open, start, step, ev, end, get on() { return !!D; }, DRILLS };
})();

// ---------- Start-up and the main loop ----------
buildStadium(['#c8102e', '#ffffff', '#1c3f94'], ['#f5b82e', '#1b1b1f']); buildBoards(); buildTouch();
let lastT = performance.now(), simAcc = 0, clockT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; clockT += dt;
  pollInput(dt);
  const playing = MENUS.screen === 'game' && M;
  if (playing && !M.paused && M.phase !== 'halftime' && M.phase !== 'fulltime') {
    simAcc += dt; let n = 0;
    while (simAcc >= 1 / 60 && n < 6) { simStep(1 / 60); simAcc -= 1 / 60; n++; if (n === 1) clearPressed(); }
    if (M.phase !== 'replay') drawMatch();
    updateCamera(dt);
  } else if (!playing) { menuCam(clockT); ctrlMarker.visible = false; ball3D.position.set(-4, BALL_R, 6); clearPressed(); }
  else clearPressed();
  if (playing) HUD.update(dt);
  updateNets(dt); updateCrowd(clockT); updateBoards(dt); sfx.tick(crowd.excite, !!playing);
  renderer.render(scene, camera); FPS.tick(now);
}
MENUS.boot();
requestAnimationFrame(frame);

</script>
