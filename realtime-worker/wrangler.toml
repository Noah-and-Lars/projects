name = "arcade-realtime"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account"]

[[durable_objects.bindings]]
name = "CHAT"
class_name = "Chat"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Chat", "Directory"]

[[durable_objects.bindings]]
name = "TALLY"
class_name = "Tally"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Tally"]
