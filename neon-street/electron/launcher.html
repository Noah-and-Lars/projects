<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Neon Street</title>
  <style>
    :root { --accent: #ff3fb4; --accent2: #35e0ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #05050a; color: #e8e8f0; font: 14px/1.5 system-ui, Segoe UI, sans-serif; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 70%, rgba(255,63,180,0.16), rgba(5,5,10,1) 65%); }
    .card { width: 560px; padding: 34px 40px 28px; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; background: rgba(8,8,14,0.78); }
    h1 { margin: 0 0 4px; font-weight: 700; letter-spacing: 0.08em; font-size: 28px; text-transform: uppercase; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { margin: 0 0 22px; opacity: 0.7; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.06); }
    .row:first-of-type { border-top: 0; }
    label.name { opacity: 0.85; }
    .presets { display: flex; gap: 6px; }
    .presets button { padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: inherit; cursor: pointer; font: inherit; }
    .presets button.on { border-color: var(--accent2); background: rgba(53,224,255,0.14); color: #fff; }
    select, input[type=checkbox] { font: inherit; color: inherit; background: #101018; border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 6px 10px; accent-color: var(--accent2); }
    .launch { margin-top: 20px; width: 100%; padding: 13px; font: inherit; font-size: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; border: 0; border-radius: 10px; cursor: pointer; background: linear-gradient(90deg, var(--accent), #8a4bff); }
    .launch:hover { filter: brightness(1.1); }
    .gpu { margin-top: 14px; font-size: 12px; opacity: 0.6; min-height: 18px; }
    .gpu.bad { color: #ff7a7a; opacity: 1; }
    .keys { margin-top: 10px; font-size: 12px; opacity: 0.5; }
    kbd { font: inherit; padding: 0 5px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; }
    .quit { position: fixed; right: 14px; bottom: 10px; font-size: 12px; opacity: 0.5; background: none; border: 0; color: inherit; cursor: pointer; }
    .quit:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Neon Street</h1>
    <p class="sub">Path-traced rainy street. Pick a preset and go.</p>

    <div class="row">
      <label class="name">Preset</label>
      <div class="presets" id="presets">
        <button data-p="low">Low</button>
        <button data-p="medium">Medium</button>
        <button data-p="high" class="on">High</button>
        <button data-p="ultra">Ultra</button>
        <button data-p="melt">Melt</button>
      </div>
    </div>
    <div class="row">
      <label class="name" for="res">Display</label>
      <select id="res">
        <option value="full">Fullscreen (desktop resolution)</option>
        <option value="2560x1440">Windowed 2560 × 1440</option>
        <option value="1920x1080">Windowed 1920 × 1080</option>
        <option value="1280x720">Windowed 1280 × 720</option>
      </select>
    </div>
    <div class="row">
      <label class="name" for="nosync">Unlock frame rate (no vsync)</label>
      <input type="checkbox" id="nosync" />
    </div>
    <div class="row">
      <label class="name" for="intro">Play the wake-up intro</label>
      <input type="checkbox" id="intro" checked />
    </div>
    <div class="row">
      <label class="name" for="stats">Show stats overlay</label>
      <input type="checkbox" id="stats" checked />
    </div>

    <button class="launch" id="launch">Launch</button>
    <div class="gpu" id="gpu">Checking GPU…</div>
    <div class="keys"><kbd>F11</kbd> fullscreen &middot; <kbd>F10</kbd> back to this screen &middot; <kbd>Esc</kbd> settings in game &middot; <kbd>Alt</kbd>+<kbd>F4</kbd> quit</div>
  </div>
  <button class="quit" id="quit">Quit</button>

  <script>
    const $ = (s) => document.querySelector(s);
    let preset = localStorage.getItem('neon.preset') || 'high';
    const presetBtns = [...$('#presets').children];
    const paint = () => presetBtns.forEach((b) => b.classList.toggle('on', b.dataset.p === preset));
    presetBtns.forEach((b) => b.addEventListener('click', () => { preset = b.dataset.p; localStorage.setItem('neon.preset', preset); paint(); }));
    paint();
    for (const id of ['res', 'nosync', 'intro', 'stats']) {
      const el = $('#' + id);
      const saved = localStorage.getItem('neon.' + id);
      if (saved !== null) { if (el.type === 'checkbox') el.checked = saved === '1'; else el.value = saved; }
      el.addEventListener('change', () => localStorage.setItem('neon.' + id, el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value));
    }

    async function gpuInfo() {
      const el = $('#gpu');
      try {
        if (!navigator.gpu) throw new Error('WebGPU is not available in this build');
        const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
        if (!adapter) throw new Error('No WebGPU adapter found. Update your graphics driver.');
        const info = adapter.info || {};
        const name = [info.description, info.vendor, info.architecture].filter(Boolean).join(' · ') || 'unknown adapter';
        const soft = /swiftshader|llvmpipe|software/i.test(name);
        el.textContent = `GPU: ${name}${soft ? ' (software renderer: this will be very slow)' : ''}`;
        el.classList.toggle('bad', soft);
        const app = await window.neonApp.info();
        el.textContent += ` · Chromium ${app.chrome}${app.nosync ? ' · vsync off' : ''}`;
      } catch (e) {
        el.textContent = e.message;
        el.classList.add('bad');
      }
    }
    gpuInfo();

    $('#launch').addEventListener('click', () => {
      const res = $('#res').value;
      const fullscreen = res === 'full';
      const [w, h] = fullscreen ? [0, 0] : res.split('x').map(Number);
      const q = new URLSearchParams({ preset });
      if (!$('#intro').checked) q.set('intro', '0');
      if (!$('#stats').checked) q.set('hud', '0');
      window.neonApp.launch({ query: q.toString(), fullscreen, width: w, height: h, nosync: $('#nosync').checked });
    });
    $('#quit').addEventListener('click', () => window.neonApp.quit());
    window.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#launch').click(); });
  </script>
</body>
</html>
