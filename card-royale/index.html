<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script id="arcade-name">
// your name in this game is your arcade account's name (set on the arcade home page, or your local account's).
(() => {
  let n = '';
  try { const a = JSON.parse(localStorage.getItem('arcade-acct') || 'null'), l = JSON.parse(localStorage.getItem('arcade-local') || 'null'); n = String((a && a.name) || (l && l.name) || ''); } catch (e) {}
  window.ARCADE_NAME = n;
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Card Royale</title>
<meta name="theme-color" content="#1d5c99">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0c2440;font-family:"Lilita One","Arial Black",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}
.o,.o *{text-shadow:-1.5px -1.5px 0 #1b1b26,1.5px -1.5px 0 #1b1b26,-1.5px 1.5px 0 #1b1b26,1.5px 1.5px 0 #1b1b26,0 3px 0 #1b1b26}
.o1{text-shadow:-1px -1px 0 #1b1b26,1px -1px 0 #1b1b26,-1px 1px 0 #1b1b26,1px 1px 0 #1b1b26,0 2px 0 #1b1b26}
#stage{position:fixed;inset:0;display:flex;justify-content:center;background:#0c2440 repeating-linear-gradient(45deg,#0e2a4a 0 22px,#0c2440 22px 44px)}
#app{position:relative;height:100%;width:min(100vw,calc(100dvh * .5625));min-width:300px;overflow:hidden;background:#1d5c99;box-shadow:0 0 60px rgba(0,0,0,.6)}
@media (max-aspect-ratio:9/16){#app{width:100vw}}
/* ---------- the blue diamond backdrop ---------- */
.blue{background-color:#1b5a98;background-image:linear-gradient(45deg,rgba(255,255,255,.055) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.055) 75%),linear-gradient(45deg,rgba(255,255,255,.055) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.055) 75%),radial-gradient(ellipse at 50% 35%,#2a78c4,#174f88 70%);background-size:46px 46px,46px 46px,100% 100%;background-position:0 0,23px 23px,0 0}
#menu{position:absolute;inset:0;display:flex;flex-direction:column}
#pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px 10px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.page::-webkit-scrollbar{width:0}
/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:6px;padding:6px 8px 5px;background:linear-gradient(#0a1a2c,#0b2036);border-bottom:2px solid #06101c;flex:none}
.lvl{position:relative;width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:19px}
.lvl:before{content:"";position:absolute;inset:0;background:linear-gradient(#5fb8ff,#1d6fd0);clip-path:polygon(50% 0,61% 12%,77% 7%,80% 23%,96% 28%,89% 43%,100% 55%,87% 66%,90% 82%,74% 83%,66% 98%,50% 89%,34% 98%,26% 83%,10% 82%,13% 66%,0 55%,11% 43%,4% 28%,20% 23%,23% 7%,39% 12%);filter:drop-shadow(0 2px 0 #062040)}
.lvl b{position:relative}
.xpbar{position:relative;flex:1;min-width:60px;height:20px;border-radius:5px;background:#16263a;border:2px solid #050c16;overflow:hidden;margin-left:-8px}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#7fd6ff,#2c9be8);border-radius:3px}
.xpbar span{position:relative;display:block;text-align:center;font-size:13px;line-height:16px}
.res{display:flex;align-items:center;height:24px;background:#16263a;border:2px solid #050c16;border-radius:6px;padding:0 6px 0 2px;gap:4px;font-size:15px;flex:none}
.res .plus{width:18px;height:18px;border-radius:4px;background:linear-gradient(#8ef06a,#3cae2a);border:1.5px solid #134a0a;display:grid;place-items:center;font-size:15px;line-height:1}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc72c 45%,#d88a00);border:1.5px solid #6a3c00;flex:none}
.gem{width:16px;height:18px;background:linear-gradient(135deg,#bfffd0,#2fd06a 50%,#108a3a);clip-path:polygon(50% 0,100% 30%,82% 100%,18% 100%,0 30%);flex:none}
.troph{width:18px;height:18px;flex:none;background:linear-gradient(#ffe57a,#f2a70f);clip-path:polygon(10% 0,90% 0,90% 18%,100% 18%,100% 40%,80% 58%,62% 62%,60% 76%,76% 84%,76% 100%,24% 100%,24% 84%,40% 76%,38% 62%,20% 58%,0 40%,0 18%,10% 18%)}
.crownI{width:20px;height:16px;flex:none;background:linear-gradient(#ffe57a,#f0a00a);clip-path:polygon(0 25%,25% 55%,50% 0,75% 55%,100% 25%,90% 100%,10% 100%)}
.crownI.blue{background:linear-gradient(#8ad0ff,#2a7ad8)}.crownI.red{background:linear-gradient(#ff9a8a,#d8302a)}
/* ---------- battle tab ---------- */
.prof{display:flex;align-items:center;gap:8px;background:linear-gradient(#0e4a7a,#0c3d66);border:2px solid #06223d;border-radius:10px;padding:6px 8px;margin-bottom:8px}
.ava{width:40px;height:40px;border-radius:7px;background:linear-gradient(#3a7ec8,#1b4f88);border:2px solid #06223d;display:grid;place-items:center;font-size:22px;flex:none}
.prof .nm{flex:1;min-width:0}.prof .nm b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prof .nm small{font-size:12px;color:#9cc8f0}
.trbox{display:flex;align-items:center;gap:6px;background:#0a2a48;border:2px solid #051a2e;border-radius:8px;padding:4px 10px 4px 6px;font-size:19px}
.gear{width:36px;height:36px;border-radius:8px;background:linear-gradient(#e6eef6,#a8b8c8);border:2px solid #2a3a4a;display:grid;place-items:center;font-size:20px;color:#3a4a5a}
.duo{display:flex;gap:8px;margin-bottom:8px}
.free,.crownc{flex:1;border-radius:10px;border:2px solid #06223d;padding:6px 8px;display:flex;align-items:center;gap:6px;min-height:58px;position:relative;cursor:pointer}
.free{background:linear-gradient(#fff9cf,#f4dc86);color:#5a3a10}
.free .t{font-size:14px;color:#7a5010}.free .big{font-size:20px;color:#fff;text-shadow:0 2px 0 #7a5010,-1px -1px 0 #7a5010,1px -1px 0 #7a5010,-1px 1px 0 #7a5010}
.free .cnt{position:absolute;right:6px;top:4px;font-size:12px;background:#e8442a;color:#fff;border-radius:9px;padding:0 6px;border:1.5px solid #6a1a0a}
.crownc{background:linear-gradient(#3a76b8,#244f84)}
.crownc .t{font-size:14px;color:#ffe27a}
.bar{position:relative;height:14px;border-radius:7px;background:#0a2038;border:2px solid #051426;overflow:hidden;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#7fd6ff,#2c9be8)}
.bar span{position:relative;display:block;text-align:center;font-size:11px;line-height:10px}
.arenaWrap{display:flex;align-items:center;gap:6px;margin:4px 0 6px}
.sideBtns{display:flex;flex-direction:column;gap:14px}
.sb{position:relative;width:42px;height:42px;border-radius:9px;background:linear-gradient(#3a86d0,#1d5aa0);border:2px solid #062a50;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 #062a50}
.sb .dot{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:#e8442a;border:1.5px solid #fff;font-size:11px;display:grid;place-items:center;padding:0 3px}
.arena{flex:1;text-align:center;position:relative;cursor:pointer}
.arena canvas{width:100%;max-width:300px;aspect-ratio:1.3;display:block;margin:0 auto}
.plate{display:inline-block;margin-top:-6px;padding:4px 18px;border-radius:8px;background:linear-gradient(#c9cbd0,#8f9298);border:2px solid #3a3d44;font-size:18px;color:#fff;box-shadow:0 3px 0 #2a2d33}
.battleBtn{display:block;margin:10px auto 12px;width:72%;max-width:300px;padding:12px 0 14px;border-radius:14px;font-size:38px;background:linear-gradient(#ffe36a 0,#ffcf3a 45%,#f7a51a 55%,#f08a10);border:3px solid #6b3a00;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(160,70,0,.4),0 5px 0 #6b3a00;color:#fff}
.battleBtn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 2px 0 #6b3a00}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{position:relative;aspect-ratio:.78;border-radius:9px;background:linear-gradient(#a8daf0,#6eb8db);border:2px solid #1c4a6a;box-shadow:0 3px 0 #123a56;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 0 4px;overflow:hidden;cursor:pointer}
.slot.empty{background:rgba(10,40,70,.45);border-style:dashed;border-color:#3a6a9a;box-shadow:none;color:#7aa8d0;font-size:12px;justify-content:center;text-align:center}
.slot .tap{width:100%;background:linear-gradient(#7fd8f4,#4bb6dc);color:#fff;font-size:11px;text-align:center;padding:2px 0;border-bottom:2px solid #1c6a8a}
.slot .tap.go{background:linear-gradient(#a8f070,#4cb82a);border-bottom-color:#2a6a10}
.slot .tap.run{background:linear-gradient(#ffd25a,#f09a1a);border-bottom-color:#8a4a00}
.slot canvas{width:78%;margin-top:2px}
.slot .tm{font-size:17px;line-height:1}.slot .ar{font-size:10px;color:#1c4a6a;text-shadow:none}
/* ---------- bottom nav ---------- */
#nav{flex:none;display:flex;background:linear-gradient(#1d4f82,#123a62);border-top:2px solid #071a30;height:64px}
#nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#bcd8f4;border-right:1px solid #0a2a4a;transition:flex .15s}
#nav button i{font-style:normal;font-size:26px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
#nav button.on{flex:1.5;background:linear-gradient(#5aa8e8,#2a74c0);color:#fff}
#nav button.on i{font-size:32px}
#nav .dot{position:absolute;right:16%;top:5px;min-width:18px;height:18px;border-radius:9px;background:#e8442a;border:1.5px solid #fff;font-size:11px;display:grid;place-items:center;padding:0 3px;color:#fff}
/* ---------- cards tab ---------- */
.wood{background:#3b2817;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 38px),linear-gradient(#4a3220,#33220f);border:2px solid #1a1007;border-radius:10px;padding:8px;margin-bottom:10px}
.whead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:20px}
.whead small{font-size:13px;color:#e8c8ff}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.card{position:relative;border-radius:8px;padding:3px;cursor:pointer}
.card .fr{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:.83;border:2px solid #1b1b26}
.card img,.card canvas{display:block;width:100%;height:100%;object-fit:cover}
.card.C{background:linear-gradient(#e8f0f8,#8fa6c0)}.card.R{background:linear-gradient(#ffd7a0,#e0782a)}.card.E{background:linear-gradient(#f0c8ff,#9a40d8)}.card.L{background:linear-gradient(135deg,#ffe57a,#7af0d8,#c890ff,#ffa0c8)}
.cost{position:absolute;left:-3px;top:-4px;width:24px;height:26px;display:grid;place-items:center;font-size:15px;background:radial-gradient(circle at 40% 35%,#ff9cf8,#d63ae0 55%,#8a10a0);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1.5px solid #4a0a5a;z-index:2}
.lvtag{position:absolute;left:3px;right:3px;bottom:3px;text-align:center;font-size:11px;line-height:15px;border-radius:0 0 5px 5px}
.C .lvtag{background:#3d7ad0}.R .lvtag{background:#e0782a}.E .lvtag{background:#9a40d8}.L .lvtag{background:linear-gradient(90deg,#2ab8b0,#a060e0)}
.prog{position:relative;height:13px;margin-top:3px;border-radius:6px;background:#1a2a44;border:1.5px solid #0a1220;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#3a8ae0}.prog.up i{background:linear-gradient(#8ef06a,#3cae2a)}
.prog span{position:relative;display:block;text-align:center;font-size:10px;line-height:11px}
.prog.up:before{content:"\25B2";position:absolute;left:2px;top:-1px;font-size:10px;color:#fff;z-index:1}
.card.locked .fr{filter:grayscale(1) brightness(.45)}
.card.locked .lk{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;text-align:center;padding:4px;z-index:2;color:#ddd}
.card.sel{outline:3px solid #ffe27a;outline-offset:1px}
.card .new{position:absolute;right:-4px;top:-6px;background:#e8442a;border:1.5px solid #fff;border-radius:7px;font-size:10px;padding:0 4px;z-index:3}
.coll{background:linear-gradient(#2a6aa8,#1d4f82);border:2px solid #0a2a4a;border-radius:10px;padding:8px}
.swapbar{position:sticky;top:0;z-index:5;background:#e8442a;border:2px solid #6a1a0a;border-radius:8px;text-align:center;padding:6px;margin-bottom:8px;font-size:15px}
/* ---------- shop / journey / info ---------- */
.ptitle{text-align:center;font-size:24px;margin:2px 0 8px}
.panel{background:linear-gradient(#2a6aa8,#1d4f82);border:2px solid #0a2a4a;border-radius:10px;padding:8px;margin-bottom:10px}
.panel h3{font-size:18px;margin-bottom:6px;font-weight:400}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.offer{position:relative;background:linear-gradient(#cfe8f6,#8fc4e4);border:2px solid #1c4a6a;border-radius:9px;padding:4px 4px 6px;text-align:center;cursor:pointer;color:#fff;box-shadow:0 3px 0 #123a56}
.offer canvas{width:86%}.offer .on{font-size:12px;color:#1c3a56;text-shadow:none;margin-bottom:3px;min-height:28px}
.price{display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(#8ef06a,#3cae2a);border:1.5px solid #134a0a;border-radius:7px;padding:2px 4px;font-size:14px}
.price.gold{background:linear-gradient(#ffe36a,#f0a010);border-color:#6b3a00}
.offer.sold{filter:grayscale(.8) brightness(.8);pointer-events:none}
.jrow{display:flex;align-items:center;gap:8px;background:rgba(5,25,45,.4);border-radius:8px;padding:6px 8px;margin-bottom:5px}
.jrow.done{opacity:.55}.jrow.cur{outline:2px solid #ffe27a}
.jrow canvas{width:44px}.jrow .lv{width:34px;height:34px}.jrow .lv b{font-size:16px}
.jrow .t{flex:1;font-size:14px}.jrow .t small{display:block;font-size:11px;color:#b8d8f4}
.btn{display:inline-block;padding:8px 14px;border-radius:9px;font-size:16px;background:linear-gradient(#ffe36a,#f09a10);border:2px solid #6b3a00;box-shadow:0 3px 0 #6b3a00;color:#fff}
.btn.blue{background:linear-gradient(#6fc0ff,#2a7ad8);border-color:#0a3a7a;box-shadow:0 3px 0 #0a3a7a}
.btn.green{background:linear-gradient(#8ef06a,#3cae2a);border-color:#134a0a;box-shadow:0 3px 0 #134a0a}
.btn.red{background:linear-gradient(#ff8a7a,#d8302a);border-color:#6a1010;box-shadow:0 3px 0 #6a1010}
.btn.grey{background:linear-gradient(#c8ccd2,#8a9098);border-color:#3a3d44;box-shadow:0 3px 0 #3a3d44}
.btn:disabled{filter:grayscale(.9) brightness(.8);cursor:default}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.stat{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}
.stat span{color:#bfe0ff}
.log{display:flex;align-items:center;gap:8px;padding:6px;border-radius:7px;margin-bottom:4px;font-size:13px}
.log.w{background:rgba(60,150,255,.25)}.log.l{background:rgba(255,70,60,.22)}.log.d{background:rgba(200,200,200,.18)}
.log b{width:54px}.log .cr{display:flex;gap:2px}
.tr{display:flex;gap:8px;align-items:center;padding:6px;border-radius:8px;margin-bottom:5px;background:rgba(5,25,45,.4)}
.tr.cur{outline:2px solid #ffe27a}.tr.lock{opacity:.6}
.tr .ic{width:42px;height:42px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:20px;border:2px solid #0a2a4a}
.tr .t{flex:1;font-size:15px}.tr .t small{display:block;font-size:11px;color:#b8d8f4}
.minis{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}.minis img{width:24px;height:29px;border-radius:3px;border:1px solid #0a1a2a}
/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,12,25,.72);padding:14px}
.mbox{width:100%;max-width:360px;max-height:100%;overflow-y:auto;background:linear-gradient(#2a6aa8,#174a7e);border:3px solid #061c34;border-radius:14px;padding:14px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:pan-y}
.mbox h2{font-size:24px;text-align:center;font-weight:400;margin-bottom:8px}
.mbox p{font-size:14px;line-height:1.35;color:#e0f0ff;margin-bottom:8px;font-family:system-ui,sans-serif;font-weight:600}
.mbox .x{position:absolute;right:8px;top:6px;width:30px;height:30px;border-radius:7px;background:linear-gradient(#ff8a7a,#d8302a);border:2px solid #6a1010;font-size:18px;line-height:1}
.mrow{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.cinfo{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.cinfo .card{width:96px;flex:none}
.cinfo .meta{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0}
.stats div{background:rgba(5,25,45,.45);border-radius:7px;padding:4px 7px;font-size:12px;color:#bfe0ff}
.stats div b{display:block;font-size:15px;color:#fff;font-weight:400}
.stats div b em{font-style:normal;color:#8ef06a;font-size:12px}
/* ---------- chest opening ---------- */
#chestOpen{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#3a8ad8,#0c2a50 75%);cursor:pointer}
#chestOpen .cname{font-size:24px;margin-bottom:6px}
#chestOpen canvas.ch{width:62%;max-width:250px;transition:transform .2s}
#chestOpen .left{position:absolute;right:12px;bottom:12px;width:54px;height:54px;border-radius:50%;background:#e8442a;border:3px solid #fff;display:grid;place-items:center;font-size:24px}
#chestOpen .reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#chestOpen .reveal .card{width:44%;max-width:170px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#chestOpen .reveal .nm{font-size:26px;margin-top:10px}
#chestOpen .reveal .cnt{font-size:34px;color:#ffe27a}
#chestOpen .reveal .rr{font-size:15px}
#chestOpen .reveal .newbig{font-size:22px;color:#fff;background:#e8442a;border:2px solid #fff;border-radius:10px;padding:2px 12px;margin-bottom:8px;animation:pop .5s}
#chestOpen .sum{width:90%;max-width:360px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
#chestOpen .tapnote{position:absolute;bottom:18px;font-size:14px;color:#cfe6ff;animation:blink 1.4s infinite}
@keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.35}}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-6deg) scale(1.04)}75%{transform:rotate(6deg) scale(1.04)}}
@keyframes bob{50%{transform:translateY(-6px)}}
/* ---------- battle ---------- */
#battle{position:absolute;inset:0;background:#4f7a2e;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#hudTop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 8px;pointer-events:none}
.oppTag{font-size:16px;line-height:1.15}.oppTag .n{color:#ff8a7a;font-size:18px}.oppTag div{display:flex;align-items:center;gap:4px;font-size:14px}
.timer{min-width:76px;border-radius:7px;overflow:hidden;border:2px solid #1b1b26;text-align:center;background:#2b2b38}
.timer .lab{font-size:11px;background:#46465a;color:#ffd0a0;padding:1px 6px}
.timer.ot .lab{background:#d8302a;color:#fff}
.timer .tv{font-size:22px;padding:0 6px 2px}
#x2{position:absolute;right:10px;top:62px;width:42px;height:48px;display:grid;place-items:center;font-size:18px;background:radial-gradient(circle at 40% 35%,#ff9cf8,#d63ae0 55%,#8a10a0);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid #4a0a5a;pointer-events:none;animation:bob 1.2s infinite}

/* ---------- one unit, any kind ---------- */
function drawThing(g, d, s, team, an, t) {
  const a = d.art;
  switch (a.shape) {
    case 'human': return drawHuman(g, a, s, team, an);
    case 'goblin': return drawGoblin(g, a, s, team, an);
    case 'skel': return drawSkel(g, a, s, team, an);
    case 'robot': return drawRobot(g, a, s, team, an);
    case 'giant': return drawGiant(g, a, s, team, an);
    case 'minion': return drawMinion(g, a, s, team, an, t);
    case 'bat': return drawBat(g, a, s, team, an, t);
    case 'dragon': return drawDragon(g, a, s, team, an, t);
    case 'balloon': return drawBalloon(g, s, team, an);
    case 'golem': return drawGolem(g, a, s, team, an);
    case 'blob': return drawBlob(g, a, s, team, an, t);
    case 'spirit': return drawSpirit(g, a, s, team, an, t);
    case 'boar': return drawBeastRider(g, a, s, team, an, 'boar');
    case 'horse': return drawBeastRider(g, a, s, team, an, 'horse');
    case 'ram': return drawRam(g, s, team, an);
    case 'cart': return drawCart(g, s, team, an, an.charge || 0);
    case 'hound': return drawHound(g, a, s, team, an, t);
    case 'wolf': return drawWolf(g, a, s, team, an);
    case 'gryphon': return drawGryphon(g, a, s, team, an, t);
    case 'mimic': return drawMimic(g, s, team, an, t);
    case 'catapult': return drawCatapult(g, s, team, an);
    case 'hornet': return drawHornet(g, a, s, team, an, t);
    default: return drawBuilding(g, a, s, team, an, t);
  }
}

/* ---------- 1.1: music ----------
   Two songs in card-royale/music/: menu.mp3 plays anywhere in the menus (searching included), battle1.mp3 only
   during a battle (from the VS screen to the result). They stream, so any size works, and they loop and fade
   between each other. Browsers only start sound after a tap, so nothing plays until the first one. If a file
   isn't there yet, that song just stays silent. Setting: Music (SAVE.music), separate from Sound. */
const MUSIC = (() => {
  const SRC = { menu: 'music/menu.mp3', battle: 'music/battle1.mp3' }, VOL = 0.5, A = {};
  let want = 'menu', unlocked = false;
  const on = () => !(typeof SAVE !== 'undefined' && SAVE && SAVE.music === false);
  function track(k) {
    if (A[k]) return A[k];
    const a = new Audio(); a.loop = true; a.preload = 'auto'; a.volume = 0; a.src = SRC[k];
    a._bad = false; a.addEventListener('error', () => { a._bad = true; });
    return (A[k] = a);
  }
  function fade(a, to, done) {
    clearInterval(a._f);
    a._f = setInterval(() => {
      const v = a.volume + Math.sign(to - a.volume) * 0.05;
      if (Math.abs(to - a.volume) <= 0.05) { a.volume = to; clearInterval(a._f); if (done) done(); } else a.volume = Math.max(0, Math.min(1, v));
    }, 40);

      else if (!a.paused) fade(a, 0, () => { if (!(k === want && on() && !document.hidden)) a.pause(); });
    }

    if (unlocked) return; unlocked = true;
    for (const k in SRC) if (k !== want) { const a = track(k); a.muted = true; const p = a.play(); if (p && p.then) p.then(() => { a.pause(); a.muted = false; }).catch(() => { a.muted = false; }); else { a.pause(); a.muted = false; } }
    sync();

    play(k) { if (k !== want) { want = k; if (k === 'battle') { const a = track('battle'); if (a.paused) try { a.currentTime = 0; } catch (e) {} } } sync(); }, // every battle starts its song from the top
    sync

})();

function simPump() {

  BT.acc += Math.min(dt, 2.5);

  while (BT.acc >= TICK && n < 60) {
    BT.acc -= TICK; n++;
    if (BT.bot) botThink(BT.B, BT.bot);
    step(BT.B);
    const evs = BT.B.ev.splice(0);
    for (const ev of evs) { onEvent(ev); if (BT.mode === 'host' && ev.e !== 'hit') BT.netEv.push(ev); }
    if (BT.B.phase === 'end') break;
  }
  if (BT.mode === 'host') hostSend(now, false, BT.B.phase === 'end');
  if (BT.B.phase === 'end' && !BT.ended) battleOver(BT.B.result);
}

function arenaCanvas(a) {

/* ---------- 1.1: profiles and the battle log ---------- */
function meCard() { const pr = profile(); return Object.assign({ name: pr.name, tr: SAVE.tr, kl: SAVE.kl, deck: pr.deck, lv: pr.lv }, pr.st); }
function ago(t) { const s = (Date.now() - (t || 0)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago'; }
function logRow(l, back) {

  row.onclick = () => { if (!l.p) { toast('Profiles are saved from 1.1 on'); return; } openProfile(Object.assign({ name: l.o, bot: !!l.b }, l.p), false, back); };

// p: { name, tag, tr, kl, best, wins, losses, draws, three, found, fav, deck, lv, bot }
function openProfile(p, me, back) {
  sfx('click');
  const A = arenaOf(p.tr || 0), played = (p.wins || 0) + (p.losses || 0) + (p.draws || 0), rate = played ? Math.round((p.wins || 0) / played * 100) + '%' : '—';
  const together = me ? [] : SAVE.log.filter(l => l.p && (p.tag ? l.p.tag === p.tag : l.o === p.name));

    '<div class="pfGrid">' + cell('Battles won', p.wins || 0, 1) + cell('Three-crown wins', p.three || 0, 1) + cell('Battles played', played) + cell('Win rate', rate) + cell('Best trophies', p.best || p.tr || 0) + cell('Cards found', (p.found || 0) + '/' + CARDS.length) + '</div>' +
    (together.length ? '<div class="pfSec"><h4 class="o1">Your battles against ' + esc(p.name) + '</h4><div class="pfVs o"><span class="w">' + tw + ' won</span><span class="l">' + tl + ' lost</span>' + (td ? '<span>' + td + ' drawn</span>' : '') + '</div></div>' : '') +
    (fav ? '<div class="pfSec"><h4 class="o1">Favourite card</h4><div class="pfFav"><div class="slotF"></div><div class="o"><b>' + esc(fav.name) + '</b><small>' + RAR[fav.rar] + ' ' + (fav.type === 'troop' ? 'Troop' : fav.type === 'building' ? 'Building' : 'Spell') + '</small></div></div></div>' : '') +
    (p.deck && p.deck.length === 8 ? '<div class="pfSec"><h4 class="o1">' + (me ? 'Battle deck' : 'Deck in your last battle') + '</h4><div class="cgrid pfDeck"></div></div>' : '') +
    '<div class="mrow">' + (back ? '<button class="btn grey" id="pfBack">‹ Back</button>' : '') + (me ? '<button class="btn blue" id="pfLog">📋 Battle Log</button>' : '') + '</div>', { cls: 'pf' });
  const pic = arenaCanvas(A); b.querySelector('.pfPic').appendChild(pic);
  if (fav) b.querySelector('.slotF').replaceWith(cardEl(fav.id));
  const dk = b.querySelector('.pfDeck');
  if (dk) p.deck.forEach(id => { if (!DEF[id]) return; const w = el('div', 'tile'), c = cardEl(id); c.insertAdjacentHTML('beforeend', '<div class="lvtag o1">Level ' + ((p.lv && p.lv[id]) || 1) + '</div>'); w.appendChild(c); w.insertAdjacentHTML('beforeend', '<div class="tname o1">' + esc(DEF[id].name) + '</div>'); dk.appendChild(w); });
  const bk = b.querySelector('#pfBack'); if (bk) bk.onclick = () => back();
  const lg = b.querySelector('#pfLog'); if (lg) lg.onclick = openLog;
}

/* ---------- 1.1: the Trophy Road (tap the arena on the Battle tab) ---------- */
function openRoad() {
  sfx('click');
  let ov = $('#roadOv'); if (!ov) { ov = el('div', 'blue'); ov.id = 'roadOv'; $('#app').appendChild(ov); }
  ov.classList.remove('hide');
  const cur = arena(), tr = SAVE.tr;
  ov.innerHTML = '<div class="roadHead"><span class="ribbon o">Trophy Road</span><button class="x o">✕</button></div><div class="roadScroll"><div class="roadCol"><div class="rTrack"><i></i></div><div class="rMe o"><span class="troph"></span>' + tr + '</div></div></div>' +
    '<div class="roadFoot o1">Win battles to climb. Each new arena adds new cards to your chests.</div>';
  const col = ov.querySelector('.roadCol');
  for (let i = ARENAS.length - 1; i >= 0; i--) {
    const A = ARENAS[i], got = tr >= A.tr, away = A.tr - tr;
    const n = el('div', 'rNode' + (got ? ' got' : '') + (i === cur ? ' cur' : '')); n.dataset.i = i;
    n.innerHTML = '<div class="rDot o">' + (got ? i + 1 : '🔒') + '</div><div class="rCard"><div class="rPic"></div><div class="rInfo"><small class="o1">Arena ' + (i + 1) + '</small><b class="o">' + esc(A.n) + '</b>' +
      '<div class="rTr o1"><span class="troph"></span>' + A.tr + '</div><div class="rAway o1">' + (i === cur ? '⭐ You are here' : got ? '✔ Unlocked' : away + ' trophies away') + '</div></div><div class="minis"></div></div>';
    n.querySelector('.rPic').appendChild(arenaCanvas(i));
    const mins = n.querySelector('.minis'); CARDS.filter(c => c.arena === i).forEach(c => { const im = new Image(); im.src = portraitURL(c.id); im.title = c.name; im.alt = c.name; mins.appendChild(im); });
    col.appendChild(n);
  }
  const close = () => { sfx('click'); ov.classList.add('hide'); ov.innerHTML = ''; };
  ov.querySelector('.x').onclick = close;
  // the track: from Arena 1 (bottom) to the top arena, filled up to your trophies
  requestAnimationFrame(() => {
    const nodes = [...col.querySelectorAll('.rNode')], ys = []; // ys[i] = middle of arena i's dot
    nodes.forEach(n => { const d = n.querySelector('.rDot'); ys[+n.dataset.i] = n.offsetTop + d.offsetTop + d.offsetHeight / 2; });
    const last = ARENAS.length - 1, top = ys[last] - 50, bottom = ys[0];
    let y;
    if (tr >= ARENAS[last].tr) y = Math.max(top, ys[last] - Math.min(50, (tr - ARENAS[last].tr) / 10));
    else { let i = 0; while (i < last && tr >= ARENAS[i + 1].tr) i++; const f = (tr - ARENAS[i].tr) / (ARENAS[i + 1].tr - ARENAS[i].tr); y = ys[i] + (ys[i + 1] - ys[i]) * f; }
    const track = col.querySelector('.rTrack'); track.style.top = top + 'px'; track.style.height = (bottom - top) + 'px';
    track.firstChild.style.height = (bottom - y) + 'px';
    const me = col.querySelector('.rMe'); me.style.top = y + 'px';
    const sc = ov.querySelector('.roadScroll'); sc.scrollTop = Math.max(0, y - sc.clientHeight / 2);
  });
}
function openHelp(first) {
  modal('<h2>How to play</h2>' +
    '<p>⚔️ Destroy more enemy towers than your opponent in 3 minutes. Knock down the King Tower in the middle and you win straight away with 3 crowns.</p>' +

    '<p>🃏 Drag a card from your hand onto your side of the arena (or tap the card, then tap the arena). Spells can go anywhere. Knock down a Princess Tower and you can place troops further forward on that side.</p>' +
    '<p>⏳ Troops and buildings take 1.5 seconds to arrive. Until then you see their outline, and a ring fills up around it.</p>' +
    '<p>🏰 Princess Towers shoot anything on your side of the river. The King wakes up when a Princess Tower falls or he gets hit.</p>' +
    '<p>⏱️ A tie after 3 minutes goes to Overtime: the first tower to fall wins. Still tied? The tower with the lowest health falls and that side loses.</p>' +

    '<p>🏆 Tap the arena picture to see the Trophy Road: every arena, and how far you are from the next one. Tap a battle in your Battle Log to see that player’s profile.</p>', first ? { onClose: () => { SAVE.tut = true; save(); } } : null);
}

/* ---------- battles ---------- */
// Battle looks for a real player first. If nobody turns up within BOT_WAIT seconds (or online play can't connect),
// a bot takes the battle instead, and it counts like any battle: trophies, gold, crowns and a chest for a win.
const BOT_WAIT = 10;
let searchT0 = 0, searchTick = 0, searchRun = 0;
function startSearch() {
  if (SAVE.deck.length !== 8) { toast('Your deck needs 8 cards'); goPage('cards'); return; }
  const s = $('#search'); s.classList.remove('hide');
  searchT0 = Date.now();
  const run = ++searchRun;
  let shownSecs = -1;
  const paint = (st) => {
    if (run !== searchRun) return;
    const secs = Math.floor((Date.now() - searchT0) / 1000); shownSecs = secs;
    const found = st.s === 'found' || st.s === 'start' || st.s === 'bot';
    const t = found ? 'Opponent found!' : st.s === 'connecting' ? 'Connecting…' : 'Searching…';
    const sub = st.s === 'bot' ? 'Nobody else is online right now, so you’re battling a bot. It still counts for trophies!'
      : found ? 'Get ready!' : (st.n > 1 ? st.n + ' players searching' : 'Looking for a real player') + '<br>No one around? After ' + BOT_WAIT + ' seconds a bot takes the battle.';
    const fill = found ? 100 : Math.min(100, (Date.now() - searchT0) / 1000 / BOT_WAIT * 100);
    s.innerHTML = '<div class="srch"><span class="ribbon o">' + t + '</span><div class="sArena"></div>' +
      '<div class="sMe o"><div class="ava o">' + esc(myName().charAt(0).toUpperCase()) + '</div><div><b>' + esc(myName()) + '</b><small><span class="troph"></span>' + SAVE.tr + ' · Arena ' + (arena() + 1) + '</small></div></div>' +
      '<div class="sw">⚔️</div><div class="t o">' + (found ? '' : fmtT(secs)) + '</div><div class="bar sBar"><i style="width:' + fill + '%"></i></div><div class="s">' + sub + '</div>' +
      (found ? '' : '<button class="btn red" id="sCancel" style="margin-top:12px">Cancel</button>') + '</div>';
    s.querySelector('.sArena').appendChild(arenaCanvas(arena()));
    const c = $('#sCancel'); if (c) c.onclick = () => { sfx('click'); searchRun++; NET.cancel(); clearInterval(searchTick); s.classList.add('hide'); };
  };
  let last = { s: 'connecting' }; paint(last);
  const toBot = () => {
    clearInterval(searchTick); NET.cancel(); last = { s: 'bot' }; paint(last); sfx('deploy');
    setTimeout(() => { if (run !== searchRun) return; s.classList.add('hide'); startBotBattle(true); }, 1100);
  };
  clearInterval(searchTick); searchTick = setInterval(() => {
    if (run !== searchRun) { clearInterval(searchTick); return; }
    if (last.s === 'found' || last.s === 'start' || last.s === 'bot') return;
    const secs = (Date.now() - searchT0) / 1000;
    if (secs >= BOT_WAIT || (last.s === 'error' && secs >= 2)) return toBot();
    if (Math.floor(secs) !== shownSecs) paint(last);
    else { const b = s.querySelector('.sBar i'); if (b) b.style.width = Math.min(100, secs / BOT_WAIT * 100) + '%'; }
  }, 200);
  NET.search(profile(), st => { if (run !== searchRun || last.s === 'bot') return; last = st; paint(st); if (st.s === 'start') { clearInterval(searchTick); setTimeout(() => s.classList.add('hide'), 300); } })
    .catch(() => { if (run !== searchRun || last.s === 'bot') return; last = { s: 'error' }; });
}
function startOnline(mode, side, me, opp, seed) {
  $('#search').classList.add('hide'); closeModal();
  startBattle({ mode, side, seed, me, opp, arena: arenaOf(Math.min(me.tr, opp.tr)), onEnd: (out, mc, oc) => applyResult(out, mc, oc, opp, false) });
}
// (1.1: the Bot Battle button is gone; a bot only takes over a search that has run for BOT_WAIT seconds)
const BOT_NAMES = ['Trainer Cheddar', 'Trainer Tobi', 'Trainer Pip', 'Trainer Gus', 'Trainer Mo', 'Trainer Lulu'];
// ranked bots get made-up player names
const BOT_A = ['Sneaky', 'Mighty', 'Royal', 'Lucky', 'Crazy', 'Golden', 'Brave', 'Silent', 'Turbo', 'Sir', 'Captain', 'Tiny', 'Mega', 'Shadow', 'Frosty', 'Rusty', 'Grumpy', 'Happy', 'Wild', 'Epic'];
const BOT_B = ['Goblin', 'Knight', 'Wizard', 'Archer', 'Dragon', 'Muffin', 'Pickle', 'Hammer', 'Bandit', 'Badger', 'Comet', 'Falcon', 'Noodle', 'Pirate', 'Viking', 'Waffle', 'Ninja', 'Tiger', 'Biscuit', 'Rocket'];
function botName() { const n = BOT_A[rint(0, BOT_A.length - 1)] + BOT_B[rint(0, BOT_B.length - 1)]; return Math.random() < 0.55 ? n + rint(1, 99) : n; }
function startBotBattle(ranked) {
  const me = profile(), avg = me.deck.reduce((a, c) => a + me.lv[c], 0) / 8;
  const bd = botDeck(Math.random, arena(), avg);
  const opp = ranked
    ? { name: botName(), tr: Math.max(0, SAVE.tr + rint(-20, 20)), kl: Math.max(1, Math.min(MAX_KL, SAVE.kl + rint(-1, SAVE.tr < 300 ? 0 : 1))), deck: bd.deck, lv: bd.lv, bot: true }
    : { name: BOT_NAMES[rint(0, BOT_NAMES.length - 1)], tr: SAVE.tr, kl: SAVE.kl, deck: bd.deck, lv: bd.lv, bot: true };
  opp.st = botStats(opp.tr, opp.kl, opp.deck);
  // ranked bots think more slowly at low trophies and play at full speed from about 1500
  const slow = ranked ? Math.max(0, 1.2 - SAVE.tr / 1250) : 0;
  startBattle({ mode: 'bot', side: 0, seed: (Math.random() * 2 ** 31) | 0, me, opp, arena: arena(), botLvl: arena() + 1, botSlow: slow, onEnd: (out, mc, oc) => applyResult(out, mc, oc, opp, !ranked) });
}
function applyResult(out, myCr, oppCr, opp, training) {
  const r = { out };
  if (training) {
    SAVE.training++; r.xp = 5; r.note = 'Practice: no trophies';
  } else {
    const diff = Math.max(-6, Math.min(6, Math.round(((opp.tr || 0) - SAVE.tr) / 25)));
    r.tr = out === 'win' ? 30 + diff : out === 'loss' ? -Math.min(SAVE.tr, 30 - diff) : 0;
    SAVE.tr = Math.max(0, SAVE.tr + r.tr); SAVE.best = Math.max(SAVE.best, SAVE.tr);
    if (out === 'win') { SAVE.wins++; if (myCr === 3) SAVE.three++; r.gold = 15 + arena() * 5; r.xp = 20 + myCr * 4; const i = SAVE.slots.indexOf(null); if (i >= 0) { const type = CHEST_CYCLE[SAVE.cyc % CHEST_CYCLE.length]; SAVE.cyc++; SAVE.slots[i] = { type, a: arena() }; r.chest = type; } else r.note = 'Chest slots full'; }
    else if (out === 'loss') { SAVE.losses++; r.xp = 8; }
    else { SAVE.draws++; r.xp = 12; r.gold = 5; }
    SAVE.crowns = Math.min(10, SAVE.crowns + myCr);
    SAVE.gold += r.gold || 0;
    // 1.1: the opponent's profile goes in the log too, so you can look them up later
    const st = opp.st || {};
    SAVE.log.unshift({ r: out, c: [myCr, oppCr], o: opp.name, t: r.tr, at: Date.now(), b: opp.bot ? 1 : 0,
      p: { tag: st.tag || '', tr: opp.tr || 0, kl: opp.kl || 1, best: st.best || opp.tr || 0, wins: st.wins || 0, losses: st.losses || 0, draws: st.draws || 0, three: st.three || 0, found: st.found || 0, fav: st.fav || '', deck: (opp.deck || []).slice(0, 8), lv: opp.lv || {} } });
    SAVE.log = SAVE.log.slice(0, 25);
  }
  r.prevArena = arena();
  save();
  return r;
}
window.afterBattle = function (r) {
  goPage('battle'); renderAll();
  const a = arena();
  if (r && r.prevArena != null && a > r.prevArena) { sfx('win'); modal('<h2>New Arena!</h2><div style="text-align:center" id="mA"></div><p style="text-align:center">You reached Arena ' + (a + 1) + ': ' + esc(ARENAS[a].n) + '. New cards can now drop from your chests!</p>'); $('#mA').appendChild(arenaCanvas(a)); }
  if (r && r.xp) setTimeout(() => addXP(r.xp), r.prevArena != null && a > r.prevArena ? 0 : 50);
};

load();
renderAll();
if (!SAVE.tut) setTimeout(() => openHelp(true), 400);
else if (SAVE.ver !== GAME_VER) setTimeout(openPatch, 400);
SAVE.ver = GAME_VER; save();

    '<p>⏳ Troops and buildings now take 1.5 seconds to arrive. Until then you see their outline, with a ring that fills up.</p>' +
    '<p>🏷️ Card names everywhere: on the cards in your hand, over a card while you place it, over every card that lands, and under every card in your collection.</p>' +
    '<p>👤 Profiles: tap a battle in your Battle Log to see that player: trophies, battles won, three-crown wins, their favourite card and the deck they used. Tap your name on the Battle tab for your own.</p>' +

document.fonts && document.fonts.ready.then(() => { for (const k in PORTRAIT) delete PORTRAIT[k]; if (PAGE !== 'battle') renderPage(); });
