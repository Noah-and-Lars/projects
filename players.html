<script>
// 2026-11-07: phones and tablets get their own layout (html.mob, see the end of arcade.css). It goes by the device,
// not the window width, so desktops stay exactly as they were. ?mob=phone, ?mob=tab or ?mob=off forces one (tests).
(function () {
  var u = navigator.userAgent || '', c = document.documentElement.classList, f = '';
  try { f = (/[?&]mob=(phone|tab|off)/.exec(location.search) || [])[1] || sessionStorage.getItem('arcade-mob') || ''; if (f) sessionStorage.setItem('arcade-mob', f); } catch (e) {}
  var ipad = /iPad/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var phone = /iPhone|iPod|Windows Phone|BlackBerry|webOS|Android.+Mobile|Mobile.+Firefox/.test(u);
  var tab = !phone && (ipad || /Android|Tablet|Silk|Kindle|PlayBook/.test(u));
  if (f) { phone = f === 'phone'; tab = f === 'tab'; }
  if (phone || tab) { c.add('mob'); c.add(phone ? 'mob-phone' : 'mob-tab'); }
  var vh = function () { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); };
  vh(); window.addEventListener('resize', vh);
  // older browsers (iOS before 14) don't have replaceChildren, which the home page uses to list the games
  if (window.Element && !Element.prototype.replaceChildren) Element.prototype.replaceChildren = function () { while (this.firstChild) this.removeChild(this.firstChild); for (var i = 0; i < arguments.length; i++) { var n = arguments[i]; this.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); } };
})();
</script>

<style>
.pl { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; margin-top: 20px; height: calc(100vh - 150px); height: calc(100dvh - 150px); min-height: 460px; }
.pl-side, .pl-main { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid #ffffff14; border-radius: 18px; overflow: hidden; }
.pl-side { padding: 12px; gap: 10px; }
.pl-side .field { width: 100%; flex: none; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: #ffffff08; }
.seg button { position: relative; padding: 7px 4px; border: 0; border-radius: 9px; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--accent); color: #fff; }
.seg .n { margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--accent-2); color: #04211b; font-size: 11px; }
.seg .n[hidden] { display: none; }
.pl-count { margin: 0 2px; color: var(--muted); font-size: 12px; }
.plist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
.plist li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; cursor: pointer; }
.plist li:hover, .plist li:focus-visible { background: #ffffff0d; outline: none; }
.plist li.sel { background: #6c5ce733; }
.plist .av { width: 32px; height: 32px; font-size: 14px; flex: none; }
.plist .tx { flex: 1; min-width: 0; }
.plist .tx b, .plist .tx small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist .tx small { color: var(--muted); font-size: 12px; }
.plist .tag { flex: none; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #00d2a822; color: var(--accent-2); }
.plist .tag.req { background: #f2b13433; color: #f2b134; }
.dot-on { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); flex: none; }
.on-now { color: var(--accent-2) !important; font-weight: 700; }
.plist .un { flex: none; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--accent-2); color: #04211b; font-size: 11px; font-weight: 800; text-align: center; }
.plist .none, .plist .more { cursor: default; color: var(--muted); font-size: 13px; padding: 14px 8px; display: block; }
.plist .more { cursor: pointer; text-align: center; color: var(--text); text-decoration: underline; }
.pl-empty { margin: auto; padding: 30px; text-align: center; color: var(--muted); }
.pl-empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
.pl-empty .btn { margin-top: 14px; }
.prof { overflow-y: auto; padding: 22px; }
.prof-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.prof-head .av { width: 64px; height: 64px; font-size: 28px; flex: none; }
.prof-head h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.prof-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.prof-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.prof-acts .btn { padding: 8px 14px; font-size: 14px; }
.btn.ghost2 { background: transparent; border: 1px solid #ffffff2a; color: var(--text); box-shadow: none; }
.btn.danger { background: transparent; border: 1px solid #e5484d66; color: #ff8a8a; box-shadow: none; }
.prof h2 { margin: 26px 0 10px; font-size: 16px; }
.scores { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.score { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: #ffffff08; border: 1px solid #ffffff0f; min-width: 0; }
.score img { width: 64px; height: 36px; object-fit: cover; border-radius: 6px; flex: none; background: #0004; }
.score b, .score span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score b { font-size: 13px; }
.score span { color: #ffd166; font-size: 13px; font-weight: 700; }
.score.no span { color: var(--muted); font-weight: 500; }
.score > div { min-width: 0; }
.note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.dm-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #ffffff12; }
.dm-head .av { width: 32px; height: 32px; font-size: 14px; }
.dm-head a { font-weight: 800; font-size: 17px; }
.dm-head a:hover { text-decoration: underline; }
.dm-head .dm-call { margin-left: auto; padding: 7px 12px; font-size: 13px; }
.back { display: none; padding: 6px 10px; border-radius: 9px; border: 1px solid #ffffff22; background: none; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
.dm-log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.bub { max-width: min(75%, 520px); padding: 7px 11px; border-radius: 14px; background: #ffffff10; align-self: flex-start; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.4; }
.bub.me { align-self: flex-end; background: var(--accent); color: #fff; }
.bub time { display: block; font-size: 11px; opacity: .65; margin-top: 2px; }
.dm-day { align-self: center; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
.dm-send { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #ffffff12; background: #ffffff05; }
.dm-send .field { flex: 1; min-width: 0; }
.dm-send .btn:disabled { opacity: .5; cursor: default; }
.dm-note { margin: 0; padding: 0 14px 10px; background: #ffffff05; color: var(--muted); font-size: 12px; }
.dm-older { align-self: center; margin-bottom: 6px; }
/* group chats (2026-11-11) */
.av.grp { background: linear-gradient(135deg, #6c5ce7, #00d2a8); }
.plist li.newgrp { color: var(--accent-2); font-weight: 800; }
.plist li.newgrp .av { background: #00d2a822; color: var(--accent-2); }
.bub .by { display: block; font-size: 12px; font-weight: 800; margin-bottom: 1px; color: hsl(var(--h, 260) 70% 72%); }
.dm-head .grp-info { min-width: 0; display: flex; flex-direction: column; }
.dm-head .grp-info small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm-head .grp-acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.dm-head .grp-acts .btn { padding: 7px 11px; font-size: 13px; }
.grp-form { overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
.grp-form h1 { margin: 0; font-size: 24px; }
.grp-form label { font-size: 13px; font-weight: 700; color: var(--muted); }
.grp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.grp-chips button { border: 1px solid #ffffff22; background: #ffffff0a; color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.grp-chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.grp-row { display: flex; gap: 8px; }
.grp-row .field { flex: 1; min-width: 0; }
.grp-mem { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.grp-mem a { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #ffffff0d; color: var(--text); }
.grp-mem a.own::after { content: ' 👑'; }
@media (max-width: 760px) {
  .pl { grid-template-columns: minmax(0, 1fr); height: calc(100vh - 128px); height: calc(100dvh - 128px); margin-top: 12px; }
  .pl.detail .pl-side { display: none; }
  .pl:not(.detail) .pl-main { display: none; }
  .back { display: inline-block; }
  .prof { padding: 16px; }
  .prof-head .back { order: -1; width: 100%; max-width: 90px; }
}
</style>

<script>
// Players (2026-11-06): every account on the arcade, their best score in each game, friends and private messages.
// Everything comes from the arcade's server (realtime-worker: /acct/players, /acct/player, /acct/social,
// /acct/friend, /acct/block, /acct/dm, and a hibernating WebSocket at /acct/ws for live updates while this page is
// open). Nothing here polls. Text from other players is only ever shown with textContent.
const $ = id => document.getElementById(id);
const A = window.ArcadeAccount;
const api = (p, o) => A.api(p, o);
const signedIn = () => A.kind() === 'online';
const myName = () => (signedIn() && A.name()) || '';
const lc = s => String(s).toLowerCase();
const BAD = /\b(f+u+c+k+\w*|f+u+k+\w*|s+h+i+t+\w*|b+i+t+c+h+\w*|c+u+n+t+\w*|d+i+c+k+s?\b|p+u+s+s+y+\w*|a+s+s+h+o+l+e+\w*|bastard\w*|slut\w*|whore\w*|nigg\w*|n+i+g+a+\w*|fag\w*|retard\w*|twat\w*|wank\w*|porn\w*|penis\w*|vagina\w*|rape\w*)/gi;
const tidy = s => String(s).replace(/\s+/g, ' ').trim().replace(BAD, w => w[0] + '*'.repeat(w.length - 1));
const plain = s => String(s).replace(/\s+/g, ' ').trim(); // messages are shown uncensored
const hue = id => { let h = 0; for (const c of lc(id)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function avatar(n) { const s = el('span', 'av', (n.match(/[a-z0-9]/i) || [n[0]])[0].toUpperCase()); s.setAttribute('aria-hidden', 'true'); s.style.setProperty('--h', hue(n)); return s; }
const joined = ts => ts ? 'Joined ' + new Date(ts).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const lastOn = ts => { if (!ts) return ''; const d = (Date.now() - ts) / 60000; return 'Last online ' + (d < 10 ? 'just now' : d < 60 ? Math.round(d) + ' min ago' : d < 1440 ? Math.round(d / 60) + (Math.round(d / 60) === 1 ? ' hour ago' : ' hours ago') : Math.round(d / 1440) < 2 ? 'yesterday' : Math.round(d / 1440) + ' days ago'); };
const seenOf = k => { const p = players.find(x => lc(x[0]) === k); return p ? p[3] || 0 : 0; };
const ago = ts => { const d = (Date.now() - ts) / 1000; return d < 60 ? 'now' : d < 3600 ? Math.floor(d / 60) + 'm' : d < 86400 ? Math.floor(d / 3600) + 'h' : Math.floor(d / 86400) + 'd'; };

let online = {};           // lower-case name -> game id, from the arcade's presence channel
const where = g => g === 'home' || g === 'players' || g === 'chat' ? (g === 'chat' ? 'In the Global chat' : 'Online') : 'Playing ' + ((GAMES.find(x => x.id === g) || {}).title || 'a game');
let players = [];          // [[name, created, hasScores], ...]
let soc = null;            // { f, c, b } for the signed-in player
let view = 'all', limit = 200, cur = null; // cur = { kind: 'p' | 'dm', k, n }
const nameOf = k => { const p = players.find(x => lc(x[0]) === k); return p ? p[0] : (soc && ((soc.f[k] && soc.f[k].n) || (soc.c[k] && soc.c[k].n))) || k; };

// ---------- the list on the left ----------
function counts() {
  const req = soc ? Object.values(soc.f).filter(x => x.st === 'in').length : 0, un = soc ? Object.values(soc.c).reduce((n, c) => n + (c.un || 0), 0) : 0;
  $('nReq').textContent = req; $('nReq').hidden = !req;
  $('nUn').textContent = un; $('nUn').hidden = !un;
  if (soc) A.setSocial({ req, un });
}
function item(n, sub, extra) {
  const li = el('li'), tx = el('div', 'tx');
  li.tabIndex = 0;
  tx.append(el('b', '', n));
  if (sub) tx.append(el('small', '', sub));
  li.append(avatar(n), tx);
  if (online[lc(n)] && tx.lastChild.tagName === 'SMALL') { tx.lastChild.textContent = where(online[lc(n)]); tx.lastChild.className = 'on-now'; }
  if (online[lc(n)]) { const d = el('span', 'dot-on'); d.title = 'Online now'; li.append(d); }
  if (extra) li.append(extra);
  return li;
}
function tagFor(k) {
  const f = soc && soc.f[k];
  if (!f) return null;
  return f.st === 'f' ? el('span', 'tag', 'Friend') : f.st === 'in' ? el('span', 'tag req', 'Wants to be friends') : el('span', 'tag req', 'Sent');
}
function needAccount(what) {
  const d = el('div', 'pl-empty');
  d.append(el('b', '', 'Make an account first'), document.createTextNode('You need an online Arcade account to ' + what + '. It’s free: just a username and a password.'));
  const b = el('button', 'btn', 'Make an account'); b.type = 'button'; b.onclick = () => A.welcome('signup');
  d.append(el('br'), b);
  return d;
}
function renderList() {
  const q = lc($('q').value.trim()), out = [], ul = $('list');
  let rows = [];
  if (view === 'all') {
    rows = players.filter(p => !q || lc(p[0]).includes(q)).sort((a, b) => (lc(a[0]) === lc(q)) * -1 + (lc(b[0]) === lc(q)) || lc(a[0]).localeCompare(lc(b[0])))
      .sort((a, b) => !!online[lc(b[0])] - !!online[lc(a[0])]) // online players first
      .map(p => ({ k: lc(p[0]), n: p[0], sub: (lc(p[0]) === lc(myName()) ? 'You · ' : '') + (lastOn(p[3]) || joined(p[1])), kind: 'p' }));
    const on = players.filter(p => online[lc(p[0])]).length;
    $('plCount').textContent = players.length ? (q ? rows.length + ' of ' : '') + players.length + (players.length === 1 ? ' player' : ' players') + ' · ' + on + ' online' : 'No players yet';
  } else if (!signedIn()) {
    $('plCount').textContent = '';
    ul.replaceChildren(el('li', 'none', 'Sign in to an online account to add friends and send messages.'));
    return;
  } else if (view === 'friends' || view === 'req') {
    rows = Object.entries(soc ? soc.f : {}).filter(([k, f]) => (view === 'friends' ? f.st === 'f' : f.st !== 'f') && (!q || k.includes(q)))
      .sort((a, b) => (view === 'req' ? (a[1].st === 'in' ? 0 : 1) - (b[1].st === 'in' ? 0 : 1) : 0) || a[0].localeCompare(b[0]))
      .map(([k, f]) => ({ k, n: f.n, sub: f.st === 'in' ? 'Wants to be your friend' : f.st === 'out' ? 'Request sent' : '', kind: 'p' }));
    $('plCount').textContent = view === 'friends' ? rows.length + (rows.length === 1 ? ' friend' : ' friends') : rows.length ? 'Friend requests' : '';
  } else {
    rows = Object.entries(soc ? soc.c : {}).filter(([k, c]) => !q || k.includes(q) || lc(c.n || '').includes(q)).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0))
      .map(([k, c]) => c.g ? { k, n: c.n, id: k.slice(2), sub: (c.me ? 'You: ' : c.by ? c.by + ': ' : '') + plain(c.t || ''), kind: 'g', un: c.un, ts: c.ts }
        : { k, n: c.n, sub: (c.me ? 'You: ' : '') + plain(c.t || ''), kind: 'dm', un: c.un, ts: c.ts });
    $('plCount').textContent = rows.length ? 'Private and group chats' : '';
    const ng = item('New group chat', 'Up to 15 people'); ng.classList.add('newgrp'); ng.querySelector('.av').textContent = '+';
    ng.onclick = () => go('new', 'group'); ng.onkeydown = e => { if (e.key === 'Enter') go('new', 'group'); };
    if (cur && cur.kind === 'new') ng.classList.add('sel');
    out.push(ng);
  }
  for (const r of rows.slice(0, limit)) {
    let extra = null;
    if (r.kind === 'dm' || r.kind === 'g') { extra = r.un ? el('span', 'un', r.un) : el('small', 'pl-count', ago(r.ts)); }
    else if (view === 'all') extra = tagFor(r.k);
    const li = item(r.n, r.sub, extra), dest = r.kind === 'g' ? r.id : r.n;
    if (r.kind === 'g') { const av = li.querySelector('.av'); av.textContent = '👥'; av.classList.add('grp'); }
    if (cur && cur.k === r.k && (cur.kind === r.kind || view === 'all')) li.classList.add('sel');
    li.onclick = () => go(r.kind, dest);
    li.onkeydown = e => { if (e.key === 'Enter') go(r.kind, dest); };
    out.push(li);
  }
  if (rows.length > limit) { const m = el('li', 'more', 'Show more (' + (rows.length - limit) + ')'); m.onclick = () => { limit += 300; renderList(); }; out.push(m); }
  if (!rows.length) out.push(el('li', 'none', view === 'all' ? (players.length ? 'Nobody matches that.' : '') : view === 'friends' ? 'No friends yet. Find someone in All and press Add friend.' : view === 'req' ? 'No friend requests right now.' : 'No chats yet. Open someone’s profile and press Message, or start a group chat.'));
  ul.replaceChildren(...out);
}
for (const b of document.querySelectorAll('.seg button')) b.onclick = () => setView(b.dataset.v);
function setView(v) {
  view = v; limit = 200;
  for (const b of document.querySelectorAll('.seg button')) b.classList.toggle('on', b.dataset.v === v);
  renderList();
}
$('q').addEventListener('input', () => { limit = 200; renderList(); });

// ---------- a player's profile ----------
const backBtn = () => { const b = el('button', 'back', '← Back'); b.type = 'button'; b.onclick = () => { history.replaceState(null, '', location.pathname + location.search); cur = null; $('pl').classList.remove('detail'); renderList(); }; return b; };
function go(kind, n) {
  const h = '#' + kind + '=' + encodeURIComponent(n);
  if (location.hash !== h) history.replaceState(null, '', h);
  route();
}
function route() {
  const m = location.hash.match(/^#(p|dm|g|new)=([^&]+)/);
  if (!m) { cur = null; $('pl').classList.remove('detail'); return; }
  let n = ''; try { n = decodeURIComponent(m[2]); } catch (e) {}
  if (m[1] === 'g') { if (!/^[0-9a-f]{4,16}$/.test(n)) return; $('pl').classList.add('detail'); if (view !== 'dm') setView('dm'); openGroup(n); return; }
  if (m[1] === 'new') { $('pl').classList.add('detail'); newGroup(); return; }
  if (!/^[A-Za-z0-9_]{3,16}$/.test(n)) return;
  $('pl').classList.add('detail');
  if (m[1] === 'dm') openDm(n); else openProfile(n);
}
