<!doctype html>
<html><head><meta charset="utf-8"><title>Rillstone renderer benchmark</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<script type="module">
// Benchmark 4 (BUILD_BRIEF section 10): CPU cost of drawing 500 machines.
// ?r=webgl | webgpu | webgpu-gl   &mode=meshes | batched
const q = new URLSearchParams(location.search);
const kind = q.get('r') || 'webgl', mode = q.get('mode') || 'meshes';
const THREE = kind === 'webgl' ? await import('three') : await import('three/webgpu');
let renderer;
if (kind === 'webgl') renderer = new THREE.WebGLRenderer({ antialias: false });
else { renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL: kind === 'webgpu-gl' }); await renderer.init(); }
renderer.setSize(960, 540);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc8e0);
const cam = new THREE.PerspectiveCamera(75, 960 / 540, 0.1, 400);
cam.position.set(0, 30, 60); cam.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(30, 50, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xc8b890 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// A "machine" is 4 parts: body, hopper, pipe stub, brass trim. 4 materials shared by family.
const colors = [0x2c8c8c, 0xc8962c, 0xa84a3a, 0x7a5aa8];
const mats = colors.map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.6 }));
const brass = new THREE.MeshStandardMaterial({ color: 0xc8a050, metalness: 0.8, roughness: 0.35 });
const parts = [new THREE.BoxGeometry(1.4, 1, 1), new THREE.CylinderGeometry(0.5, 0.3, 0.6, 8), new THREE.CylinderGeometry(0.12, 0.12, 1, 8), new THREE.TorusGeometry(0.4, 0.06, 6, 12)];
const N = 500, meshes = [];
if (mode === 'meshes') {
  for (let i = 0; i < N; i++) {
    const g = new THREE.Group(); const m = mats[i % 4];
    const a = new THREE.Mesh(parts[0], m), b = new THREE.Mesh(parts[1], m), c = new THREE.Mesh(parts[2], brass), d = new THREE.Mesh(parts[3], brass);
    b.position.y = 0.8; c.rotation.z = Math.PI / 2; c.position.set(0.9, 0.2, 0); d.position.y = 0.55; d.rotation.x = Math.PI / 2;
    for (const x of [a, b, c, d]) { x.castShadow = x.receiveShadow = true; g.add(x); }
    g.position.set((i % 25) * 3.2 - 40, 0.5, Math.floor(i / 25) * 3.2 - 30); g.rotation.y = i;
    scene.add(g); meshes.push(g);
  }
} else {
  // BatchedMesh per material: one draw per family.
  const tmp = new THREE.Object3D();
  const batches = [...mats, brass].map(m => { const bm = new THREE.BatchedMesh(N * 2, 20000, 60000, m); bm.castShadow = bm.receiveShadow = true; scene.add(bm); return bm; });
  const gid = batches.map(bm => parts.map(p => bm.addGeometry(p)));
  for (let i = 0; i < N; i++) {
    const fam = i % 4, x = (i % 25) * 3.2 - 40, z = Math.floor(i / 25) * 3.2 - 30;
    const put = (bi, pi, px, py, pz, rx = 0, rz = 0) => { tmp.position.set(x + px, py, z + pz); tmp.rotation.set(rx, i, rz); tmp.updateMatrix(); const id = batches[bi].addInstance(gid[bi][pi]); batches[bi].setMatrixAt(id, tmp.matrix); };
    put(fam, 0, 0, 0.5, 0); put(fam, 1, 0, 1.3, 0); put(4, 2, 0.9, 0.7, 0, 0, Math.PI / 2); put(4, 3, 0, 1.05, 0, Math.PI / 2);
  }
}
const times = [];
let frame = 0;
function loop() {
  frame++;
  for (let i = 0; i < meshes.length; i += 7) meshes[i].rotation.y += 0.01;
  const t0 = performance.now();
  renderer.render(scene, cam);
  times.push(performance.now() - t0);
  if (frame < 260) requestAnimationFrame(loop);
  else {
    const s = times.slice(60).sort((a, b) => a - b);
    window.__bench = { kind, mode, backend: renderer.backend ? (renderer.backend.isWebGPUBackend ? 'webgpu' : 'webgl2') : 'webgl', median: s[s.length >> 1], p90: s[Math.floor(s.length * 0.9)], calls: renderer.info.render.calls ?? renderer.info.render.drawCalls };
  }
}
loop();
</script></body></html>
