<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <!-- sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa4ff"/>
      <stop offset="1" stop-color="#b6d8ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#sky)"/>

  <!-- clouds -->
  <rect x="20" y="18" width="48" height="8" fill="#fff" opacity="0.9"/>
  <rect x="28" y="12" width="30" height="8" fill="#fff" opacity="0.9"/>
  <rect x="200" y="24" width="60" height="8" fill="#fff" opacity="0.9"/>
  <rect x="214" y="18" width="34" height="8" fill="#fff" opacity="0.9"/>

  <!-- distant hills (stone grey) -->
  <rect x="0" y="104" width="320" height="76" fill="#6a6a6a"/>
  <rect x="0" y="96" width="80" height="8" fill="#6a6a6a"/>
  <rect x="80" y="88" width="48" height="16" fill="#6a6a6a"/>
  <rect x="160" y="92" width="64" height="12" fill="#6a6a6a"/>
  <rect x="248" y="88" width="72" height="16" fill="#6a6a6a"/>

  <!-- dirt layer -->
  <rect x="0" y="120" width="320" height="60" fill="#8b5e3c"/>

  <!-- grass top strip -->
  <rect x="0" y="104" width="320" height="16" fill="#5a9e32"/>
  <rect x="80" y="96" width="48" height="8" fill="#5a9e32"/>
  <rect x="160" y="100" width="64" height="8" fill="#5a9e32"/>
  <rect x="248" y="96" width="72" height="8" fill="#5a9e32"/>

  <!-- dirt block shading lines (pixel grid) -->
  <rect x="0" y="120" width="320" height="2" fill="#6e4826" opacity="0.5"/>
  <rect x="0" y="136" width="320" height="2" fill="#6e4826" opacity="0.5"/>
  <rect x="0" y="152" width="320" height="2" fill="#6e4826" opacity="0.5"/>
  <rect x="16" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="48" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="80" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="112" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="144" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="176" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="208" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="240" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="272" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>
  <rect x="304" y="120" width="2" height="60" fill="#6e4826" opacity="0.4"/>

  <!-- creeper face (center) -->
  <!-- head -->
  <rect x="136" y="38" width="48" height="48" fill="#62a861"/>
  <!-- eyes -->
  <rect x="144" y="46" width="12" height="12" fill="#1a1a1a"/>
  <rect x="164" y="46" width="12" height="12" fill="#1a1a1a"/>
  <!-- mouth -->
  <rect x="148" y="62" width="8" height="6" fill="#1a1a1a"/>
  <rect x="164" y="62" width="8" height="6" fill="#1a1a1a"/>
  <rect x="148" y="68" width="4" height="6" fill="#1a1a1a"/>
  <rect x="168" y="68" width="4" height="6" fill="#1a1a1a"/>
  <rect x="152" y="74" width="16" height="6" fill="#1a1a1a"/>

  <!-- title text -->
  <text x="160" y="168" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" opacity="0.9" letter-spacing="1">EAGLERCRAFT 1.12.2</text>
</svg>
