<script type="text/plain" id="hbt-engine">
/* ==========================================================================
   Havoc Bay trailer: the director.
   This script is put into the game page (loaded in a frame by trailer.html, its own frame loop and title reel
   switched off before they start) and films the game's real world: its harbors, islands, water and sky, its
   ships (buildShipModel), planes (buildPlaneModel), B-52 (buildB52), turrets and its fire, smoke and splash
   effects. It adds cameras, lighting moods, a film finish and a few effects of its own (tracers, rings, flashes).
   Every shot is a function of film time: HBT.frame(t) draws the moment t, and jumping to any t replays the shot
   it is in from its start, so a moment always looks the same.
   ========================================================================== */
(() => {
'use strict';
const T = THREE;
const Vc = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eio = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const hs = (x, y) => { const s = Math.sin(x * 157.31 + y * 271.97) * 41758.5453; return s - Math.floor(s); };
const wob = (t, s) => { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return (hs(i, s) + (hs(i + 1, s) - hs(i, s)) * u) * 2 - 1; };
const lin = hex => new T.Color(hex);
const BLUE = 0, RED = 1;
const HB = HARBORS[0], HR = HARBORS[1];
const KEEP = H => H.boxes.reduce((a, b) => (b.maxY > a.maxY ? b : a), H.boxes[0]);
const boxTop = B => Vc((B.minX + B.maxX) / 2, B.maxY, (B.minZ + B.maxZ) / 2);

// ---------- the film finish ----------
// The scene goes to a float target without tone mapping; bright parts are blurred into a bloom and a long
// sideways streak (an anamorphic lens); one pass then applies the same filmic curve the game uses, grades the
// colour per shot (lift, gamma, gain, saturation, contrast), and adds the streak, vignette, grain and a slight
// colour split at the edges.
function makeFilm() {
  if (!renderer.capabilities.isWebGL2) return null;
  const f = { type: T.HalfFloatType, minFilter: T.LinearFilter, magFilter: T.LinearFilter };
  // stencilBuffer gives a 24-bit depth buffer (depth only is 16-bit in this three.js, which made distant surfaces
  // fight over which is in front: the bases' ground, roads and walls flickered as broken stripes)
  const main = new T.WebGLMultisampleRenderTarget(4, 4, Object.assign({ depthBuffer: true, stencilBuffer: true }, f)); main.samples = 4;
  const mk = () => new T.WebGLRenderTarget(4, 4, Object.assign({ depthBuffer: false }, f));
  const half = mk(), b1 = mk(), b2 = mk(), s1 = mk(), s2 = mk();
  const cam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1), qs = new T.Scene(), quad = new T.Mesh(new T.PlaneGeometry(2, 2)); quad.frustumCulled = false; qs.add(quad);
  const vs = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const pass = (u, fs) => new T.ShaderMaterial({ uniforms: u, vertexShader: vs, fragmentShader: fs, depthTest: false, depthWrite: false, toneMapped: false });
  const bright = pass({ t: { value: null }, th: { value: 1 } }, `uniform sampler2D t; uniform float th; varying vec2 vUv;
    void main(){ vec3 c = texture2D(t, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th * 1.7, l), 1.0); }`);
  const blur = pass({ t: { value: null }, d: { value: new T.Vector2() } }, `uniform sampler2D t; uniform vec2 d; varying vec2 vUv;
    void main(){ vec3 c = texture2D(t, vUv).rgb * 0.2270;
      c += (texture2D(t, vUv + d * 1.3846).rgb + texture2D(t, vUv - d * 1.3846).rgb) * 0.3162;
      c += (texture2D(t, vUv + d * 3.2308).rgb + texture2D(t, vUv - d * 3.2308).rgb) * 0.0703; gl_FragColor = vec4(c, 1.0); }`);
  const U = {
    t: { value: null }, b: { value: null }, s: { value: null }, time: { value: 0 }, exposure: { value: 1.3 }, bloom: { value: 0.5 }, streak: { value: 0.4 }, streakCol: { value: new T.Color(0.5, 0.7, 1.25) },
    lift: { value: new T.Vector3() }, gam: { value: new T.Vector3(1, 1, 1) }, gain: { value: new T.Vector3(1, 1, 1) }, sat: { value: 1 }, con: { value: 1 }, vig: { value: 0.4 }, grain: { value: 0.035 }, split: { value: 0.0015 }, aspect: { value: 1 }, flash: { value: 0 },
  };
  const comp = pass(U, `uniform sampler2D t, b, s; uniform float time, exposure, bloom, streak, sat, con, vig, grain, split, aspect, flash; uniform vec3 streakCol, lift, gam, gain; varying vec2 vUv;
    vec3 fit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
    vec3 aces(vec3 c){
      const mat3 IN = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
      const mat3 OUT = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
      return clamp(OUT * fit(IN * (c * exposure / 0.6)), 0.0, 1.0); }
    void main(){
      vec2 p = vUv - 0.5; float r2 = dot(p, p) * 2.0;   // 0 in the middle, 1 in the corners
      vec2 off = p * split * (1.0 + r2 * 2.0);
      vec3 c = vec3(texture2D(t, vUv + off).r, texture2D(t, vUv).g, texture2D(t, vUv - off).b);
      c += texture2D(b, vUv).rgb * bloom + texture2D(s, vUv).rgb * streakCol * streak;
      c += vec3(1.0, 0.92, 0.8) * flash;
      c = aces(c);
      c = pow(max(c * gain + lift * (1.0 - c), 0.0), 1.0 / gam);
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, sat);
      c = (c - 0.5) * con + 0.5;
      c *= 1.0 - vig * 0.75 * smoothstep(0.25, 1.1, r2);
      float n = fract(sin(dot(vUv * vec2(1931.7, 1213.3) + fract(time * 3.71), vec2(12.9898, 78.233))) * 43758.5453);
      c += (n - 0.5) * grain;
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`);
  const size = new T.Vector2();
  const draw = (m, tg) => { quad.material = m; renderer.setRenderTarget(tg); renderer.render(qs, cam); };
  const bl = (src, dst, x, y) => { blur.uniforms.t.value = src.texture; blur.uniforms.d.value.set(x, y); draw(blur, dst); };
  return {
    main,
    setSize() {
      renderer.getDrawingBufferSize(size); const w = Math.max(4, size.x), h = Math.max(4, size.y);
      main.setSize(w, h); for (const rt of [half, b1, b2]) rt.setSize(Math.max(4, w >> 1), Math.max(4, h >> 1));
      for (const rt of [s1, s2]) rt.setSize(Math.max(4, w >> 2), Math.max(4, h >> 3));
      U.aspect.value = w / h;
    },
    render(L, time, flash) {
      renderer.setRenderTarget(main); renderer.render(scene, camera);
      bright.uniforms.th.value = L.g.th; bright.uniforms.t.value = main.texture; draw(bright, half);
      const px = 1 / half.width, py = 1 / half.height;
      bl(half, b1, px, 0); bl(b1, b2, 0, py); bl(b2, b1, px * 2.2, 0); bl(b1, b2, 0, py * 2.2);
      const sx = 1 / s1.width; bl(half, s1, sx, 0); bl(s1, s2, sx * 3, 0); bl(s2, s1, sx * 7, 0); bl(s1, s2, sx * 15, 0);
      const g = L.g; U.t.value = main.texture; U.b.value = b2.texture; U.s.value = s2.texture; U.time.value = time; U.exposure.value = L.exp; U.flash.value = flash;
      U.bloom.value = g.bloom; U.streak.value = g.streak; U.lift.value.fromArray(g.lift); U.gam.value.fromArray(g.gam); U.gain.value.fromArray(g.gain);
      U.sat.value = g.sat; U.con.value = g.con; U.vig.value = g.vig; U.grain.value = g.grain; U.split.value = g.split;
      draw(comp, null);
    },
  };
}

// ---------- lighting moods ----------
const G0 = { lift: [0, 0, 0], gam: [1, 1, 1], gain: [1, 1, 1], sat: 1, con: 1.05, bloom: 0.38, th: 1.25, streak: 0.32, vig: 0.35, grain: 0.03, split: 0.0012 };
const look = (o, g) => Object.assign({ fogN: 300, fogF: 4300, night: 0, glowK: 1, cloudC: 1, exp: 1.3 }, o, { g: Object.assign({}, G0, g) });
const LOOKS = {
  // sunrise in the north-east: a low warm sun raking across the bases from the side, a cool blue sky fill in the
  // shadows, the sea glittering toward the sun behind the Red harbor
  dawn: look({ top: '#24356a', mid: '#e89a6e', fog: '#c99a82', fogN: 700, fogF: 6800, sun: [0.55, 0.16, -0.82], sunC: [1, 0.68, 0.44], sunI: 1.75, disc: [1, 0.6, 0.32], glowK: 2.0,
    hs: '#7f98c4', hg: '#3b2e27', hI: 0.6, deep: '#173a5e', shallow: '#3c7f88', skyc: '#d29a84', cloud: '#c98a70', cloudC: 0.8, exp: 1.08 },
    { lift: [0.0, 0.0, 0.025], gain: [1.07, 0.99, 0.9], sat: 0.94, con: 1.14, bloom: 0.42, th: 1.15, streak: 0.45 }),
  // battle: mid-morning, a high hard sun and a teal-and-orange grade
  day: look({ top: '#2f5590', mid: '#a6bccd', fog: '#b0c2cf', fogN: 800, fogF: 7200, sun: [0.55, 0.52, 0.42], sunC: [1, 0.9, 0.76], sunI: 1.25, disc: [1, 0.95, 0.85], glowK: 1.2,
    hs: '#b9cbe0', hg: '#5e5446', hI: 0.5, deep: '#123c66', shallow: '#3a8e98', skyc: '#9db6c9', cloud: '#8f9aa6', exp: 1.14, glint: 0.45 },
    { lift: [0.0, 0.01, 0.03], gain: [1.06, 1.0, 0.92], sat: 1.1, con: 1.15, bloom: 0.36, th: 1.35, streak: 0.3 }),
  // smoke over the fleet: the sun dimmed and orange, the air thick
  smoke: look({ top: '#3a4352', mid: '#a08c7e', fog: '#8a7d74', fogN: 350, fogF: 4800, sun: [0.5, 0.33, 0.5], sunC: [1, 0.72, 0.45], sunI: 1.05, disc: [1, 0.55, 0.28], glowK: 2.4,
    hs: '#a8a6ac', hg: '#3e362f', hI: 0.45, deep: '#163246', shallow: '#2c6e74', skyc: '#9a8e86', cloud: '#7a7068', cloudC: 0.7, exp: 1.15 },
    { lift: [0.01, 0.01, 0.02], gain: [1.07, 0.99, 0.9], sat: 1.04, con: 1.17, bloom: 0.42, th: 1.15, streak: 0.4 }),
  // the storm: dark cloud, cold light, lightning
  storm: look({ top: '#0c1118', mid: '#39414b', fog: '#353c45', fogN: 120, fogF: 2600, sun: [0.3, 0.3, -0.5], sunC: [0.62, 0.7, 0.85], sunI: 0.6, disc: [0, 0, 0], glowK: 0.3,
    hs: '#5a677a', hg: '#1a1c20', hI: 0.6, deep: '#0d1b27', shallow: '#1f3b45', skyc: '#3b454f', cloud: '#2b3139', cloudC: 0.32, exp: 1.35 },
    { lift: [0.0, 0.01, 0.03], gain: [0.95, 1.0, 1.07], sat: 0.8, con: 1.14, bloom: 0.55, th: 0.9, streak: 0.5, vig: 0.5 }),
  // the bombing: storm light with the fires coming up
  fire: look({ top: '#10131a', mid: '#5a3426', fog: '#3e2b24', fogN: 150, fogF: 3200, sun: [-0.55, 0.3, -0.45], sunC: [1, 0.58, 0.36], sunI: 0.65, disc: [0, 0, 0], glowK: 0,
    hs: '#6c5044', hg: '#1a1210', hI: 0.45, deep: '#101b23', shallow: '#2a3b3b', skyc: '#5c3c30', cloud: '#3c2c26', cloudC: 0.35, exp: 1.35 },
    { lift: [0.015, 0.0, 0.0], gain: [1.08, 0.98, 0.9], sat: 1.05, con: 1.14, bloom: 0.55, th: 1.05, streak: 0.55, vig: 0.45 }),
  // after: night, the harbor burning
  night: look({ top: '#05070d', mid: '#3a1e16', fog: '#22150f', fogN: 100, fogF: 2500, sun: [-0.4, 0.45, -0.3], sunC: [0.5, 0.6, 0.92], sunI: 0.3, disc: [0.5, 0.55, 0.65], glowK: 0.4, night: 0.7,
    hs: '#4a5070', hg: '#1a1210', hI: 0.5, deep: '#0a1822', shallow: '#123038', skyc: '#2c2026', cloud: '#2a1e1c', cloudC: 0.25, exp: 1.95 },
    { lift: [0.0, 0.0, 0.02], gain: [1.06, 0.98, 0.94], sat: 1.05, con: 1.1, bloom: 0.7, th: 0.9, streak: 0.6, vig: 0.5 }),
};
let LOOK = LOOKS.day;
const _c = new T.Color();
function setLook(L) {
  LOOK = L;
  SUN_DIR.set(L.sun[0], L.sun[1], L.sun[2]).normalize();
  FOG_COL.set(L.fog); scene.fog.color.set(L.fog); scene.fog.near = L.fogN; scene.fog.far = L.fogF;
  skyMat.uniforms.top.value.set(L.top); skyMat.uniforms.mid.value.set(L.mid); skyMat.uniforms.bot.value.set(L.fog);
  skyMat.uniforms.sunCol.value.fromArray(L.disc); skyMat.uniforms.glowK.value = L.glowK; skyMat.uniforms.night.value = L.night;
  sun.color.fromArray(L.sunC); sun.intensity = L.sunI;
  hemi.color.set(L.hs); hemi.groundColor.set(L.hg); hemi.intensity = L.hI;

  /* ---------------- session + primitive helpers ---------------- */

  const ct = ft => Math.max(0, S.t0 + ft);        // film time -> ctx time (never negative)
  const sv = (p, v, ft) => p.setValueAtTime(v, ct(ft));
  const lr = (p, v, ft) => p.linearRampToValueAtTime(v, ct(ft));
  const er = (p, v, ft) => p.exponentialRampToValueAtTime(Math.max(v, EPS), ct(ft));
  const past = ft => !OFFLINE && ct(ft) < ctx.currentTime;

  const gn = v => { const g = ctx.createGain(); g.gain.value = v === undefined ? 1 : v; return g; };
  const bq = (type, f, Q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (Q !== undefined) b.Q.value = Q; return b; };
  const pn = p => { if (!HAS_PAN) return gn(1); const n = ctx.createStereoPanner(); n.pan.value = p || 0; return n; };
  const panTo = (n, pts) => { if (!HAS_PAN || !n.pan) return; sv(n.pan, pts[0][1], pts[0][0]); for (let i = 1; i < pts.length; i++) lr(n.pan, pts[i][1], pts[i][0]); };
  function track(n) {
    const s = S; s.srcs.add(n);
    n.onended = () => { s.srcs.delete(n); try { n.disconnect(); } catch (e) { /* ignore */ } };
    return n;
  }
  function osc(type, f, a, b) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    o.start(ct(a)); o.stop(ct(b)); return track(o);
  }
  function nz(a, b, buf, rate) {
    const s = ctx.createBufferSource(); s.buffer = buf || WHITE; s.loop = true;
    if (rate) s.playbackRate.value = rate;
    s.start(ct(a), rnd() * (s.buffer.duration - 0.2)); s.stop(ct(b)); return track(s);
  }
  const chain = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
  function send(node, G, dry, wet) {
    if (dry > 0) { if (dry === 1) node.connect(G.dry); else chain(node, gn(dry), G.dry); }
    if (wet > 0 && G.wet) chain(node, gn(wet), G.wet);
  }
  function perc(p, ft, peak, att, dec) { sv(p, 0, ft); lr(p, peak, ft + att); er(p, EPS, ft + att + dec); }
  function fade(p, a, b, v, fi, fo) {
    fi = Math.min(fi, (b - a) * 0.5); fo = Math.min(fo, (b - a) * 0.5);
    sv(p, 0, a); lr(p, v, a + fi); lr(p, v, b - fo); lr(p, 0, b);
  }
  function envPts(p, pts, k) { k = k || 1; sv(p, pts[0][1] * k, pts[0][0]); for (let i = 1; i < pts.length; i++) lr(p, pts[i][1] * k, pts[i][0]); }
  function lfo(f, depth, a, b, target) { const o = osc('sine', f, a, b); const g = gn(depth); o.connect(g); g.connect(target); return o; }

  /* ======================= instruments ======================= */

  // brass "braam": detuned saw stack -> grit -> lowpass sweep, plus sub sine
  function braam(G, ft, notes, dur, v, o) {
    o = o || {};
    const att = o.att || 0.3, end = ft + dur;
    const rel = Math.max(0.02, Math.min(o.rel || dur * 0.5, dur - att - 0.02));
    const flt = bq('lowpass', o.f0 || 150, o.Q || 2.2);
    sv(flt.frequency, o.f0 || 150, ft);
    er(flt.frequency, o.f1 || 1800, ft + att + (o.open || 0.25));
    er(flt.frequency, o.f2 || 260, end);
    const env = gn(0);
    sv(env.gain, 0, ft); lr(env.gain, v, ft + att); lr(env.gain, v * (o.sus || 0.75), end - rel); lr(env.gain, 0, end);
    const drv = ctx.createWaveShaper(); drv.curve = DRIVE;
    const det = o.det || 10;
    for (const L of [-1, 0, 1]) {
      const lg = gn(0.32 / notes.length);
      const lp = pn(L * 0.6);
      chain(lg, lp, drv);
      for (const m of notes) {
        const x = osc('sawtooth', mtof(m), ft, end + 0.05);
        sv(x.detune, L * det - 40, ft); lr(x.detune, L * det + rr(-2, 2), ft + 0.2);
        x.connect(lg);
      }
    }
    chain(drv, flt, env);
    const out = gn(1); env.connect(out);
    if (o.sub !== 0) {
      const sm = Math.max(26, Math.min.apply(null, notes) - 12);
      const sub = osc('sine', mtof(sm), ft, end + 0.05);
      const sg = gn(0);
      sv(sg.gain, 0, ft); lr(sg.gain, v * (o.sub || 0.6), ft + att * 1.2 + 0.01); lr(sg.gain, v * (o.sub || 0.6) * 0.7, end - rel); lr(sg.gain, 0, end);
      chain(sub, sg, out);
    }
    send(out, G, 1, o.wet === undefined ? 0.45 : o.wet);
  }

  // sustained strings (saw pairs, vibrato, optional tremolo / bend / crescendo)
  function strings(G, a, dur, notes, v, o) {
    o = o || {};
    const b = a + dur, att = o.att || 0.6, rel = Math.min(o.rel || 0.6, dur * 0.4);
    const vib = osc('sine', o.vibF || 5.3, a, b + 0.05);
    const vg = gn(o.vib === undefined ? 9 : o.vib); vib.connect(vg);
    const mix = gn(0.5 / notes.length);
    for (const m of notes) for (const d of [-7, 7]) {
      const x = osc('sawtooth', mtof(m), a, b + 0.05);
      sv(x.detune, d, a);
      if (o.bend) lr(x.detune, d + o.bend * 100, b);
      vg.connect(x.detune); x.connect(mix);
    }
    const lp = bq('lowpass', o.f || 2600, 0.5);
    if (o.f1) { sv(lp.frequency, o.f || 2600, a); er(lp.frequency, o.f1, b); }
    const env = gn(0);
    if (o.cresc !== undefined) { sv(env.gain, 0, a); lr(env.gain, v * o.cresc, a + att); er(env.gain, v, b - 0.03); lr(env.gain, 0, b); }
    else { sv(env.gain, 0, a); lr(env.gain, v, a + att); lr(env.gain, v * (o.sus || 1), b - rel); lr(env.gain, 0, b); }
    chain(mix, lp, env);
    let last = env;
    if (o.trem) {
      const tg = gn(0.55); lfo(o.trem, 0.45, a, b + 0.05, tg.gain); env.connect(tg); last = tg;
    }
    const out = pn(o.pan || 0); last.connect(out);
    send(out, G, 1, o.wet === undefined ? 0.5 : o.wet);
  }

  // choir-ish sustained note: saws through vowel formants
  function choir(G, a, b, notes, v, o) {
    o = o || {};
    const vib = osc('sine', 4.6, a, b + 0.05); const vg = gn(11); vib.connect(vg);
    const mix = gn(0.4 / notes.length);
    for (const m of notes) for (const d of [-12, 0, 12]) {
      const x = osc('sawtooth', mtof(m), a, b + 0.05); x.detune.value = d; vg.connect(x.detune); x.connect(mix);
    }
    const f1 = bq('bandpass', 650, 3), f2 = bq('bandpass', 1080, 4), f3 = bq('lowpass', 420, 0.7);
    const env = gn(0);
    mix.connect(f1); mix.connect(f2); mix.connect(f3);
    chain(f1, gn(1.6), env); chain(f2, gn(1.0), env); chain(f3, gn(0.5), env);
    sv(env.gain, 0, a); lr(env.gain, v * (o.start || 0.6), a + (o.att || 2.5)); lr(env.gain, v, b - 0.03); lr(env.gain, 0, b);
    send(env, G, 1, o.wet === undefined ? 0.6 : o.wet);
  }

  // low drone: detuned saws, moving lowpass, sub
  function drone(G, a, b, notes, o) {
    const mix = gn(0.11 / notes.length * 3);
    for (const m of notes) for (const d of [-7, 0, 7]) {
      const x = osc('sawtooth', mtof(m), a, b + 0.05); x.detune.value = d + rr(-1.5, 1.5); x.connect(mix);
    }
    const lp = bq('lowpass', o.cut[0][1], 1.1);
    envPts(lp.frequency, o.cut);
    lfo(o.lfoF || 0.07, o.lfo || 40, a, b + 0.05, lp.frequency);
    const env = gn(0); envPts(env.gain, o.env, o.lv);
    chain(mix, lp, env);
    if (o.sub) { const s = osc('sine', mtof(o.sub), a, b + 0.05); chain(s, gn(o.subLv || 0.3), env); }
    send(env, G, 1, o.wet === undefined ? 0.35 : o.wet);
  }

  // taiko / war drum
  function taiko(G, ft, v, o) {
    o = o || {};
    const p = o.p || 1, dec = o.dec || 0.5;
    let dst = G.dry;
    if (o.pan || G.wet) { dst = pn(o.pan || 0); send(dst, G, 1, o.wet === undefined ? 0.3 : o.wet); }
    const b = osc('sine', 150 * p, ft, ft + dec + 0.1);
    sv(b.frequency, 150 * p, ft); er(b.frequency, 54 * p, ft + 0.12 * (o.drop || 1));
    const bg = gn(0); perc(bg.gain, ft, v, 0.003, dec);
    chain(b, bg, dst);
    const n = nz(ft, ft + 0.16);
    const f = bq('bandpass', (o.skinF || 900) * Math.sqrt(p), 1.1);
    const ng = gn(0); perc(ng.gain, ft, v * (o.skin === undefined ? 0.35 : o.skin), 0.001, o.skinDec || 0.06);
    chain(n, f, ng, dst);
    if (o.body) {
      const bn = nz(ft, ft + dec + 0.2, BROWN); const bl = bq('lowpass', 260, 0.7); const bgg = gn(0);
      perc(bgg.gain, ft, v * o.body, 0.004, dec * 0.8); chain(bn, bl, bgg, dst);
    }
  }
  function anvil(G, ft, v) {
    const base = 640;
    [1, 2.76, 5.4].forEach((r, i) => {
      const x = osc('sine', base * r, ft, ft + 0.4); const g = gn(0); perc(g.gain, ft, v / (1 + i), 0.001, 0.25 - i * 0.06); chain(x, g, G.dry);
    });
    const n = nz(ft, ft + 0.06); const h = bq('highpass', 3500); const g = gn(0); perc(g.gain, ft, v * 0.8, 0.001, 0.025); chain(n, h, g, G.dry);
  }

  // generic noise rise into a hit
  function riser(G, a, b, v, o) {
    o = o || {};
    const out = gn(1);
    const n = nz(a, b + 0.02); const f = bq('bandpass', o.f0 || 300, 1.6);
    sv(f.frequency, o.f0 || 300, a); er(f.frequency, o.f1 || 7000, b);
    const g = gn(0); sv(g.gain, EPS, a); er(g.gain, v, b - 0.008); lr(g.gain, 0, b);
    chain(n, f, g, out);
    const tg = gn(0); sv(tg.gain, EPS, a); er(tg.gain, v * (o.tone === undefined ? 0.25 : o.tone), b - 0.008); lr(tg.gain, 0, b);
    const tl = bq('lowpass', 3000, 0.7);
    for (const d of [0, 1.007]) {
      const x = osc('sawtooth', 160, a, b + 0.02);
      sv(x.frequency, (o.p0 || 160) * (d || 1), a); er(x.frequency, (o.p1 || 640) * (d || 1), b); x.connect(tl);
    }
    chain(tl, tg, out);
    send(out, G, 1, o.wet === undefined ? 0.5 : o.wet);
  }
  // reverse swell / suck-back ending abruptly at b
  function suck(G, a, b, v) {
    const out = gn(1);
    const n = nz(a, b + 0.01); const h = bq('highpass', 1200, 0.7); const g = gn(0);
    sv(g.gain, EPS, a); er(g.gain, v, b - 0.004); lr(g.gain, 0, b); chain(n, h, g, out);
    const m = nz(a, b + 0.01, BROWN); const l = bq('lowpass', 500, 0.7); const g2 = gn(0);
    sv(g2.gain, EPS, a); er(g2.gain, v * 1.4, b - 0.004); lr(g2.gain, 0, b); chain(m, l, g2, out);
    const x = osc('sine', 40, a, b + 0.01); sv(x.frequency, 35, a); er(x.frequency, 110, b);
    const g3 = gn(0); sv(g3.gain, EPS, a); er(g3.gain, v * 0.8, b - 0.004); lr(g3.gain, 0, b); chain(x, g3, out);
    send(out, G, 1, 0.15);
  }

  // layered explosion. size ~0.3 (pop) .. 3 (fuel depot)
  function boom(G, ft, size, o) {
    o = o || {};
    const s = size, len = 0.7 + 1.5 * s;
    const out = pn(o.pan || 0);
    let into = out;
    if (o.under) { const l = bq('lowpass', 240, 0.8); l.connect(out); into = l; }
    const k = Math.min(s, 2.2);
    // sub drop
    const sub = osc('sine', 70, ft, ft + len + 0.3);
    sv(sub.frequency, o.subF || 72, ft); er(sub.frequency, 26, ft + 0.3 + 0.5 * s);
    const sg = gn(0); perc(sg.gain, ft, 0.42 * k, 0.006, 0.5 + 0.8 * s); chain(sub, sg, into);
    // body
    const b = nz(ft, ft + len + 0.3, BROWN); const bf = bq('lowpass', 1500, 0.7);
    sv(bf.frequency, (o.bright || 1) * (900 + 700 * s), ft); er(bf.frequency, 100, ft + len);
    const bg = gn(0); perc(bg.gain, ft, 0.75 * k, 0.008, len); chain(b, bf, bg, into);
    // crack transient
    if (!o.under) {
      const c = nz(ft, ft + 0.4); const cf = bq('highpass', 600, 0.6); const cl = bq('lowpass', 6000 * (o.bright || 1), 0.6);
      const cg = gn(0); perc(cg.gain, ft, 0.38 * Math.min(s, 1.8), 0.001, 0.06 + 0.06 * s); chain(c, cf, cl, cg, into);
    }
    // debris rumble tail
    if (o.rumble) {
      const r = nz(ft, ft + len * 2.2 + 0.3, BROWN); const rl = bq('lowpass', 200, 0.7); const rg = gn(0);
      sv(rg.gain, 0, ft); lr(rg.gain, 0.4 * k * o.rumble, ft + 0.25); er(rg.gain, EPS, ft + Math.min(len * 1.6, 4.5)); chain(r, rl, rg, into);
    }
    // metallic partials (ship hit / plane)
    if (o.metal) {
      [1, 1.73, 2.41, 3.12, 4.37].forEach((r, i) => {
        const x = osc('sine', o.metal * r * rr(0.98, 1.02), ft, ft + 1.4);
        const g = gn(0); perc(g.gain, ft, 0.07 * k / (1 + i * 0.5), 0.002, 1.0 - i * 0.15); chain(x, g, into);
      });
    }
    const gk = o.gain || 1;
    send(out, G, (o.dry === undefined ? 1 : o.dry) * gk, (o.wet === undefined ? 0.35 : o.wet) * gk);
  }

  function splash(G, ft, size, o) {
    o = o || {};
    const out = pn(o.pan || 0);
    const n = nz(ft, ft + 0.5 + 2 * size); const hp = bq('highpass', 450, 0.6); const lp = bq('lowpass', 9000, 0.6);
    sv(lp.frequency, 9000, ft); er(lp.frequency, 1600, ft + 0.3 + 1.6 * size);
    const g = gn(0); sv(g.gain, 0, ft); lr(g.gain, 0.42 * size, ft + 0.035); er(g.gain, EPS, ft + 0.4 + 1.6 * size);
    chain(n, hp, lp, g, out);
    const t2 = ft + 0.25 + 0.15 * size;
    const n2 = nz(t2, t2 + 0.6 + 2.6 * size); const bp = bq('bandpass', 1700, 0.45); const g2 = gn(0);
    sv(g2.gain, 0, t2); lr(g2.gain, 0.17 * size, t2 + 0.5); er(g2.gain, EPS, t2 + 0.6 + 2.5 * size);
    chain(n2, bp, g2, out);
    send(out, G, 1, 0.3);
  }

  // whistling projectile; pitch glides f0 -> f1, gain grows until impact at b
  function whistle(G, a, b, v, o) {
    o = o || {};
    const out = pn(o.p0 || 0); panTo(out, [[a, o.p0 || 0], [b, o.p1 || 0]]);
    const g = gn(0); sv(g.gain, EPS, a); er(g.gain, v, b - 0.03); lr(g.gain, 0, b);
    for (const [type, k, lv] of [['sine', 1, 1], ['triangle', 1.006, 0.35]]) {
      const x = osc(type, o.f0, a, b + 0.02); sv(x.frequency, o.f0 * k, a); er(x.frequency, o.f1 * k, b);
      chain(x, gn(lv), g);
    }
    const n = nz(a, b + 0.02); const f = bq('bandpass', o.f0, 3);
    sv(f.frequency, o.f0 * 0.8, a); er(f.frequency, o.f1 * 0.8, b);
    chain(n, f, gn(o.air === undefined ? 1.6 : o.air), g);
    g.connect(out);
    send(out, G, o.dry === undefined ? 1 : o.dry, o.wet === undefined ? 0.4 : o.wet);
  }

  // jet engine pass-by
  function jet(G, a, b, v, o) {
    const pk = o.peak, fl = o.floor || 0.02, tl = o.tail || 0.02, dop = o.dop || 1.05, f = o.whine || 2300;
    const out = pn(o.p0 || 0);
    panTo(out, [[a, o.p0 || 0], [pk, ((o.p0 || 0) + (o.p1 || 0)) / 2], [b, o.p1 || 0]]);
    const mkEnv = k => { const g = gn(0); sv(g.gain, v * k * fl, a); er(g.gain, v * k, pk); er(g.gain, v * k * tl, b - 0.05); lr(g.gain, 0, b); g.connect(out); return g; };
    const n = nz(a, b); const bp = bq('bandpass', 600, 0.55); const lp = bq('lowpass', 2000, 0.6);
    sv(bp.frequency, 520, a); er(bp.frequency, 2000, pk); er(bp.frequency, 360, b);
    sv(lp.frequency, 1600, a); er(lp.frequency, 8000, pk); er(lp.frequency, 900, b);
    chain(n, bp, lp, mkEnv(1));
    const r = nz(a, b, BROWN); chain(r, bq('lowpass', 240, 0.7), mkEnv(1.1));
    const wb = bq('bandpass', f, 1.4); const we = mkEnv(0.09);
    for (const d of [1, 1.0075]) {
      const x = osc('sawtooth', f, a, b);
      sv(x.frequency, f * dop * d, a); er(x.frequency, f * dop * d, Math.max(a + 0.01, pk - 0.25));
      er(x.frequency, f / dop * d, pk + 0.25); er(x.frequency, f / dop * 0.97 * d, b);
      x.connect(wb);
    }
    chain(wb, we);
    send(out, G, 1, o.wet === undefined ? 0.25 : o.wet);
  }

  function missile(G, ft, v, o) {
    o = o || {};
    const out = pn(o.p0 || 0); panTo(out, [[ft, o.p0 || 0], [ft + 2, o.p1 || 0]]);
    const c = nz(ft, ft + 0.2); const cg = gn(0); perc(cg.gain, ft, v, 0.001, 0.08); chain(c, bq('highpass', 1200, 0.7), cg, out);
    const th = osc('sine', 110, ft, ft + 0.4); sv(th.frequency, 120, ft); er(th.frequency, 45, ft + 0.2);
    const tg = gn(0); perc(tg.gain, ft, v * 0.7, 0.002, 0.25); chain(th, tg, out);
    const h = nz(ft, ft + 2.4); const hb = bq('bandpass', 2600, 0.6); const hl = bq('lowpass', 9000, 0.6);
    sv(hl.frequency, 9000, ft); er(hl.frequency, 1100, ft + 2.2);
    const hg = gn(0); sv(hg.gain, 0, ft); lr(hg.gain, v * 0.55, ft + 0.03); lr(hg.gain, v * 0.5, ft + 0.35); er(hg.gain, EPS, ft + 2.3);
    chain(h, hb, hl, hg, out);
    send(out, G, 1, 0.3);
  }

  // rapid hit train on shared nodes: noise burst + pitched thump per hit
  function train(G, hits, o) {
    if (!hits.length) return;
    const a = hits[0][0], b = hits[hits.length - 1][0] + 0.7;
    const out = pn(o.pan || 0);
    let ng = null, tg = null, to = null;
    if (o.n) {
      const n = nz(a - 0.01, b, o.n.buf); const f = bq(o.n.type || 'bandpass', o.n.f, o.n.Q || 1);
      ng = gn(0); chain(n, f, ng); if (o.n.lp) chain(ng, bq('lowpass', o.n.lp, 0.6), out); else ng.connect(out);
    }
    if (o.t) { to = osc(o.t.type || 'sine', o.t.f0, a - 0.01, b); tg = gn(0); chain(to, tg, out); }
    for (let i = 0; i < hits.length; i++) {
      const t = hits[i][0], v = hits[i][1];
      const gap = i + 1 < hits.length ? hits[i + 1][0] - t : 1;
      if (ng) {
        const d = Math.max(0.002, Math.min(o.n.dec, gap - 0.004));
        sv(ng.gain, EPS, t); lr(ng.gain, v * (o.n.lv || 1), t + 0.0015); er(ng.gain, EPS, t + 0.0015 + d);
      }
      if (tg) {
        const d = Math.max(0.003, Math.min(o.t.dec, gap - 0.006));
        sv(to.frequency, o.t.f0, t); er(to.frequency, o.t.f1, t + Math.min(o.t.sweep || 0.05, d));
        sv(tg.gain, EPS, t); lr(tg.gain, v * (o.t.lv || 1), t + 0.002); er(tg.gain, EPS, t + 0.002 + d);
      }
    }
    send(out, G, 1, o.wet === undefined ? 0.2 : o.wet);
  }
  function gun(G, a, b, rate, v, o) {
    o = o || {};
    const hits = [];
    for (let t = a; t < b; t += (1 / rate) * rr(0.88, 1.12)) hits.push([t, v * rr(0.7, 1)]);
    train(G, hits, {
      pan: o.pan, wet: o.wet === undefined ? 0.22 : o.wet,
      n: { f: o.f || 1500, Q: o.Q || 0.9, dec: o.dec || 0.032, lv: 1 },
      t: { f0: o.tf || 150, f1: 50, dec: (o.dec || 0.032) * 1.7, lv: o.thump === undefined ? 0.7 : o.thump, sweep: 0.04 },
    });
  }

  function clunk(G, ft, v, o) {
    o = o || {};
    const f = o.f || 1, out = pn(o.pan || 0);
    const n = nz(ft, ft + 0.12); const g = gn(0); perc(g.gain, ft, v * 0.55, 0.001, 0.05);
    chain(n, bq('bandpass', 2200 * f, 1.4), g, out);
    [1, 2.32, 3.87, 5.21].forEach((r, i) => {
      const x = osc('sine', 180 * f * r, ft, ft + 0.6); const pg = gn(0);

  d.head.appendChild(st);
  const sc = d.createElement('script'); sc.textContent = $('hbt-engine').textContent; d.body.appendChild(sc);
  if (!W.HBT) throw new Error('The trailer could not start');
  W.HBT.init();
  setStatus('Preparing');
  await new Promise(r => setTimeout(r, 30));
  W.HBT.warm();
  ready = true;
}

// ---------- clock, sound and playback ----------
let ctx = null, score = null, playing = false, paused = false, t0 = 0, pausedAt = 0, muted = false, lastT = -1, endShown = false;
function now() {
  if (!playing) return pausedAt;
  if (ctx && score) return ctx.currentTime - t0;
  return (performance.now() / 1000) - t0;
}
function play() {
  if (!ready) return;
  $('start').style.display = 'none';
  try {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (ctx && typeof makeScore === 'function') { if (score) score.stop(); score = makeScore(ctx); score.setMuted(muted); }
  } catch (e) { console.warn('trailer: no sound', e); score = null; }
  if (ctx && score) { t0 = ctx.currentTime + 0.12; score.start(t0); } else t0 = performance.now() / 1000;
  playing = true; paused = false; endShown = false; $('end').classList.remove('on');
  W.HBT.frame(0);
}
function togglePause() {
  if (!playing && !paused) return;
  if (!paused) { pausedAt = now(); paused = true; playing = false; if (ctx) ctx.suspend(); }
  else { paused = false; playing = true; if (ctx && score) { ctx.resume(); t0 = ctx.currentTime - pausedAt; } else t0 = performance.now() / 1000 - pausedAt; }
}
function again() { if (!ready) return; if (score) score.stop(); score = null; playing = false; paused = false; if (ctx && ctx.state === 'suspended') ctx.resume(); play(); }
function setMute(m) { muted = m; if (score) score.setMuted(m); $('cMute').style.opacity = m ? 0.45 : 1; }
function fullscreen() { const d = document; if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else { const e = d.documentElement; (e.requestFullscreen || e.webkitRequestFullscreen || (() => {})).call(e); } }

$('playBtn').addEventListener('click', play);
$('again').addEventListener('click', again);
$('cPause').addEventListener('click', togglePause);
$('cMute').addEventListener('click', () => setMute(!muted));
$('cFull').addEventListener('click', fullscreen);
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); if (!playing && !paused && ready && $('start').style.display !== 'none') play(); else togglePause(); }
  else if (e.key === 'm' || e.key === 'M') setMute(!muted);
  else if (e.key === 'f' || e.key === 'F') fullscreen();
  else if (e.key === 'r' || e.key === 'R') again();
});
let idle = 0;
const wake = () => { idle = performance.now(); };
addEventListener('mousemove', wake); addEventListener('touchstart', wake, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) togglePause(); });

// keep the frame rate up: render smaller if frames are slow, a little at a time
const perf = { n: 0, sum: 0, last: performance.now() };
function adapt(ms) {
  perf.n++; perf.sum += ms;
  if (perf.n < 45) return;
  const avg = perf.sum / perf.n; perf.n = 0; perf.sum = 0;
  const s = W.HBT.scale;
  if (avg > 42 && s > 0.55) W.HBT.setScale(Math.max(0.55, s - 0.15));
  else if (avg < 22 && s < 1) W.HBT.setScale(Math.min(1, s + 0.1));
}
function tick() {
  requestAnimationFrame(tick);
  const n = performance.now(), ms = n - perf.last; perf.last = n;
  if (!ready || (!playing && !paused)) return;
  const t = Math.max(0, now());
  if (t !== lastT) { W.HBT.frame(t); lastT = t; if (playing) adapt(ms); }
  updateCards(t); updateTitle(t);
  $('shade').style.opacity = shadeAt(t).toFixed(3);
  if (!W.HBT.film) $('flash').style.opacity = Math.min(0.8, W.HBT.flash).toFixed(3);
  $('prog').style.width = (Math.min(1, t / DURATION) * 100).toFixed(2) + '%';
  const showCtl = performance.now() - idle < 2200 || paused;
  $('ctl').classList.toggle('show', showCtl && t < END_AT); $('prog').classList.toggle('show', showCtl && t < END_AT);
  if (t >= END_AT && !endShown) { endShown = true; $('end').classList.add('on'); }
}
requestAnimationFrame(tick);

load().then(() => {
  setStatus('Official trailer');
  $('playBtn').disabled = false; $('playBtn').style.opacity = 1;
  window.trailer = { seek(t) { pausedAt = t; playing = false; paused = true; $('start').style.display = 'none'; lastT = -1; }, get ready() { return ready; }, HBT: W.HBT };
  if (QS.has('t')) { const t = parseFloat(QS.get('t')) || 0; window.trailer.seek(t); if (!QS.has('still')) { paused = false; playing = true; t0 = performance.now() / 1000 - t; } }
}).catch(err => { console.error(err); setStatus('Could not load the game: ' + err.message); });
})();
</script>
</body>
