<script type="text/plain" id="hbt-engine">
/* ==========================================================================
   Havoc Bay trailer: the director.
   This script is put into the game page (loaded in a frame by trailer.html, its own frame loop and title reel
   switched off before they start) and films the game's real world: its harbors, islands, water and sky, its
   ships (buildShipModel), planes (buildPlaneModel), B-52 (buildB52), turrets and its fire, smoke and splash
   effects. It adds cameras, lighting moods, a film finish and a few effects of its own (tracers, rings, flashes).
   Every shot is a function of film time: HBT.frame(t) draws the moment t, and jumping to any t replays the shot
   it is in from its start, so a moment always looks the same.
   ========================================================================== */
(() => {
'use strict';
const T = THREE;
const Vc = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const eio = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const hs = (x, y) => { const s = Math.sin(x * 157.31 + y * 271.97) * 41758.5453; return s - Math.floor(s); };
const wob = (t, s) => { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return (hs(i, s) + (hs(i + 1, s) - hs(i, s)) * u) * 2 - 1; };
const lin = hex => new T.Color(hex);
const BLUE = 0, RED = 1;
const HB = HARBORS[0], HR = HARBORS[1];
const KEEP = H => H.boxes.reduce((a, b) => (b.maxY > a.maxY ? b : a), H.boxes[0]);
const boxTop = B => Vc((B.minX + B.maxX) / 2, B.maxY, (B.minZ + B.maxZ) / 2);

// ---------- the film finish ----------
// The scene goes to a float target without tone mapping; bright parts are blurred into a bloom and a long
// sideways streak (an anamorphic lens); one pass then applies the same filmic curve the game uses, grades the
// colour per shot (lift, gamma, gain, saturation, contrast), and adds the streak, vignette, grain and a slight
// colour split at the edges.
function makeFilm() {
  if (!renderer.capabilities.isWebGL2) return null;
  const f = { type: T.HalfFloatType, minFilter: T.LinearFilter, magFilter: T.LinearFilter };
  const main = new T.WebGLMultisampleRenderTarget(4, 4, Object.assign({ depthBuffer: true }, f)); main.samples = 4;
  const mk = () => new T.WebGLRenderTarget(4, 4, Object.assign({ depthBuffer: false }, f));
  const half = mk(), b1 = mk(), b2 = mk(), s1 = mk(), s2 = mk();
  const cam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1), qs = new T.Scene(), quad = new T.Mesh(new T.PlaneGeometry(2, 2)); quad.frustumCulled = false; qs.add(quad);
  const vs = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const pass = (u, fs) => new T.ShaderMaterial({ uniforms: u, vertexShader: vs, fragmentShader: fs, depthTest: false, depthWrite: false, toneMapped: false });
  const bright = pass({ t: { value: null }, th: { value: 1 } }, `uniform sampler2D t; uniform float th; varying vec2 vUv;
    void main(){ vec3 c = texture2D(t, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th * 1.7, l), 1.0); }`);
  const blur = pass({ t: { value: null }, d: { value: new T.Vector2() } }, `uniform sampler2D t; uniform vec2 d; varying vec2 vUv;
    void main(){ vec3 c = texture2D(t, vUv).rgb * 0.2270;
      c += (texture2D(t, vUv + d * 1.3846).rgb + texture2D(t, vUv - d * 1.3846).rgb) * 0.3162;
      c += (texture2D(t, vUv + d * 3.2308).rgb + texture2D(t, vUv - d * 3.2308).rgb) * 0.0703; gl_FragColor = vec4(c, 1.0); }`);
  const U = {
    t: { value: null }, b: { value: null }, s: { value: null }, time: { value: 0 }, exposure: { value: 1.3 }, bloom: { value: 0.5 }, streak: { value: 0.4 }, streakCol: { value: new T.Color(0.5, 0.7, 1.25) },
    lift: { value: new T.Vector3() }, gam: { value: new T.Vector3(1, 1, 1) }, gain: { value: new T.Vector3(1, 1, 1) }, sat: { value: 1 }, con: { value: 1 }, vig: { value: 0.4 }, grain: { value: 0.035 }, split: { value: 0.0015 }, aspect: { value: 1 }, flash: { value: 0 },
  };
  const comp = pass(U, `uniform sampler2D t, b, s; uniform float time, exposure, bloom, streak, sat, con, vig, grain, split, aspect, flash; uniform vec3 streakCol, lift, gam, gain; varying vec2 vUv;
    vec3 fit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
    vec3 aces(vec3 c){
      const mat3 IN = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
      const mat3 OUT = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
      return clamp(OUT * fit(IN * (c * exposure / 0.6)), 0.0, 1.0); }
    void main(){
      vec2 p = vUv - 0.5; float r2 = dot(p, p) * 2.0;   // 0 in the middle, 1 in the corners
      vec2 off = p * split * (1.0 + r2 * 2.0);
      vec3 c = vec3(texture2D(t, vUv + off).r, texture2D(t, vUv).g, texture2D(t, vUv - off).b);
      c += texture2D(b, vUv).rgb * bloom + texture2D(s, vUv).rgb * streakCol * streak;
      c += vec3(1.0, 0.92, 0.8) * flash;
      c = aces(c);
      c = pow(max(c * gain + lift * (1.0 - c), 0.0), 1.0 / gam);
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, sat);
      c = (c - 0.5) * con + 0.5;
      c *= 1.0 - vig * 0.75 * smoothstep(0.25, 1.1, r2);
      float n = fract(sin(dot(vUv * vec2(1931.7, 1213.3) + fract(time * 3.71), vec2(12.9898, 78.233))) * 43758.5453);
      c += (n - 0.5) * grain;
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`);
  const size = new T.Vector2();
  const draw = (m, tg) => { quad.material = m; renderer.setRenderTarget(tg); renderer.render(qs, cam); };
  const bl = (src, dst, x, y) => { blur.uniforms.t.value = src.texture; blur.uniforms.d.value.set(x, y); draw(blur, dst); };
  return {
    setSize() {
      renderer.getDrawingBufferSize(size); const w = Math.max(4, size.x), h = Math.max(4, size.y);
      main.setSize(w, h); for (const rt of [half, b1, b2]) rt.setSize(Math.max(4, w >> 1), Math.max(4, h >> 1));
      for (const rt of [s1, s2]) rt.setSize(Math.max(4, w >> 2), Math.max(4, h >> 3));
      U.aspect.value = w / h;
    },
    render(L, time, flash) {
      renderer.setRenderTarget(main); renderer.render(scene, camera);
      bright.uniforms.th.value = L.g.th; bright.uniforms.t.value = main.texture; draw(bright, half);
      const px = 1 / half.width, py = 1 / half.height;
      bl(half, b1, px, 0); bl(b1, b2, 0, py); bl(b2, b1, px * 2.2, 0); bl(b1, b2, 0, py * 2.2);
      const sx = 1 / s1.width; bl(half, s1, sx, 0); bl(s1, s2, sx * 3, 0); bl(s2, s1, sx * 7, 0); bl(s1, s2, sx * 15, 0);
      const g = L.g; U.t.value = main.texture; U.b.value = b2.texture; U.s.value = s2.texture; U.time.value = time; U.exposure.value = L.exp; U.flash.value = flash;
      U.bloom.value = g.bloom; U.streak.value = g.streak; U.lift.value.fromArray(g.lift); U.gam.value.fromArray(g.gam); U.gain.value.fromArray(g.gain);
      U.sat.value = g.sat; U.con.value = g.con; U.vig.value = g.vig; U.grain.value = g.grain; U.split.value = g.split;
      draw(comp, null);
    },
  };
}

// ---------- lighting moods ----------
const G0 = { lift: [0, 0, 0], gam: [1, 1, 1], gain: [1, 1, 1], sat: 1, con: 1.05, bloom: 0.35, th: 1.3, streak: 0.3, vig: 0.35, grain: 0.03, split: 0.0012 };
const look = (o, g) => Object.assign({ fogN: 300, fogF: 4300, night: 0, glowK: 1, cloudC: 1, exp: 1.3 }, o, { g: Object.assign({}, G0, g) });
const LOOKS = {
  // sunrise behind the Red harbor (east, +x): long warm light, the sea glittering toward the sun
  dawn: look({ top: '#253566', mid: '#ee9c6c', fog: '#d9a07e', fogN: 700, fogF: 6800, sun: [0.93, 0.13, 0.33], sunC: [1, 0.66, 0.42], sunI: 1.25, disc: [1, 0.6, 0.32], glowK: 2.0,
    hs: '#efc8aa', hg: '#4a3a32', hI: 0.42, deep: '#173a5e', shallow: '#3c7f88', skyc: '#d9a084', cloud: '#c98a70', cloudC: 0.8, exp: 1.12 },
    { lift: [0.01, 0.0, 0.03], gain: [1.05, 1.0, 0.93], sat: 1.14, con: 1.12, bloom: 0.42, th: 1.15, streak: 0.45 }),
  // battle: mid-morning, a high hard sun and a teal-and-orange grade
  day: look({ top: '#2f5590', mid: '#a6bccd', fog: '#b0c2cf', fogN: 800, fogF: 7200, sun: [0.55, 0.52, 0.42], sunC: [1, 0.9, 0.76], sunI: 1.15, disc: [1, 0.95, 0.85], glowK: 1.2,
    hs: '#d6e0e8', hg: '#5e5446', hI: 0.46, deep: '#123c66', shallow: '#3a8e98', skyc: '#9db6c9', cloud: '#8f9aa6', exp: 1.16 },
    { lift: [0.0, 0.01, 0.03], gain: [1.06, 1.0, 0.92], sat: 1.12, con: 1.14, bloom: 0.32, th: 1.45, streak: 0.28 }),
  // smoke over the fleet: the sun dimmed and orange, the air thick
  smoke: look({ top: '#3a4352', mid: '#a08c7e', fog: '#8a7d74', fogN: 350, fogF: 4800, sun: [0.5, 0.33, 0.5], sunC: [1, 0.72, 0.45], sunI: 0.95, disc: [1, 0.55, 0.28], glowK: 2.4,
    hs: '#c4b6a8', hg: '#3e362f', hI: 0.4, deep: '#163246', shallow: '#2c6e74', skyc: '#9a8e86', cloud: '#7a7068', cloudC: 0.7, exp: 1.15 },
    { lift: [0.01, 0.01, 0.02], gain: [1.07, 0.99, 0.9], sat: 1.04, con: 1.16, bloom: 0.38, th: 1.2, streak: 0.38 }),
  // the storm: dark cloud, cold light, lightning
  storm: look({ top: '#0c1118', mid: '#39414b', fog: '#353c45', fogN: 120, fogF: 2600, sun: [0.3, 0.3, -0.5], sunC: [0.62, 0.7, 0.85], sunI: 0.55, disc: [0, 0, 0], glowK: 0.3,
    hs: '#5a677a', hg: '#1a1c20', hI: 0.55, deep: '#0d1b27', shallow: '#1f3b45', skyc: '#3b454f', cloud: '#2b3139', cloudC: 0.32, exp: 1.35 },
    { lift: [0.0, 0.01, 0.03], gain: [0.95, 1.0, 1.07], sat: 0.78, con: 1.14, bloom: 0.55, th: 0.85, streak: 0.5, vig: 0.5 }),
  // the bombing: storm light with the fires coming up
  fire: look({ top: '#10131a', mid: '#5a3426', fog: '#3e2b24', fogN: 150, fogF: 3200, sun: [-0.55, 0.3, -0.45], sunC: [1, 0.58, 0.36], sunI: 0.6, disc: [0, 0, 0], glowK: 0,
    hs: '#6c5044', hg: '#1a1210', hI: 0.45, deep: '#101b23', shallow: '#2a3b3b', skyc: '#5c3c30', cloud: '#3c2c26', cloudC: 0.35, exp: 1.35 },
    { lift: [0.015, 0.0, 0.0], gain: [1.08, 0.98, 0.9], sat: 1.05, con: 1.14, bloom: 0.5, th: 1.1, streak: 0.5, vig: 0.45 }),
  // after: night, the harbor burning
  night: look({ top: '#05070d', mid: '#3a1e16', fog: '#22150f', fogN: 120, fogF: 3200, sun: [-0.4, 0.45, -0.3], sunC: [0.5, 0.6, 0.92], sunI: 0.28, disc: [0.5, 0.55, 0.65], glowK: 0.4, night: 0.7,
    hs: '#4a5070', hg: '#1a1210', hI: 0.5, deep: '#0a1822', shallow: '#123038', skyc: '#2c2026', cloud: '#2a1e1c', cloudC: 0.25, exp: 1.95 },
    { lift: [0.0, 0.0, 0.02], gain: [1.06, 0.98, 0.94], sat: 1.05, con: 1.1, bloom: 0.7, th: 0.9, streak: 0.6, vig: 0.5 }),
};
let LOOK = LOOKS.day;
const _c = new T.Color();
function setLook(L) {
  LOOK = L;
  SUN_DIR.set(L.sun[0], L.sun[1], L.sun[2]).normalize();
  FOG_COL.set(L.fog); scene.fog.color.set(L.fog); scene.fog.near = L.fogN; scene.fog.far = L.fogF;
  skyMat.uniforms.top.value.set(L.top); skyMat.uniforms.mid.value.set(L.mid); skyMat.uniforms.bot.value.set(L.fog);
  skyMat.uniforms.sunCol.value.fromArray(L.disc); skyMat.uniforms.glowK.value = L.glowK; skyMat.uniforms.night.value = L.night;
  sun.color.fromArray(L.sunC); sun.intensity = L.sunI;
  hemi.color.set(L.hs); hemi.groundColor.set(L.hg); hemi.intensity = L.hI;
  const W = waterMat.uniforms; W.deep.value.set(L.deep); W.shallow.value.set(L.shallow); W.skyc.value.set(L.skyc);
  W.sunCol.value.fromArray(L.disc).multiplyScalar(0.9); W.fogColor.value.set(L.fog); W.fogNear.value = L.fogN; W.fogFar.value = L.fogF;
  MAT.cloud.emissive.set(L.cloud); MAT.cloud.color.setScalar(L.cloudC);
  renderer.setClearColor(_c.set(L.fog));
}

  const CH = {

  if (avg > 42 && s > 0.55) W.HBT.setScale(Math.max(0.55, s - 0.15));
  else if (avg < 22 && s < 1) W.HBT.setScale(Math.min(1, s + 0.1));
}
function tick() {
  requestAnimationFrame(tick);
  const n = performance.now(), ms = n - perf.last; perf.last = n;
  if (!ready || (!playing && !paused)) return;
  const t = Math.max(0, now());
  if (t !== lastT) { W.HBT.frame(t); lastT = t; if (playing) adapt(ms); }
  updateCards(t); updateTitle(t);
  $('shade').style.opacity = shadeAt(t).toFixed(3);
  if (!W.HBT.film) $('flash').style.opacity = Math.min(0.8, W.HBT.flash).toFixed(3);
  $('prog').style.width = (Math.min(1, t / DURATION) * 100).toFixed(2) + '%';
  const showCtl = performance.now() - idle < 2200 || paused;
  $('ctl').classList.toggle('show', showCtl && t < END_AT); $('prog').classList.toggle('show', showCtl && t < END_AT);
  if (t >= END_AT && !endShown) { endShown = true; $('end').classList.add('on'); }
}
requestAnimationFrame(tick);

load().then(() => {
  setStatus('Official trailer');
  $('playBtn').disabled = false; $('playBtn').style.opacity = 1;
  window.trailer = { seek(t) { pausedAt = t; playing = false; paused = true; $('start').style.display = 'none'; lastT = -1; }, get ready() { return ready; }, HBT: W.HBT };
  if (QS.has('t')) { const t = parseFloat(QS.get('t')) || 0; window.trailer.seek(t); if (!QS.has('still')) { paused = false; playing = true; t0 = performance.now() / 1000 - t; } }
}).catch(err => { console.error(err); setStatus('Could not load the game: ' + err.message); });
})();
</script>
