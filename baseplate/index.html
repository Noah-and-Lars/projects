<title>Gear Baseplate</title>
<style>
:root { --bg:#cfd6dc; --ink:#1d2328; --panel:rgba(255,255,255,.82); }

canvas { display:block; touch-action:none; }

#hud button { margin:6px 6px 0 0; padding:4px 10px; border:1px solid currentColor; border-radius:6px; background:none; color:inherit; font:inherit; cursor:pointer; }
#hud small { display:block; margin-top:6px; opacity:.7; }
</style>
</head>

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const sky = new THREE.Color(0xc9d3db);
scene.background = sky;
scene.fog = new THREE.Fog(sky, 60, 260);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.02, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 0.3;
controls.maxDistance = 200;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f94, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(4, 7, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const views = {
  gear: [[3.4, 1.4, 1.6], [0.55, 0.35, 0]],
  side: [[3.6, 0.9, 0], [0.2, 0.55, 0]],
  wide: [[22, 14, 22], [0, 0, 0]],
};
function setView(v) {
  camera.position.set(...views[v][0]);
  controls.target.set(...views[v][1]);
  controls.update();
}
document.querySelectorAll('#hud button').forEach(b => b.onclick = () => setView(b.dataset.v));
setView('gear');

const bytes = Uint8Array.from(atob(GLB_B64), c => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, '', gltf => {
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const plate = o.name === 'Baseplate';
    o.castShadow = !plate;
    o.receiveShadow = true;
  });
  scene.add(gltf.scene);
  window.__ready = true;
}, err => { document.getElementById('hud').textContent = 'Could not load the models: ' + err; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
