<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 2026-11-15: Apple Watch. The meta stops watchOS shrinking the page as if it were a 320px phone; the script marks
     a watch (html.watch, window.ARCADE_WATCH: tiny screen, or ?watch=1 to test) so watch.css loads and the extras skip -->
<meta name="disabled-adaptations" content="watch">
<script>(function () { try { var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height), w = window.innerWidth || 0, h = window.innerHeight || 0, t = navigator.maxTouchPoints > 0 || 'ontouchstart' in window; if (/Watch|watchOS/i.test(navigator.userAgent || '') || /[?&]watch=1/.test(location.search) || (a > 0 && a <= 340 && b <= 420) || (t && w > 0 && w <= 340 && h > 0 && h <= 420)) { window.ARCADE_WATCH = 1; document.documentElement.classList.add('watch', 'mob', 'mob-phone'); } } catch (e) {} })();</script>
<script>
// 2026-11-07: phones and tablets get their own layout (html.mob, see the end of arcade.css). It goes by the device,
// not the window width, so desktops stay exactly as they were. ?mob=phone, ?mob=tab or ?mob=off forces one (tests).
(function () {
  var u = navigator.userAgent || '', c = document.documentElement.classList, f = '';
  try { f = (/[?&]mob=(phone|tab|off)/.exec(location.search) || [])[1] || sessionStorage.getItem('arcade-mob') || ''; if (f) sessionStorage.setItem('arcade-mob', f); } catch (e) {}
  var ipad = /iPad/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var phone = /iPhone|iPod|Windows Phone|BlackBerry|webOS|Android.+Mobile|Mobile.+Firefox/.test(u);
  var tab = !phone && (ipad || /Android|Tablet|Silk|Kindle|PlayBook/.test(u));
  if (f) { phone = f === 'phone'; tab = f === 'tab'; }
  if (phone || tab) { c.add('mob'); c.add(phone ? 'mob-phone' : 'mob-tab'); }
  var vh = function () { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); };
  vh(); window.addEventListener('resize', vh);
  // older browsers (iOS before 14) don't have replaceChildren, which the home page uses to list the games
  if (window.Element && !Element.prototype.replaceChildren) Element.prototype.replaceChildren = function () { while (this.firstChild) this.removeChild(this.firstChild); for (var i = 0; i < arguments.length; i++) { var n = arguments[i]; this.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); } };
})();
</script>

<body class="player">
<header class="top">
  <a class="back" href="index.html" aria-label="Back to all games">← All games</a>
  <div class="ptitle-wrap">
    <h1 id="title" class="ptitle"></h1>
    <span id="best" class="pbest" hidden></span>
  </div>
  <div class="actions">
    <button id="padBtn" class="btn ghost pad-btn" type="button" title="Use your phone as a controller"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></svg><span>Phone</span></button>
    <button id="liveBtn" class="btn ghost live-btn" type="button" title="Stream this game to your friends"><i aria-hidden="true"></i><span>Go live</span></button>
    <button id="clip" class="btn ghost" title="Record a clip of your game (F8)">Clip</button>
    <a id="next" class="btn ghost">Next game →</a>
    <button id="fs" class="btn">Fullscreen</button>
  </div>
</header>

<main class="stage-wrap">
  <div id="stage" class="stage">
    <iframe id="frame" title="Game" allowfullscreen allow="microphone; gamepad; fullscreen"></iframe>
    <div id="loading" class="loading">
      <img id="loadArt" alt="">
      <div class="loading-box">
        <p id="loadText">Loading…</p>
        <div class="loading-bar"><i></i></div>
      </div>
    </div>
  </div>
  <script src="intro.js?v=4"></script>

  <section class="howto">
    <h2 class="sec-h">How to play</h2>
    <ul id="keys" class="keys"></ul>
    <p class="hint">Click the game if the keys don't respond. <a id="newtab" target="_blank" rel="noopener">Open in its own tab</a></p>
  </section>

  <h2 class="sec-h more-h">More games</h2>
  <section id="more" class="grid small"></section>
</main>

<script src="games.js?v=279"></script>
<script src="account.js?v=44"></script>
<script src="assistant.js?v=7"></script>
<script src="console.js?v=4"></script>
<script src="call.js?v=8"></script>
<script src="clips.js?v=6"></script>
<script src="vendor/qrcode.js?v=1"></script>
<script src="pair.js?v=1"></script>
<script src="tourney.js?v=4"></script>
<script src="live.js?v=2"></script>
<script>
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('game');
const index = GAMES.findIndex(g => g.id === id);
const game = GAMES[index];

if (!game) {
  location.replace('index.html');
} else {
  Arcade.markPlayed(game.id);
  // Play time for "Most played" on the Players page: every 15 s on screen counts (a hidden tab doesn't)
  setInterval(() => { if (!document.hidden) Arcade.addTime(game.id, 15); }, 15000);
  // Count this player as on this game; the game in the frame reads the count through window.ArcadeOnline
  ArcadeOnline.start(game.id);
  document.title = game.title + " · The Arcade";
  $('title').textContent = game.title;

  // Your best, kept up to date while you play (the game saves it from inside the frame)
  const showBest = () => {
    const s = Arcade.stat(game);
    $('best').hidden = !s;
    if (s) $('best').textContent = s;
  };
  showBest();
  addEventListener('storage', showBest);

  // Loading screen until the game is ready, then hand it the keyboard
  const frame = $('frame');
  $('loadArt').src = game.thumb;
  $('loadText').textContent = 'Loading ' + game.title + '…';
  frame.addEventListener('load', () => {
    $('loading').classList.add('done');
    try { frame.contentWindow.focus(); } catch (e) {}
    if (window.ArcadeIntro) ArcadeIntro.done.then(() => { try { frame.contentWindow.focus(); } catch (e) {} }); // after the intro has gone
  });
  // with an account, the game waits (a few seconds at most) for its progress to arrive from the cloud first
  // 2026-11-17: a tournament match (tourney.js) passes its table to the game and reports how it ended
  const TQ = new URLSearchParams(location.search), TID = (TQ.get('tid') || '').replace(/[^A-Z0-9]/g, ''), TM = (TQ.get('tm') || '').replace(/[^0-9-]/g, ''), TCODE = (TQ.get('tcode') || '').replace(/[^A-Z0-9]/g, '');
  const tPass = ['tmatch', 'tside', 'tname'].filter(k => TQ.get(k)).map(k => k + '=' + encodeURIComponent(TQ.get(k))).join('&');
  const gameSrc = tPass ? game.path + (game.path.includes('?') ? '&' : '?') + tPass : game.path;
  if (TID && TM && window.ArcadeTourney) {
    ArcadeTourney.reporter(TID, TM, TCODE);
    const bar = document.createElement('a'); bar.className = 'tbar'; bar.href = 'tourney.html?t=' + TID;
    bar.innerHTML = '<b>Tournament match</b><span>Win to move up the bracket</span><em>Back to the bracket</em>';
    document.querySelector('.stage-wrap').prepend(bar);
    ArcadeTourney.onMatchEnd = res => { bar.classList.add('done'); bar.querySelector('span').textContent = res === 'w' || res === 'left' ? 'You won! You’re through to the next round.' : res === 'd' ? 'A draw: play the match again from the bracket.' : res === 'aborted' ? 'Not played: start the match again from the bracket.' : 'Knocked out. Thanks for playing!'; };
  }
  const start = () => { if (!frame.src) (window.ArcadeIntro ? ArcadeIntro.load : Promise.resolve()).then(() => { if (!frame.src) frame.src = gameSrc; }); }; // after the intro (intro.js)
  if (window.ArcadeAccount) {
    ArcadeAccount.ready().then(start);
    ArcadeAccount.onPulled(g => { if (g.includes(game.id) && frame.src) try { frame.contentWindow.location.reload(); } catch (e) { frame.src = game.path; } });
  } else start();
  // 🎬 Clip: record the game and post it to Social (clips.js)
  if (window.ArcadeClips) ArcadeClips.attach(frame, game, $('clip')); else $('clip').hidden = true;
  // 📱 Phone: phones as controllers, or carry on playing on the phone (pair.js)
  if (window.ArcadePair) ArcadePair.attach(game, frame, $('padBtn')); else $('padBtn').hidden = true;
  // Go live: stream this game to viewers on live.html (live.js)
  if (window.ArcadeLive && window.RTCPeerConnection) ArcadeLive.host(game, $('stage'), frame, $('liveBtn')); else $('liveBtn').hidden = true;
  $('newtab').href = game.path;

  const next = GAMES[(index + 1) % GAMES.length];
  $('next').href = 'play.html?game=' + encodeURIComponent(next.id);
  $('next').title = 'Play ' + next.title;

  for (const [k, what] of game.keys || []) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="kbds"></span><span></span>';
    for (const part of k.split(' / ')) {
      const kbd = document.createElement('kbd');
      kbd.textContent = part;
      li.firstChild.append(kbd);
    }
    li.lastChild.textContent = what;
    $('keys').appendChild(li);
  }

  const stage = $('stage');
  $('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
  };

  for (const g of GAMES.filter(g => g.id !== id)) {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = 'play.html?game=' + encodeURIComponent(g.id);
    a.innerHTML = '<div class="thumb"><img alt="" loading="lazy"></div><div class="info"><h2></h2><p class="desc"></p></div>';
    a.querySelector('img').src = g.thumb;
    a.querySelector('h2').textContent = g.title;
    a.querySelector('.desc').textContent = Arcade.stat(g) || g.tagline;
    $('more').appendChild(a);
  }
}
</script>
