<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// 2026-11-07: phones and tablets get their own layout (html.mob, see the end of arcade.css). It goes by the device,
// not the window width, so desktops stay exactly as they were. ?mob=phone, ?mob=tab or ?mob=off forces one (tests).
(function () {
  var u = navigator.userAgent || '', c = document.documentElement.classList, f = '';
  try { f = (/[?&]mob=(phone|tab|off)/.exec(location.search) || [])[1] || sessionStorage.getItem('arcade-mob') || ''; if (f) sessionStorage.setItem('arcade-mob', f); } catch (e) {}
  var ipad = /iPad/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var phone = /iPhone|iPod|Windows Phone|BlackBerry|webOS|Android.+Mobile|Mobile.+Firefox/.test(u);
  var tab = !phone && (ipad || /Android|Tablet|Silk|Kindle|PlayBook/.test(u));
  if (f) { phone = f === 'phone'; tab = f === 'tab'; }
  if (phone || tab) { c.add('mob'); c.add(phone ? 'mob-phone' : 'mob-tab'); }
  var vh = function () { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); };
  vh(); window.addEventListener('resize', vh);
  // older browsers (iOS before 14) don't have replaceChildren, which the home page uses to list the games
  if (window.Element && !Element.prototype.replaceChildren) Element.prototype.replaceChildren = function () { while (this.firstChild) this.removeChild(this.firstChild); for (var i = 0; i < arguments.length; i++) { var n = arguments[i]; this.appendChild(typeof n === 'string' ? document.createTextNode(n) : n); } };
})();
</script>
<title>The Arcade</title>
<meta name="description" content="Free browser games. No downloads, no sign-ups.">
<meta name="theme-color" content="#0a0916">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Arcade">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Arcade">
<meta property="og:title" content="The Arcade">
<meta property="og:description" content="Free browser games. No downloads, no sign-ups.">
<meta property="og:image" content="https://noah-and-lars.github.io/projects/og.png">
<meta property="og:image:width" content="1200">

<body class="player">
<header class="top">
  <a class="back" href="index.html" aria-label="Back to all games">← All games</a>
  <div class="ptitle-wrap">
    <h1 id="title" class="ptitle"></h1>
    <span id="best" class="pbest" hidden></span>
  </div>
  <div class="actions">
    <button id="clip" class="btn ghost" title="Record a clip of your game (F8)">🎬 Clip</button>
    <a id="next" class="btn ghost">Next game →</a>
    <button id="fs" class="btn">Fullscreen</button>
  </div>
</header>

<main class="stage-wrap">
  <div id="stage" class="stage">
    <iframe id="frame" title="Game" allowfullscreen allow="microphone; gamepad; fullscreen"></iframe>
    <div id="loading" class="loading">
      <img id="loadArt" alt="">
      <div class="loading-box">
        <p id="loadText">Loading…</p>
        <div class="loading-bar"><i></i></div>
      </div>
    </div>
  </div>
  <script src="intro.js?v=3"></script>

  <section class="howto">
    <h2 class="sec-h">How to play</h2>
    <ul id="keys" class="keys"></ul>
    <p class="hint">Click the game if the keys don't respond. <a id="newtab" target="_blank" rel="noopener">Open in its own tab</a></p>
  </section>

  <h2 class="sec-h more-h">More games</h2>
  <section id="more" class="grid small"></section>
</main>

<script src="games.js?v=194"></script>
<script src="account.js?v=17"></script>
<script src="call.js?v=6"></script>
<script src="clips.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('game');
const index = GAMES.findIndex(g => g.id === id);
const game = GAMES[index];

if (!game) {
  location.replace('index.html');
} else {
  Arcade.markPlayed(game.id);
  // Count this player as on this game; the game in the frame reads the count through window.ArcadeOnline
  ArcadeOnline.start(game.id);
  document.title = game.title + " · The Arcade";
  $('title').textContent = game.title;

  // Your best, kept up to date while you play (the game saves it from inside the frame)
  const showBest = () => {
    const s = Arcade.stat(game);
    $('best').hidden = !s;
    if (s) $('best').textContent = s;
  };
  showBest();
  addEventListener('storage', showBest);

  // Loading screen until the game is ready, then hand it the keyboard
  const frame = $('frame');
  $('loadArt').src = game.thumb;
  $('loadText').textContent = 'Loading ' + game.title + '…';
  frame.addEventListener('load', () => {
    $('loading').classList.add('done');
    try { frame.contentWindow.focus(); } catch (e) {}
    if (window.ArcadeIntro) ArcadeIntro.done.then(() => { try { frame.contentWindow.focus(); } catch (e) {} }); // after the intro has gone
  });
  // with an account, the game waits (a few seconds at most) for its progress to arrive from the cloud first
  const start = () => { if (!frame.src) (window.ArcadeIntro ? ArcadeIntro.load : Promise.resolve()).then(() => { if (!frame.src) frame.src = game.path; }); }; // after the intro (intro.js)
  if (window.ArcadeAccount) {
    ArcadeAccount.ready().then(start);
    ArcadeAccount.onPulled(g => { if (g.includes(game.id) && frame.src) try { frame.contentWindow.location.reload(); } catch (e) { frame.src = game.path; } });
  } else start();
  // 🎬 Clip: record the game and post it to Social (clips.js)
  if (window.ArcadeClips) ArcadeClips.attach(frame, game, $('clip')); else $('clip').hidden = true;
  $('newtab').href = game.path;

  const next = GAMES[(index + 1) % GAMES.length];
  $('next').href = 'play.html?game=' + encodeURIComponent(next.id);
  $('next').title = 'Play ' + next.title;

  for (const [k, what] of game.keys || []) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="kbds"></span><span></span>';
    for (const part of k.split(' / ')) {
      const kbd = document.createElement('kbd');
      kbd.textContent = part;
      li.firstChild.append(kbd);
    }
    li.lastChild.textContent = what;
    $('keys').appendChild(li);
  }

  const stage = $('stage');
  $('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
  };

  for (const g of GAMES.filter(g => g.id !== id)) {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = 'play.html?game=' + encodeURIComponent(g.id);
    a.innerHTML = '<div class="thumb"><img alt="" loading="lazy"></div><div class="info"><h2></h2><p class="desc"></p></div>';
    a.querySelector('img').src = g.thumb;
    a.querySelector('h2').textContent = g.title;
    a.querySelector('.desc').textContent = Arcade.stat(g) || g.tagline;
    $('more').appendChild(a);
  }
}
</script>
<script src="tos.js?v=9"></script>
</body>
</html>
