function grid(w,h){const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill(null));return g}

function groundTile(B,top,seed){const r=mulberry(seed*31+7),g=grid(16,16),d=B.dirt;

  if(B.crack&&seed%2===0)for(let k=0;k<1;k++){let cx=r()*16|0,cy=(top?7:0)+(r()*7|0);for(let i=0;i<5;i++){px(g,cx,cy,B.crack);cx+=r()<.5?1:0;cy++}}

const fadePats=[];for(let k=0;k<=16;k++){const c=mk(4,4),g=c.getContext('2d');g.fillStyle='#0d0b16';for(let i=0;i<16;i++)if(BAYER[i]<k)g.fillRect(i%4,i>>2,1,1);fadePats.push(ctx.createPattern(c,'repeat'))}

// ============================================================ level generation
const SOLID=new Uint8Array(16);[1,2,3,4,5,7,9,10].forEach(i=>SOLID[i]=1);
function genLevel(wi,li){
  const B=BIOMES[wi],rng=mulberry(4242+wi*977+li*131),ri=n=>Math.floor(rng()*n);
  const boss=li===3,diff=Math.min(1,(wi*4+li)/17),len=boss?120+Math.min(wi,8)*10:170+Math.min(wi,8)*12+li*10;
  const cols=[],cont=[],spawns=[],deco=[],plats=[];
  const set=(x,y,t)=>{if(x<0||y<0||y>=R)return;while(cols.length<=x)cols.push(new Uint8Array(R));cols[x][y]=t};
  let x=0,gy=12,lastPow=-99,pows=0,cpDone=false,last='',arena=null,goal=null;
  const col=(cx,top,tt)=>{for(let y=Math.max(0,top);y<R;y++)set(cx,y,(y===top&&tt)?tt:1)};
  const pit=cx=>{set(cx,R-1,0);if(B.lava){set(cx,12,8);set(cx,13,8)}};
  const en=(type,tx,ty)=>{if(tx>=18)spawns.push({type,tx,ty})};
  const pick=()=>B.pool[ri(Math.min(B.pool.length,2+li+wi))];
  const flat=(n,ice,nodeco)=>{for(let i=0;i<n;i++){col(x+i,gy,ice?10:0);if(!nodeco&&rng()<.3)deco.push({x:x+i,y:gy,k:ri(1000)})}x+=n};
  const cn=()=>{if(x-lastPow>38||(!pows&&x>16)){lastPow=x;pows++;return'pow'}const r=rng();if(r<.05)return'life';if(r<.12){lastPow=x;return'pow'}return'coin'};
  const segs={
    flat(){const n=4+ri(5),sx=x;flat(n,B.ice&&rng()<.45);if(rng()<.45+diff*.35)en(pick(),sx+1+ri(n-1),gy-1);if(rng()<.3)for(let i=1;i<Math.min(n,5);i++)set(sx+i,gy-3,11)},
    gap(){let n=Math.min(5,2+ri(diff>.45?4:3));for(let i=0;i<n;i++)pit(x+i);if(B.lava&&n>=3)spawns.push({type:'ember',tx:x+(n>>1),ty:12});
      if(n>=3&&rng()<.55)for(let i=0;i<n;i++)set(x+i,gy-3-Math.round(Math.sin((i+.5)/n*Math.PI)*2),11);
      x+=n;if(n<5&&rng()<.35)gy=clamp(gy-1,8,12);else if(rng()<.3)gy=clamp(gy+1,8,12);flat(2)},
    step(){gy=clamp(gy+(rng()<.5?-1:1)*(1+ri(2)),8,12);flat(3+ri(3))},
    blocks(){const n=7+ri(5),sx=x;flat(n);const by=gy-4,bl=3+ri(3),bx=sx+1+ri(Math.max(1,n-bl-1));
      for(let i=0;i<bl;i++){const q=rng()<.45;set(bx+i,by,q?3:2);if(q)cont.push([bx+i,by,cn()]);else if(rng()<.1)cont.push([bx+i,by,'multi'])}
      if(rng()<.4&&by-4>=1){const ux=bx+ri(bl);set(ux,by-4,3);cont.push([ux,by-4,cn()])}
      if(rng()<.6)en(pick(),sx+ri(n),gy-1)},
    stairs(){const h=3+ri(diff>.4?2:1);for(let i=0;i<h;i++){col(x+i,gy);for(let k=1;k<=i+1;k++)set(x+i,gy-k,5)}x+=h;
      if(rng()<.55){const g=2+ri(2);for(let i=0;i<g;i++)pit(x+i);x+=g}else{col(x,gy);for(let k=1;k<=h;k++)set(x,gy-k,5);x++}
      for(let i=0;i<h;i++){col(x+i,gy);for(let k=1;k<=h-i;k++)set(x+i,gy-k,5)}x+=h;flat(2)},
    pillars(){const c=2+ri(2);let top=gy;for(let j=0;j<c;j++){const g=2+ri(2);for(let i=0;i<g;i++)pit(x+i);x+=g;top=clamp(top+ri(3)-1,8,12);const pw=2+ri(2);for(let i=0;i<pw;i++)col(x+i,top);if(rng()<.35)set(x,top-2,11);x+=pw}
      for(let i=0;i<2;i++)pit(x+i);x+=2;gy=top;flat(2)},
    plats(){const n=7+ri(4),sx=x;for(let i=0;i<n;i++)pit(x+i);
      if((wi===0&&li<2)||rng()<.35){const h1=gy-2-ri(2);for(let i=0;i<3;i++)set(sx+Math.floor(n/2)-1+i,h1,6);for(let i=0;i<n;i+=2)if(rng()<.5)set(sx+i,h1-2,11)}
      else plats.push({kind:'h',x0:sx*T,x1:(sx+n-3)*T,y:gy*T});
      x+=n;flat(2)},
    lift(){const sx=x;for(let i=0;i<3;i++)pit(x+i);plats.push({kind:'v',x:sx*T,y0:gy*T,y1:(gy-5)*T});x+=3;gy=Math.max(7,gy-4);flat(3)},
    coins(){const n=6+ri(4),sx=x;flat(n);for(let i=1;i<n-1;i++)set(sx+i,gy-2-(i%2),11)},
    spikes(){const n=8+ri(3),sx=x;flat(n,0,1);const sp=2+ri(2),s0=sx+2+ri(Math.max(1,n-sp-3));for(let i=0;i<sp;i++)set(s0+i,gy-1,7);for(let i=0;i<sp;i++)set(s0+i,gy-4,11)},
    spring(){const sx=x;flat(3);set(sx+1,gy-1,9);const wallTop=Math.max(1,gy-6);for(let i=0;i<3;i++){col(x+i,wallTop);set(x+i,wallTop-2,11)}x+=3;flat(2)},
    icicles(){const n=8+ri(3),sx=x;flat(n);const by=gy-5;for(let i=1;i<n-1;i++){set(sx+i,by,5);if(rng()<.4)set(sx+i,by-1,11)}for(let i=2;i<n-2;i+=2+ri(2))spawns.push({type:'icicle',tx:sx+i,ty:by+1})},
    turret(){const n=6+ri(3),sx=x;flat(n);const tx=sx+2+ri(n-4);set(tx,gy-1,5);en('shooter',tx,gy-2)}};
  const pickSeg=()=>{const ks=Object.keys(B.segs).filter(k=>k!==last);let tot=0;for(const k of ks)tot+=B.segs[k];let r=rng()*tot;for(const k of ks){r-=B.segs[k];if(r<=0)return k}return'flat'};
  flat(14);
  while(x<len){if(!cpDone&&x>len*.45){cpDone=true;flat(1);spawns.push({type:'cp',tx:x,ty:gy-1});flat(4);last='flat';continue}const k=pickSeg();last=k;segs[k]()}
  if(!boss){flat(5);for(let i=0;i<4;i++){col(x+i,gy);for(let k=1;k<=i+1;k++)set(x+i,gy-k,5)}x+=4;goal={tx:x+9,ty:gy-1};flat(16)}
  else{flat(6);gy=12;const ax=x;flat(18,0,1);for(let i=0;i<3;i++){set(ax+3+i,8,6);set(ax+12+i,8,6)}for(let i=0;i<6;i++)for(let y=0;y<R;y++)set(x+i,y,5);x+=6;arena={x0:ax}}
  const w=cols.length,map=new Uint8Array(w*R);for(let cx=0;cx<w;cx++)for(let y=0;y<R;y++)map[y*w+cx]=cols[cx][y];
  const contents=new Map();for(const [cx,cy,c] of cont)contents.set(cy*w+cx,c);
  return{wi,li,B,w,map,contents,spawns,deco,platDefs:plats,arena,goalDef:goal}}

// ============================================================ world/physics helpers
let L=null,P=null;const cam={x:0};
function tAt(tx,ty){if(ty<0||ty>=R)return 0;if(tx<0||tx>=L.w)return 5;return L.map[ty*L.w+tx]}
function setT(tx,ty,t){if(tx>=0&&tx<L.w&&ty>=0&&ty<R)L.map[ty*L.w+tx]=t}
function moveX(e,dx){if(!dx)return 0;e.x+=dx;const t0=Math.floor(e.y/T),t1=Math.floor((e.y+e.h-.01)/T);
  if(dx>0){const tx=Math.floor((e.x+e.w-.01)/T);for(let ty=t0;ty<=t1;ty++){const t=tAt(tx,ty);if(SOLID[t]){e.x=tx*T-e.w;return t}}}
  else{const tx=Math.floor(e.x/T);for(let ty=t0;ty<=t1;ty++){const t=tAt(tx,ty);if(SOLID[t]){e.x=(tx+1)*T;return t}}}return 0}
function moveY(e,dy){if(!dy)return null;const pb=e.y+e.h;e.y+=dy;const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-.01)/T);
  if(dy>0){const ty=Math.floor((e.y+e.h-.01)/T);for(let tx=l;tx<=r;tx++){const t=tAt(tx,ty);if(SOLID[t]||(t===6&&pb<=ty*T+.5)){e.y=ty*T-e.h;return{d:1,t,tx,ty}}}}
  else{const ty=Math.floor(e.y/T),cx=e.x+e.w/2;let best=null,bd=99;for(let tx=l;tx<=r;tx++){const t=tAt(tx,ty);if(SOLID[t]){const d=Math.abs(tx*T+8-cx);if(d<bd){bd=d;best={d:-1,t,tx,ty}}}}if(best){e.y=(ty+1)*T;return best}}return null}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const EDEF={blob:{w:12,h:11,sp:.45},beetle:{w:14,h:10,sp:.55,smart:1},spiky:{w:12,h:11,sp:.35,smart:1},bat:{w:12,h:8},hopper:{w:12,h:10},shooter:{w:12,h:14},ember:{w:10,h:10},icicle:{w:8,h:14}};
const STOMP={blob:1,beetle:1,bat:1,hopper:1,shooter:1,shell:1};
function makeEnemy(type,tx,ty){const d=EDEF[type];const e={type,w:d.w,h:d.h,x:tx*T+(T-d.w)/2,y:(ty+1)*T-d.h,vx:0,vy:0,dir:-1,t:0,sp:d.sp||0,smart:d.smart,active:false};
  if(type==='bat'){e.y=(ty-3)*T;e.y0=e.y}
  if(type==='ember'){e.y0=ty*T+2;e.y=e.y0+30;e.wait=40+(Math.random()*90|0);e.hidden=true}
  if(type==='icicle'){e.y=ty*T;e.x=tx*T+4}
  if(type==='hopper')e.wait=60;
  return e}
function buildEntities(){L.enemies=[];L.items=[];L.shots=[];L.fires=[];L.parts=[];L.pops=[];L.bumps=[];L.multi={};L.t=0;L.shake=0;L.bossOn=false;L.banner=0;
  for(const s of L.spawns){if(s.type==='cp'){L.cp={x:s.tx*T+2,y:(s.ty+1)*T-32,w:10,h:32,on:false};continue}
    if(L.custom){const e=makeEnemy(s.type,s.tx,s.ty);if(s.type==='bat'){e.y=e.y0=s.ty*T+4}L.enemies.push(e);continue}
    if(s.type==='ember'||s.type==='icicle'||s.type==='bat'){L.enemies.push(makeEnemy(s.type,s.tx,s.ty));continue}
    const a=tAt(s.tx,s.ty),b=tAt(s.tx,s.ty+1);if(a===0&&(b===1||b===5||b===10))L.enemies.push(makeEnemy(s.type,s.tx,s.ty))}
  L.enemies.forEach((e,i)=>e.id=i);
  L.goal=L.goalDef?{x:L.goalDef.tx*T,y:(L.goalDef.ty+1)*T-28,w:16,h:28,vy:0}:null;
  L.plats=L.platDefs.map(p=>p.kind==='h'?{kind:'h',x:p.x0,y:p.y,x0:p.x0,x1:p.x1,w:48,h:6,dir:1,dx:0,dy:0,wait:0}:{kind:'v',x:p.x,y:p.y0,y0:p.y0,y1:p.y1,w:48,h:6,dir:-1,dx:0,dy:0,wait:40});
  L.deco=L.deco.filter(d=>{const a=tAt(d.x,d.y),b=tAt(d.x,d.y-1);return(a===1||a===10)&&b===0})}
function addScore(n,x,y){G.score+=n;if(x!=null)L.pops.push({x,y,s:String(n),t:40})}
function addGem(x,y){G.gems++;G.score+=50;SFX.coin();if(G.gems>=100){G.gems-=100;G.lives++;SFX.life();if(x!=null)L.pops.push({x,y:y-8,s:'1UP',t:50})}}
function burst(x,y,n,cols,sp=2,grav=.15,life=30){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*sp;L.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,g:grav,t:life+(Math.random()*10|0),c:cols[i%cols.length],s:Math.random()<.4?2:1})}}

function newPlayer(){return{x:0,y:0,w:12,h:14,vx:0,vy:0,face:1,onGround:false,inv:0,anim:0,dead:false,deadT:0,growT:0,growFrom:0,jbuf:0,coyote:0,chain:0,spring:false,onPlat:null,power:0,gtile:0,pit:false,throwT:0}}
function setPower(p,anim){const oh=P.h,from=P.power?1:0;P.power=p;P.h=p?22:14;P.y+=oh-P.h;if(anim){P.growT=36;P.growFrom=from}}
function startLevel(fromCp){
  const cust=G.mode==='test'||G.mode==='course';
  L=cust?courseLevel(G.course.C):genLevel(G.wi,G.li);SP(L.wi);buildEntities();
  if(!fromCp)G.cp=null;
  P=newPlayer();setPower(G.power,false);
  if(G.cp!=null&&L.cp){L.cp.on=true;P.x=G.cp;P.y=L.cp.y+32-P.h}
  else if(L.start){P.x=L.start[0]*T+2;P.y=(L.start[1]+1)*T-P.h}
  else{P.x=3*T;const tx=Math.floor((P.x+6)/T);let ty=R-1;while(ty>0&&SOLID[tAt(tx,ty-1)])ty--;P.y=ty*T-P.h}
  cam.x=clamp(P.x-W*.3,0,Math.max(0,L.w*T-W));G.time=300;stT=0;
  if(cust){state='play';playMusic(L.wi)}else{state='intro';if(G.mode!=='coop')stopMusic()}}
function hurt(){if(P.inv>0||P.dead||state!=='play')return;if(P.power>0){setPower(P.power-1,true);P.inv=120;SFX.hurt()}else die()}
function die(pit){if(P.dead)return;P.dead=true;P.deadT=0;P.vy=pit?0:-5.5;P.pit=!!pit;P.power=0;G.power=0;if(G.mode!=='coop')stopMusic();SFX.die()}
function afterDeath(){if(G.mode==='test'||G.mode==='course'){G.power=0;G.runT+=L.t;go(()=>startLevel(G.cp!=null));return}G.lives--;G.power=0;if(G.lives<0){G.lives=0;state='gameover';stT=0;stopMusic()}else{writeSave();go(()=>startLevel(true))}}

// ============================================================ blocks & items
function bumpBlock(tx,ty,rp){const remote=rp!==undefined,pw=remote?rp:P.power,i=ty*L.w+tx,t=L.map[i];
  if(!remote&&inCoop()&&(t===2||t===3))netSend('bk',{tx,ty,pw});
  if(t===3||(t===2&&L.contents.has(i))){const c=L.contents.get(i)||'coin';
    if(c==='multi'){L.multi[i]=(L.multi[i]||0)+1;popGem(tx,ty,remote);if(L.multi[i]>=6){L.map[i]=4;L.contents.delete(i)}}
    else{L.map[i]=4;L.contents.delete(i);if(c==='coin')popGem(tx,ty,remote);else if(c==='pow'){spawnItem(pw===0?'berry':'fruit',tx,ty);SFX.sprout()}else if(c==='life'){spawnItem('life',tx,ty);SFX.sprout()}}
    L.bumps.push({tx,ty,t:8});bumpKill(tx,ty,remote)}
  else if(t===2){if(pw>0){L.map[i]=0;SFX.brk();if(!remote)addScore(50);for(let k=0;k<4;k++)L.parts.push({x:tx*T+4+(k&1)*8,y:ty*T+4+(k>>1)*8,vx:(k&1?1.4:-1.4),vy:-4.5+(k>>1)*1.5,g:.3,t:60,c:L.B.brick[k%2],s:4,deb:1});bumpKill(tx,ty,remote)}else{L.bumps.push({tx,ty,t:8});SFX.bump();bumpKill(tx,ty,remote)}}
  else SFX.bump()}
function popGem(tx,ty,remote){L.parts.push({x:tx*T+4,y:ty*T-12,vx:0,vy:-4,g:.3,t:24,gem:1,s:0});if(remote)return;addGem(tx*T+8,ty*T);L.pops.push({x:tx*T+8,y:ty*T-16,s:'50',t:30})}
function bumpKill(tx,ty,remote){for(const e of L.enemies){if(!e.active||e.dead||e.type==='boss'||e.type==='ember'||e.type==='icicle')continue;if(Math.abs(e.y+e.h-ty*T)<3&&e.x+e.w>tx*T&&e.x<tx*T+T)killEnemy(e,P.face)}
  if(tAt(tx,ty-1)===11){setT(tx,ty-1,0);popGem(tx,ty-1,remote)}
  for(const it of L.items)if(Math.abs(it.y+it.h-ty*T)<3&&it.x+it.w>tx*T&&it.x<tx*T+T){it.vy=-4;it.vx=Math.abs(it.vx||1)*(it.x+6<tx*T+8?-1:1)}}
function spawnItem(type,tx,ty){L.items.push({type,x:tx*T+2,y:ty*T+2,w:12,h:12,vx:0,vy:0,emerge:28,tx,ty})}
function killEnemy(e,dir){if(e.dead)return;if(inCoop()&&e.id!=null&&e.type!=='boss')netSend('k',{i:e.id});e.dead=true;e.vy=-3.5;e.vx=(dir||1)*1.2;SFX.kick();addScore(200,e.x+e.w/2,e.y)}
function stompEnemy(e){P.chain++;const pts=[100,200,400,800,1000,2000,4000,8000][Math.min(P.chain-1,7)];
  if(P.chain>8){G.lives++;SFX.life();L.pops.push({x:e.x+6,y:e.y,s:'1UP',t:50})}else addScore(pts,e.x+e.w/2,e.y);
  SFX.stomp();
  if(e.type==='beetle'){if(inCoop())netSend('sh',{i:e.id});e.type='shell';e.h=10;e.kick=0;e.wake=420;return}
  if(inCoop()&&e.type!=='shell')netSend('k',{i:e.id});
  if(e.type==='shell'){if(e.kick){e.kick=0;e.wake=420}else{e.kick=(P.x+P.w/2<e.x+e.w/2)?1:-1;e.grace=10}return}
  if(e.type==='blob'){e.squash=30;return}
  e.remove=true;burst(e.x+e.w/2,e.y+e.h/2,10,['#ffffff',L.B.e[e.type]?L.B.e[e.type][0]:'#ffffff'],1.8,.05,18)}

// ============================================================ boss
function makeBoss(ax){return{type:'boss',w:28,h:28,x:(ax+13)*T,y:12*T-28,vx:0,vy:0,dir:-1,t:0,hp:12,inv:0,st:'intro',stT:0,active:true,onGround:false}}
function shotAt(x,y,vx,vy,g,r){L.shots.push({x:x-r,y:y-r,w:r*2,h:r*2,vx,vy,g,t:0})}
function updBoss(e){const wi=L.wi;e.t++;e.stT++;if(e.inv>0)e.inv--;
  if(e.dead){e.vy+=.25;e.y+=e.vy;e.x+=e.vx;if(e.t%6===0)burst(e.x+14,e.y+14,6,['#ffd23f','#ff7a1e','#ffffff'],2.5,.05,20);if(e.y>LH+60&&!L.goal){L.goal={x:(L.arena.x0+8)*T,y:-40,w:16,h:28,vy:0,fall:1};e.remove=true}return}
  e.vy=Math.min(e.vy+.35,7);const px=P.x+P.w/2,ex=e.x+e.w/2,face=px<ex?-1:1,rage=(12-e.hp)/12,sp=.6+Math.min(wi,6)*.12+rage*.5;
  if(e.st==='intro'){e.vx=0;if(e.stT>70){e.st='walk';e.stT=0}}
  else if(e.st==='walk'){e.dir=face;e.vx=sp*e.dir;if(e.stT>70+(e.t*13%60)){const r=((e.t*7919)%100)/100;e.stT=0;if(r<.45){e.st='jump';e.vy=-6.2-rage*1.2;e.vx=face*(1.4+rage);e.onGround=false}else if(r<.8)e.st='shoot'}}
  else if(e.st==='jump'){if(e.onGround&&e.stT>5){e.st='walk';e.stT=0;e.vx=0;L.shake=14;SFX.thud();burst(ex,e.y+e.h,12,['#ffffff',L.B.dirt[1]],2,.1,20);
      if(wi===2||wi===4)for(let i=0;i<2+(rage>.5?1:0);i++)shotAt(cam.x+30+Math.random()*(W-60),-10,0,1,.12,4);
      if(wi===0&&L.enemies.filter(q=>q.type==='blob'&&!q.dead).length<2){const b=makeEnemy('blob',Math.floor(ex/T),11);b.active=true;b.dir=face;b.y=e.y;L.enemies.push(b)}}}
  else if(e.st==='shoot'){e.vx=0;if(e.stT===30){SFX.shot();const n=wi===3?5:wi===4?5:3;for(let i=0;i<n;i++){if(wi===3)shotAt(ex,e.y+4,face*(.4+i*.35),-2.2-i*.2,.05,4);else shotAt(ex,e.y+8,face*(1+i*.75),-3.6-i*.35,.16,4)}}if(e.stT>56){e.st='walk';e.stT=0}}

function ambient(wi,cx){const A=BIOMES[wi].amb,m=A.m;if(ambW!==wi){amb.length=0;ambW=wi}

  for(const a of amb){a.p+=.03;
    if(m==='drift'){a.x-=.3+a.s*.3;a.y+=Math.sin(a.p)*.4+.15}else if(m==='streak'){a.x-=1.5+a.s*2;a.y+=Math.sin(a.p*2)*.2}else if(m==='fall'){a.y+=.35+a.s*.5;a.x+=Math.sin(a.p)*.3-.2}
    else if(m==='float'){a.x+=Math.sin(a.p)*.3;a.y+=Math.cos(a.p*.7)*.25}else if(m==='rise'||!a.ash){a.y-=.5+a.s*.6;a.x+=Math.sin(a.p)*.3}else{a.y+=.3;a.x-=.2}

    const xx=((Math.round(a.x-cx*(.2+a.s*.3))%W)+W)%W,big=(m==='fall'||m==='drift')&&a.s>.6?2:1;ctx.fillStyle=a.c;ctx.fillRect(xx,Math.round(a.y),m==='streak'?3:big,big)}}

  <h3>OPEN ROOMS</h3><div id="rooms" class="lst"><p class="sm">Looking for rooms...</p></div><button class="bt alt" data-a="hub">BACK</button>`);
  lobCh().then(drawRooms,()=>{const el=document.getElementById('rooms');if(el)el.innerHTML='<p class="sm">'+errMsg('offline')+'</p>'})};
ACT.mkroom=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<5;i++)c+=A[Math.random()*A.length|0];roomOpen(c,true)};
ACT.joinc=()=>{const c=(document.getElementById('jc').value||'').toUpperCase().replace(/[^A-Z]/g,'');if(c.length===5)roomOpen(c,false);else document.getElementById('jc').value=''};
ACT.joinr=v=>roomOpen(v,false);
ACT.rleave=()=>{roomLeave();ACT.coop()};
ACT.rl=v=>{NET.lvl=clamp(NET.lvl+(+v),0,Math.min(save.u,NL-1));netTrack();roomPanel()};
ACT.rstart=()=>{if(!NET.host)return;const run=Math.random().toString(36).slice(2,8);netSend('go',{l:NET.lvl,run});netStart(NET.lvl,run)};
function roomOpen(code,create){const a=acct();if(!a){ui('<h2>CO-OP</h2>'+noAcct+'<button class="bt alt" data-a="coop">BACK</button>');return}
  ui('<h2>CONNECTING...</h2>');roomLeave(true);
  rtc().then(cl=>{const ch=cl.channel('sprout-room-'+code,{config:{broadcast:{self:false},presence:{key:a.name}}});
    Object.assign(NET,{ch,code,me:a.name,t:Date.now(),host:!!create,people:[],st:'lobby',run:'',rem:{},lvl:Math.min(save.u,NL-1),wipeT:0});
    ch.on('presence',{event:'sync'},roomSync);ch.on('broadcast',{event:'*'},m=>{try{netMsg(m.event,m.payload||{})}catch(e){console.error(e)}});
    let ok=false;ch.subscribe(s=>{if(s==='SUBSCRIBED'&&!ok){ok=true;netTrack();roomPanel()}else if(s==='CHANNEL_ERROR'&&!ok){ok=true;roomLeave(true);ui('<h2>COULD NOT CONNECT</h2><p class="sm">'+errMsg('offline')+'</p><button class="bt alt" data-a="coop">BACK</button>')}})
  },()=>ui('<h2>OFFLINE</h2><p class="sm">'+errMsg('offline')+'</p><button class="bt alt" data-a="coop">BACK</button>'))}
function roomLeave(quiet){if(NET.ch){try{NET.ch.untrack()}catch(e){}try{rtClient.removeChannel(NET.ch)}catch(e){}}NET.ch=null;NET.people=[];NET.rem={};NET.run='';NET.host=false;NET.panel=0;
  if(NET.lob&&NET.listed){try{NET.lob.untrack()}catch(e){}NET.listed=''}if(G.mode==='coop')G.mode='story'}
function roomSync(){if(!NET.ch)return;const st=NET.ch.presenceState(),ps=[];for(const k in st){const m=st[k]&&st[k][0];if(m&&m.n)ps.push(m)}ps.sort((a,b)=>a.t-b.t);NET.people=ps;
  const me=ps.findIndex(p=>p.n===NET.me);
  if(ps.length>6&&me>=6){roomLeave(true);ui('<h2>ROOM FULL</h2><p class="sm">That room already has 6 players.</p><button class="bt alt" data-a="coop">BACK</button>');return}
  const host=ps.find(p=>p.host)||ps[0];if(host&&host.n===NET.me&&!NET.host){NET.host=true;netTrack()}
  if(host&&!NET.host)NET.lvl=host.l|0;
  if(host&&!NET.host&&host.st==='play'&&host.r&&NET.run!==host.r)netStart(host.l,host.r);
  for(const n in NET.rem)if(!ps.find(p=>p.n===n))delete NET.rem[n];
  lobbyList();if(NET.panel)roomPanel()}
function roomPanel(){NET.panel=1;const host=NET.host,lv=NET.lvl;
  UI.innerHTML='<div class="pn">'+`<h2>ROOM ${esc(NET.code)}</h2><p class="sm">SHARE THE CODE. UP TO 6 PLAYERS.</p><div class="lst">${NET.people.map((p,i)=>`<div class="it"><span class="dot" style="background:${PCOLS[i%6][0]}"></span>${esc(p.n)}${p.host?' ★':''}${p.n===NET.me?' (YOU)':''}${p.st==='play'?' · PLAYING':''}</div>`).join('')||'<p class="sm">...</p>'}</div>
  <h3>LEVEL</h3><div class="row lvl">${host?'<button class="bt sm" data-a="rl" data-v="-1">&lt;</button>':''}<span>${(lv>>2)+1}-${(lv&3)+1} ${esc(BIOMES[lv>>2].levels[lv&3])}</span>${host?'<button class="bt sm" data-a="rl" data-v="1">&gt;</button>':''}</div>
  ${host?'<button class="bt" data-a="rstart">START</button>':'<p class="sm">WAITING FOR THE HOST TO START...</p>'}<button class="bt red" data-a="rleave">LEAVE ROOM</button>`+'</div>';UI.classList.add('on');uiOpen=true}
function lobCh(){if(NET.lobP)return NET.lobP;NET.lobP=rtc().then(cl=>new Promise((res,rej)=>{const ch=cl.channel('sprout-lobbies',{config:{presence:{key:(acct()||{}).name||('guest'+(Math.random()*1e6|0))}}});NET.lob=ch;let ok=0;
  ch.on('presence',{event:'sync'},drawRooms);ch.subscribe(s=>{if(s==='SUBSCRIBED'&&!ok){ok=1;res(ch)}else if(s==='CHANNEL_ERROR'&&!ok){ok=1;NET.lobP=null;rej('offline')}})}));return NET.lobP}
function lobbyList(){if(!NET.ch||!NET.host){if(NET.lob&&NET.listed){try{NET.lob.untrack()}catch(e){}NET.listed=''}return}
  const meta={c:NET.code,h:NET.me,n:Math.max(1,NET.people.length),st:NET.st,l:NET.lvl},k=JSON.stringify(meta);if(k===NET.listed)return;NET.listed=k;lobCh().then(ch=>{try{ch.track(meta)}catch(e){}},()=>{})}
function drawRooms(){const el=document.getElementById('rooms');if(!el||!NET.lob)return;const st=NET.lob.presenceState(),rs=[];for(const k in st){const m=st[k]&&st[k][0];if(m&&m.c&&m.n<6)rs.push(m)}
  el.innerHTML=rs.length?rs.map(m=>`<button class="bt sm" data-a="joinr" data-v="${esc(m.c)}">${esc(m.h)}'S ROOM · ${m.n}/6 · ${(m.l>>2)+1}-${(m.l&3)+1}${m.st==='play'?' · PLAYING':''}</button>`).join(''):'<p class="sm">NO OPEN ROOMS RIGHT NOW. CREATE ONE!</p>'}
function netStart(l,run,cp){NET.run=run;NET.st='play';NET.lvl=l;NET.rem={};NET.bossHp=12;NET.wipeT=0;NET.ls=0;G.mode='coop';G.wi=l>>2;G.li=l&3;G.cp=cp==null?null:cp;uiClose();netTrack();fade.t=1;fade.cb=()=>startLevel(cp!=null)}
function netMsg(ev,p){
  if(ev==='go'){if(p.run&&p.run!==NET.run)netStart(p.l|0,p.run,p.cp);return}
  if(!L||!p.r||p.r!==NET.run||G.mode!=='coop')return;
  if(ev==='p'){let r=NET.rem[p.n];if(!r)r=NET.rem[p.n]={x:p.x,y:p.y};Object.assign(r,{tx:p.x,ty:p.y,vx:p.vx||0,vy:p.vy||0,f:p.f,pw:p.pw|0,fr:p.fr|0,d:p.d,g:p.g,b:p.b,at:frameN});return}
  const byId=i=>L.enemies.find(q=>q.id===i);
  if(ev==='k'){const e=byId(p.i);if(e&&!e.dead&&!e.remove&&e.type!=='boss'){e.remove=true;burst(e.x+e.w/2,e.y+e.h/2,8,['#ffffff',L.B.e[e.type]?L.B.e[e.type][0]:'#ffffff'],1.6,.05,16)}}
  else if(ev==='sh'){const e=byId(p.i);if(e&&e.type==='beetle'){e.type='shell';e.kick=0;e.wake=420}}
  else if(ev==='bk')bumpBlock(p.tx|0,p.ty|0,p.pw|0);
  else if(ev==='gm'){if(tAt(p.tx,p.ty)===11)setT(p.tx,p.ty,0)}
  else if(ev==='it'){const it=L.items.find(q=>q.tx===p.tx&&q.ty===p.ty);if(it)it.dead=1}
  else if(ev==='cp'){if(L.cp&&!L.cp.on){L.cp.on=true;G.cp=L.cp.x-2}}
  else if(ev==='bh'){NET.bossHp=Math.min(NET.bossHp,p.hp);const b=L.enemies.find(q=>q.type==='boss');if(b&&!b.dead&&b.hp>p.hp){b.hp=p.hp;b.inv=60;if(b.hp<=0)bossDie(b)}}
  else if(ev==='clr')coopClear()}
function coopClear(){if(state!=='play'&&state!=='pause')return;state='clear';stT=0;P.vx=0;stopMusic();SFX.goal();if(L.goal)burst(L.goal.x+8,L.goal.y+8,30,['#8ff7ff','#ffffff','#ffd23f'],3,.06,40)}
function heroFrame(){if(!P.onGround)return 3;if(Math.abs(P.vx)>.2)return[1,0,2,0][Math.floor(P.anim)%4];return 0}
function netTick(){if(!inCoop())return;
  const st={x:Math.round(P.x),y:Math.round(P.y),vx:Math.round(P.vx*10)/10,vy:Math.round(P.vy*10)/10,f:P.face,pw:P.power,fr:heroFrame(),d:P.dead?1:0,g:P.atGoal?1:0,b:P.bubble&&P.inv>0?1:0},key=JSON.stringify(st);
  if((key!==NET.lastKey&&frameN-NET.ls>=7)||frameN-NET.ls>=60){NET.ls=frameN;NET.lastKey=key;netSend('p',st)}
  for(const n in NET.rem){const r=NET.rem[n];if(r.tx==null)continue;const age=Math.min(frameN-r.at,10),gx=r.tx+r.vx*age,gy=r.ty+(r.d?0:r.vy*Math.min(age,4));r.x+=(gx-r.x)*.3;r.y+=(gy-r.y)*.3;if(Math.abs(gx-r.x)>80||Math.abs(gy-r.y)>80){r.x=gx;r.y=gy}}
  if(NET.host&&state==='play'&&NET.people.length){const st2=p=>p.n===NET.me?{d:P.dead,g:P.atGoal}:NET.rem[p.n];
    if(NET.people.every(p=>{const s=st2(p);return s&&s.g})){netSend('clr',{});coopClear();return}
    const alive=NET.people.some(p=>{const s=st2(p);return s&&!s.d&&!s.g});
    if(!alive){if(++NET.wipeT>120){NET.wipeT=0;const run=Math.random().toString(36).slice(2,8);netSend('go',{l:NET.lvl,run,cp:G.cp});netStart(NET.lvl,run,G.cp)}}else NET.wipeT=0}}
function coopRespawn(){let best=null;for(const n in NET.rem){const r=NET.rem[n];if(r.tx!=null&&!r.d&&!r.g&&frameN-r.at<240&&(!best||r.x>best.x))best=r}
  if(!best)return false;P.dead=false;P.gone=false;P.pit=false;P.deadT=0;setPower(0,false);P.x=best.x;P.y=Math.min(best.y-26,LH-60);P.vx=0;P.vy=-2;P.inv=150;P.bubble=true;return true}
function drawRemotes(vt){if(!inCoop())return;NET.people.forEach((p,i)=>{const r=NET.rem[p.n];if(!r||r.tx==null||r.g||p.n===NET.me)return;const ci=i%6,set=heroFor(ci,r.pw===2),img=set[r.pw>0?1:0][r.d?3:(r.fr|0)][r.f>0?'r':'l'];
  const h=r.pw>0?22:14,x=Math.round(r.x)-2-camX,y=Math.round(r.y+h)-img.height-vt+shY;if(x<-30||x>W+30)return;
  if(r.d){ctx.save();ctx.translate(x,y+img.height);ctx.scale(1,-1);ctx.drawImage(img,0,0);ctx.restore()}else if(!(r.b&&(frameN&4)))ctx.drawImage(img,x,y);
  if(r.b){ctx.strokeStyle='rgba(200,240,255,.8)';ctx.beginPath();ctx.arc(x+8,y+img.height/2,img.height/2+5,0,7);ctx.stroke()}
  txt(p.n,x+8,y-8,PCOLS[ci][1],1,1)})}
function drawCoopHUD(){if(!inCoop())return;let y=16;NET.people.forEach((p,i)=>{const s=p.n===NET.me?{d:P.dead,g:P.atGoal}:(NET.rem[p.n]||{});ctx.fillStyle=OL;ctx.fillRect(5,y-1,6,6);ctx.fillStyle=PCOLS[i%6][0];ctx.fillRect(6,y,4,4);
  txt(p.n+(s.g?' - GOAL':s.d?' - DOWN':''),14,y,s.g?'#7affa0':s.d?'#ff8a8a':'#ffffff');y+=8});
  if(P.atGoal||(P.dead&&P.deadT>80)){const n=NET.people.filter(p=>p.n===NET.me?P.atGoal:(NET.rem[p.n]&&NET.rem[p.n].g)).length;txt(P.atGoal?'WAITING FOR YOUR TEAM '+n+'/'+NET.people.length:'WAITING TO RESPAWN...',W/2,H-18,'#ffe066',1,1)}}

// ============================================================ course maker
// Courses: { name, t (world theme), w (columns), map (Uint8Array w*14 of maker tile ids), ents: [[kind, x, y]], s: start, g: goal, verified }.
// Maker tile ids: the game's own tile ids, plus 12 = power block, 13 = 1UP block, 14 = gem brick (several gems). Saved on this
// device in 'sproutling.courses'; uploads send the run-length form { v:1, t, w, m, e, s, g } once the maker has cleared it.
const PAL=[{g:'t',id:1,n:'GROUND'},{g:'t',id:2,n:'BRICK'},{g:'t',id:14,n:'GEM BRICK'},{g:'t',id:3,n:'GEM BLOCK'},{g:'t',id:12,n:'POWER BLOCK'},{g:'t',id:13,n:'1UP BLOCK'},{g:'t',id:4,n:'EMPTY BLOCK'},{g:'t',id:5,n:'STONE'},{g:'t',id:6,n:'LEDGE'},{g:'t',id:10,n:'ICE'},{g:'t',id:9,n:'SPRING'},{g:'t',id:7,n:'SPIKES'},{g:'t',id:8,n:'LAVA'},{g:'t',id:11,n:'GEM'},
  {g:'e',id:'blob',n:'BLOB'},{g:'e',id:'beetle',n:'BEETLE'},{g:'e',id:'spiky',n:'SPIKY'},{g:'e',id:'hopper',n:'HOPPER'},{g:'e',id:'bat',n:'BAT'},{g:'e',id:'shooter',n:'SPITTER'},{g:'e',id:'ember',n:'EMBER'},{g:'e',id:'icicle',n:'ICICLE'},
  {g:'e',id:'plath',n:'MOVING LEDGE'},{g:'e',id:'platv',n:'LIFT'},{g:'e',id:'cp',n:'CHECKPOINT'},{g:'s',id:'start',n:'START'},{g:'s',id:'goal',n:'GOAL'},{g:'x',id:'erase',n:'ERASER'}];
const ENT_OK={blob:1,beetle:1,spiky:1,hopper:1,bat:1,shooter:1,ember:1,icicle:1,plath:1,platv:1,cp:1};
const ED={C:null,tool:PAL[0],camX:0,hx:-1,hy:-1,down:0,slot:-1,L:null,icons:null,last:'',scroll:0,msg:'',msgT:0};
function rle(a){const o=[];let c=a[0],n=0;for(let i=0;i<a.length;i++){if(a[i]===c)n++;else{o.push(c,n);c=a[i];n=1}}o.push(c,n);return o}
function unrle(m,len){const a=new Uint8Array(len);let i=0;for(let k=0;k+1<m.length;k+=2){a.fill(m[k],i,Math.min(len,i+m[k+1]));i+=m[k+1]}return a}
function serial(C){return{v:1,t:C.t,w:C.w,m:rle(C.map),e:C.ents.map(e=>[e[0],e[1],e[2]]),s:C.s.slice(),g:C.g.slice()}}
function deserial(d,name){return{name:name||'',t:clamp(d.t|0,0,NW-1),w:d.w,map:unrle(d.m,d.w*R),ents:(d.e||[]).filter(e=>ENT_OK[e[0]]).map(e=>e.slice(0,3)),s:d.s.slice(),g:d.g.slice(),verified:false}}
function newCourse(){const w=100,map=new Uint8Array(w*R);for(let x=0;x<w;x++){map[12*w+x]=1;map[13*w+x]=1}return{name:'',t:0,w,map,ents:[],s:[2,11],g:[w-5,11],verified:false}}
function courseLevel(C){const B=BIOMES[C.t],w=C.w,map=new Uint8Array(w*R),contents=new Map(),CT={3:'coin',12:'pow',13:'life',14:'multi'},GT={12:3,13:3,14:2};
  for(let i=0;i<w*R;i++){const e=C.map[i];if(!e)continue;map[i]=GT[e]||e;if(CT[e])contents.set(i,CT[e])}
  const spawns=[],platDefs=[];for(const [k,x,y] of C.ents){if(k==='plath')platDefs.push({kind:'h',x0:x*T,x1:Math.max(x+1,Math.min(w-3,x+5))*T,y:y*T});else if(k==='platv')platDefs.push({kind:'v',x:x*T,y0:y*T,y1:Math.max(0,y-5)*T});else spawns.push({type:k,tx:x,ty:y})}
  const deco=[],r=mulberry(w*7+C.t*13);for(let x=0;x<w;x++)for(let y=1;y<R;y++){const t=map[y*w+x];if(t){if((t===1||t===10)&&!map[(y-1)*w+x]&&r()<.22)deco.push({x,y,k:r()*1000|0});break}}
  return{wi:C.t,li:0,B,w,map,contents,spawns,deco,platDefs,arena:null,goalDef:{tx:C.g[0],ty:C.g[1]},start:C.s,custom:true}}
function myCourses(){try{const a=JSON.parse(localStorage.getItem('sproutling.courses')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveCourses(a){try{localStorage.setItem('sproutling.courses',JSON.stringify(a));return true}catch(e){return false}}
function edSave(){const C=ED.C,all=myCourses(),rec=Object.assign(serial(C),{name:C.name,verified:C.verified,at:Date.now()});if(ED.slot>=0&&ED.slot<all.length)all[ED.slot]=rec;else{all.unshift(rec);ED.slot=0}
  if(all.length>40)all.length=40;edMsg(saveCourses(all)?'SAVED':'COULD NOT SAVE')}
ACT.maker=()=>{const all=myCourses();ui(`<h2>COURSE MAKER</h2><p class="sm">Build with blocks and enemies, clear your course with TEST, then upload it to the gallery.</p><button class="bt" data-a="mnew">NEW COURSE</button>
  <div class="lst">${all.map((c,i)=>`<div class="it crs"><span class="chip" style="background:${BIOMES[clamp(c.t|0,0,NW-1)].sky[3]}"></span><span class="nm">${esc(c.name||'UNTITLED')}${c.verified?' ✓':''}<small>${esc(BIOMES[clamp(c.t|0,0,NW-1)].name)} · ${c.w} WIDE</small></span><button class="bt sm" data-a="medit" data-v="${i}">EDIT</button><button class="bt sm red" data-a="mdel" data-v="${i}">X</button></div>`).join('')||'<p class="sm">NO COURSES YET.</p>'}</div>
  <button class="bt alt" data-a="hub">BACK</button>`)};
ACT.mnew=()=>openEditor(newCourse(),-1);
ACT.medit=v=>{const c=myCourses()[+v];if(!c)return;const C=deserial(c,c.name);C.verified=!!c.verified;openEditor(C,+v)};
ACT.mdel=v=>{const all=myCourses(),c=all[+v];if(!c)return;ui(`<h2>DELETE?</h2><p class="sm">Delete "${esc(c.name||'UNTITLED')}" from this device? This can't be undone.</p><div class="row"><button class="bt red" data-a="mdel2" data-v="${v}">DELETE</button><button class="bt alt" data-a="maker">CANCEL</button></div>`)};
ACT.mdel2=v=>{const all=myCourses();all.splice(+v,1);saveCourses(all);ACT.maker()};
const EDBAR=document.getElementById('ed');

  const tile={1:S.t.top[0],2:S.t.brick,3:S.t.mys[0],4:S.t.used,5:S.t.solid,6:S.t.plat,7:S.t.spike,8:S.t.lavaTop[0],9:S.t.spring[0],10:S.t.ice,11:GEMS[0],12:S.t.mys[0],13:S.t.mys[0],14:S.t.brick};
  if(it.g==='t'){g.drawImage(tile[it.id],0,0);if(it.id===12)g.drawImage(BERRY,4,4,8,8);if(it.id===13)g.drawImage(HEART,4,4,8,8);if(it.id===14)g.drawImage(GEMS[0],4,4,8,8)}
  else if(it.g==='e'){const m={blob:S.blob[0].l,beetle:S.beetle[0].l,spiky:S.spiky[0].l,hopper:S.hopper[0].l,bat:S.bat[0].l,shooter:S.shooter[0].l,ember:S.ember[0],icicle:S.icicle,cp:CPON};
    if(it.id==='plath'||it.id==='platv'){g.drawImage(S.t.plat,0,6);g.fillStyle='#ffffff';if(it.id==='plath'){g.fillRect(3,2,10,1);g.fillRect(11,1,1,3);g.fillRect(4,1,1,3)}else{g.fillRect(7,0,2,5);g.fillRect(6,1,4,1)}}
    else{const im=m[it.id];g.drawImage(im,0,0,im.width,im.height,(16-Math.min(16,im.width))>>1,16-Math.min(16,im.height),Math.min(16,im.width),Math.min(16,im.height))}}
  else if(it.id==='start')g.drawImage(HERO[0][0][0].r,0,0);else if(it.id==='goal')g.drawImage(CRYSTAL[0],0,0,16,20,2,0,12,15);
  else{g.fillStyle='#ff4a5a';for(let i=2;i<14;i++){g.fillRect(i,i,2,2);g.fillRect(15-i,i,2,2)}}return c}
function openEditor(C,slot){ED.C=C;ED.slot=slot;ED.camX=0;ED.L=courseLevel(C);ED.tool=ED.tool||PAL[0];uiClose();G.mode='edit';state='edit';edBar();playMusic(C.t)}

  <div class="edr"><button data-e="l">&lt;</button><button data-e="r">&gt;</button><select id="edTheme">${BIOMES.map((b,i)=>`<option value="${i}"${i===C.t?' selected':''}>${i+1}. ${b.name}</option>`).join('')}</select>
  <button data-e="wm">-</button><span id="edW">${C.w}</span><button data-e="wp">+</button><button data-e="test" class="go">&#9654; TEST</button><button data-e="save">SAVE</button><button data-e="up">UPLOAD</button><button data-e="exit">EXIT</button><span id="edTip">${esc(ED.tool.n)}</span></div>`;
  EDBAR.querySelectorAll('.pb').forEach((b,i)=>{const c=ED.icons[i];c.className='ic';b.appendChild(c)});EDBAR.classList.add('on');
  document.getElementById('edTheme').onchange=e=>{C.t=+e.target.value;C.verified=false;ED.L=courseLevel(C);edBar();playMusic(C.t)}}
function edClose(){EDBAR.classList.remove('on');EDBAR.innerHTML=''}
function edMsg(m){ED.msg=m;ED.msgT=150}
function edResize(d){const C=ED.C,nw=clamp(C.w+d,20,300);if(nw===C.w)return;const m=new Uint8Array(nw*R);for(let y=0;y<R;y++)for(let x=0;x<nw;x++)m[y*nw+x]=x<C.w?C.map[y*C.w+x]:(y>=12?1:0);
  C.map=m;C.w=nw;C.ents=C.ents.filter(e=>e[1]<nw);C.s[0]=Math.min(C.s[0],nw-1);C.g[0]=Math.min(C.g[0],nw-1);C.verified=false;ED.L=courseLevel(C);document.getElementById('edW').textContent=nw;ED.camX=clamp(ED.camX,0,Math.max(0,nw*T-W))}
EDBAR.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-e]');if(!b)return;const a=b.dataset.e;if(a==='l'||a==='r'){ED.scroll=a==='l'?-1:1;e.preventDefault()}});
addEventListener('pointerup',()=>{ED.scroll=0});
EDBAR.addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(!b)return;const a=b.dataset.e,C=ED.C;initAudio();
  if(a==='tool'){ED.tool=PAL[+b.dataset.v];EDBAR.querySelectorAll('.pb').forEach((x,i)=>x.classList.toggle('on',PAL[i]===ED.tool));document.getElementById('edTip').textContent=ED.tool.n;SFX.select()}
  else if(a==='wm')edResize(-10);else if(a==='wp')edResize(10);
  else if(a==='test'){edSave();edTest()}
  else if(a==='save'){if(!C.name)edName('save');else edSave()}
  else if(a==='up')edUpload();
  else if(a==='exit'){edSave();edClose();G.mode='story';state='title';stT=0;playMusic(0);ACT.maker()}});
function edName(then){ui(`<h2>NAME YOUR COURSE</h2><div class="row"><input id="cn" maxlength="30" value="${esc(ED.C.name)}" placeholder="COURSE NAME"><button class="bt sm" data-a="cname" data-v="${then}">OK</button></div><button class="bt alt" data-a="close">CANCEL</button>`)}
ACT.cname=v=>{const n=(document.getElementById('cn').value||'').replace(/[^\x20-\x7e]/g,'').replace(/\s+/g,' ').trim().slice(0,30);if(!n)return;ED.C.name=n;uiClose();if(v==='up')edUpload();else edSave()};
function edUpload(){const C=ED.C;
  if(!C.verified){ui('<h2>CLEAR IT FIRST</h2><p class="sm">Press TEST and reach the crystal once. Then you can upload it.</p><button class="bt alt" data-a="close">OK</button>');return}
  if(!acct()){ui('<h2>UPLOAD</h2>'+noAcct+'<button class="bt alt" data-a="close">OK</button>');return}
  if(!C.name){edName('up');return}
  ui(`<h2>UPLOAD</h2><p class="sm">Upload "${esc(C.name)}" to the course gallery? Everyone will be able to play it.</p><button class="bt" data-a="up2">UPLOAD</button><button class="bt alt" data-a="close">CANCEL</button>`)}
ACT.up2=()=>{const C=ED.C;ui('<h2>UPLOADING...</h2>');api('upload',{n:C.name,d:serial(C)},true).then(r=>{edSave();ui(`<h2>UPLOADED!</h2><p class="sm">Your course is in the gallery. Course ID:</p><p class="big">${esc(r.id)}</p><button class="bt alt" data-a="close">OK</button>`)},e=>ui('<h2>UPLOAD FAILED</h2><p class="sm">'+errMsg(e)+'</p><button class="bt alt" data-a="close">OK</button>'))};
function edTest(){G.mode='test';G.course={C:ED.C};G.runT=0;G.power=0;edClose();startLevel(false)}
function edAt(px_,py_,erase){const vt=LH-H,tx=Math.floor((px_+ED.camX)/T),ty=Math.floor((py_+vt)/T),k=tx+','+ty+','+erase+','+PAL.indexOf(ED.tool);if(k===ED.last)return;ED.last=k;edApply(tx,ty,erase)}
function edApply(tx,ty,erase){const C=ED.C,t=ED.tool;if(tx<0||tx>=C.w||ty<0||ty>=R)return;const i=ty*C.w+tx,ei=C.ents.findIndex(e=>e[1]===tx&&e[2]===ty);let ch=false;
  if(erase||t.id==='erase'){if(ei>=0){C.ents.splice(ei,1);ch=true}else if(C.map[i]){C.map[i]=0;ch=true}}
  else if(t.g==='t'){if(C.map[i]!==t.id){C.map[i]=t.id;ch=true}if(ei>=0){C.ents.splice(ei,1);ch=true}}
  else if(t.g==='e'){if(t.id==='cp'){const j=C.ents.findIndex(e=>e[0]==='cp');if(j>=0)C.ents.splice(j,1)}const k=C.ents.findIndex(e=>e[1]===tx&&e[2]===ty);if(k>=0)C.ents.splice(k,1);if(C.ents.length<400){C.ents.push([t.id,tx,ty]);C.map[i]=0;ch=true}}
  else if(t.id==='start'){C.s=[tx,ty];C.map[i]=0;ch=true}else if(t.id==='goal'){C.g=[tx,ty];C.map[i]=0;ch=true}
  if(ch){C.verified=false;ED.L=courseLevel(C);if(t.g==='t'&&!erase)SFX.tick()}}
function canvasXY(cx_,cy_){const r=cv.getBoundingClientRect();return{x:(cx_-r.left)*W/r.width,y:(cy_-r.top)*H/r.height}}
cv.addEventListener('mousedown',e=>{if(state!=='edit'||uiOpen)return;const p=canvasXY(e.clientX,e.clientY);ED.down=e.button===2?2:1;ED.last='';edAt(p.x,p.y,ED.down===2);e.preventDefault()});
addEventListener('mousemove',e=>{if(state!=='edit')return;const p=canvasXY(e.clientX,e.clientY);ED.hx=p.x;ED.hy=p.y;if(ED.down&&!uiOpen)edAt(p.x,p.y,ED.down===2)});
addEventListener('mouseup',()=>{ED.down=0});
cv.addEventListener('contextmenu',e=>{if(state==='edit')e.preventDefault()});
cv.addEventListener('wheel',e=>{if(state==='edit'&&!uiOpen){ED.camX=clamp(ED.camX+(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*.6,0,Math.max(0,ED.C.w*T-W));e.preventDefault()}},{passive:false});
function updEdit(){const sp=inp.run?12:5;if(inp.l||ED.scroll<0)ED.camX-=sp;if(inp.r||ED.scroll>0)ED.camX+=sp;ED.camX=clamp(ED.camX,0,Math.max(0,ED.C.w*T-W));if(ED.msgT>0)ED.msgT--}
function renderEdit(){const C=ED.C,Lv=ED.L,vt=LH-H,cx=Math.round(ED.camX),S=SP(C.t);camX=cx;shY=0;
  drawSky(C.t);drawBG(C.t,cx);drawDeco(Lv,S,vt);drawTiles(Lv,S,vt);
  ctx.fillStyle='rgba(255,255,255,.07)';for(let x=-(cx%T);x<W;x+=T)ctx.fillRect(x,-vt,1,LH);for(let ty=0;ty<=R;ty++)ctx.fillRect(0,ty*T-vt,W,1);
  if(vt<0){ctx.fillStyle='rgba(13,11,22,.35)';ctx.fillRect(0,0,W,-vt)}
  const ex=C.w*T-cx;if(ex<W){ctx.fillStyle='rgba(13,11,22,.55)';ctx.fillRect(ex,0,W-ex,H)}
  for(const [k,x,y] of C.ents){const sx=x*T-cx,sy=y*T-vt;if(sx<-48||sx>W)continue;
    if(k==='plath'){for(let i=0;i<3;i++)ctx.drawImage(S.t.plat,sx+i*16,sy);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(sx+48,sy+2,Math.min(5,C.w-3-x)*16-32,1);continue}
    if(k==='platv'){for(let i=0;i<3;i++)ctx.drawImage(S.t.plat,sx+i*16,sy);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(sx+24,sy-5*16,1,5*16);continue}
    const ic=ED.icons[PAL.findIndex(p=>p.id===k)];if(k==='cp')ctx.drawImage(CPON,sx+2,sy-16);else ctx.drawImage(ic,sx,sy)}
  ctx.drawImage(HERO[0][0][0].r,C.s[0]*T-cx,C.s[1]*T-vt);ctx.drawImage(PEDESTAL,C.g[0]*T-cx-1,C.g[1]*T-vt+8);ctx.drawImage(CRYSTAL[(frameN>>4)%3],C.g[0]*T-cx,C.g[1]*T-vt-12);
  if(ED.hx>=0&&!touchUI()){const tx=Math.floor((ED.hx+cx)/T),ty=Math.floor((ED.hy+vt)/T);if(tx>=0&&tx<C.w&&ty>=0&&ty<R){const sx=tx*T-cx,sy=ty*T-vt;ctx.globalAlpha=.55;const ic=ED.icons[PAL.indexOf(ED.tool)];if(ED.tool.g==='t'||ED.tool.g==='e')ctx.drawImage(ic,sx,sy);ctx.globalAlpha=1;ctx.strokeStyle='#ffffff';ctx.strokeRect(sx+.5,sy+.5,15,15)}}
  const top=Math.max(4,(EDBAR.offsetHeight||0)*H/(cv.getBoundingClientRect().height||H)+4);
  txt((C.name||'UNTITLED')+(C.verified?' - CLEARED':' - NOT CLEARED YET'),6,top,C.verified?'#7affa0':'#ffe9a8');
  txt(touchUI()?'TAP TO PLACE - ERASER TO REMOVE':'CLICK TO PLACE - RIGHT CLICK ERASES - ARROWS SCROLL',6,top+9,'#ffffff');
  if(ED.msgT>0)txt(ED.msg,W/2,top+22,'#ffe066',2,1)}

// ============================================================ course gallery
const GAL={s:'new',q:'',o:0,cur:null};
ACT.gallery=()=>{ui(`<h2>COURSE GALLERY</h2><div class="tabs">${[['new','NEW'],['top','TOP'],['plays','MOST PLAYED']].map(([k,n])=>`<button class="tb2${GAL.s===k?' on':''}" data-a="gs" data-v="${k}">${n}</button>`).join('')}</div>
  <div class="row"><input id="gq" maxlength="30" value="${esc(GAL.q)}" placeholder="SEARCH NAME, MAKER OR ID"><button class="bt sm" data-a="gq">GO</button></div><div id="gl" class="lst"><p class="sm">Loading...</p></div><div class="row" id="gpg"></div><button class="bt alt" data-a="hub">BACK</button>`);galLoad()};
ACT.gs=v=>{GAL.s=v;GAL.o=0;ACT.gallery()};
ACT.gq=()=>{const q=(document.getElementById('gq').value||'').trim();if(/^[a-z0-9]{6}$/i.test(q)){courseDetail(q.toLowerCase());return}GAL.q=q.toLowerCase();GAL.o=0;ACT.gallery()};
ACT.gpg=v=>{GAL.o=Math.max(0,GAL.o+(+v));ACT.gallery()};
function galLoad(){api('list?s='+GAL.s+'&q='+encodeURIComponent(GAL.q)+'&o='+GAL.o).then(r=>{const el=document.getElementById('gl');if(!el)return;
  el.innerHTML=r.list.length?r.list.map(c=>`<button class="it crs bt2" data-a="gopen" data-v="${esc(c.id)}"><span class="chip" style="background:${BIOMES[clamp(c.t|0,0,NW-1)].sky[3]}"></span><span class="nm">${esc(c.n)}<small>BY ${esc(c.by)} · ${c.p} PLAYS · ${c.p?Math.round(100*Math.min(c.c,c.p)/c.p):0}% CLEARED${c.wr?' · BEST '+fmtT(c.wr.ms):''}</small></span></button>`).join(''):'<p class="sm">NO COURSES HERE YET. MAKE ONE IN THE COURSE MAKER!</p>';
  const pg=document.getElementById('gpg');if(pg)pg.innerHTML=(GAL.o>0?'<button class="bt sm alt" data-a="gpg" data-v="-40">&lt; NEWER</button>':'')+(r.more?'<button class="bt sm alt" data-a="gpg" data-v="40">MORE &gt;</button>':'')},
  e=>{const el=document.getElementById('gl');if(el)el.innerHTML='<p class="sm">'+errMsg(e)+'</p>'})}
ACT.gopen=v=>courseDetail(v);
function courseDetail(id){ui('<h2>LOADING...</h2>');api('get?id='+id).then(c=>{GAL.cur=c;const a=acct(),own=a&&(a.name.toLowerCase()===c.by.toLowerCase()||ADMINS.includes(a.name.toLowerCase()));
  ui(`<h2>${esc(c.n)}</h2><p class="sm">BY ${esc(c.by)} · ${esc(BIOMES[clamp(c.t|0,0,NW-1)].name)}<br>${c.p} PLAYS · ${c.p?Math.round(100*Math.min(c.c,c.p)/c.p):0}% CLEARED · ID ${esc(c.id)}</p>
  <h3>BEST TIMES</h3>${timesList(c.top)}<button class="bt" data-a="gplay">PLAY</button>${own?'<button class="bt red sm" data-a="gdel">DELETE COURSE</button>':''}<button class="bt alt" data-a="gallery">BACK</button>`)},e=>ui('<h2>COURSE</h2><p class="sm">'+errMsg(e)+'</p><button class="bt alt" data-a="gallery">BACK</button>'))}
function timesList(top,me){return top&&top.length?'<ol class="tm">'+top.map(t=>`<li${me&&t.n.toLowerCase()===me.toLowerCase()?' class="me"':''}><span>${esc(t.n)}</span><b>${fmtT(t.ms)}</b></li>`).join('')+'</ol>':'<p class="sm">NOBODY HAS CLEARED IT YET. BE THE FIRST!</p>'}
ACT.gplay=()=>{const c=GAL.cur;if(!c)return;G.mode='course';G.course={id:c.id,n:c.n,by:c.by,C:deserial(c.d,c.n)};G.runT=0;G.power=0;api('play',{id:c.id}).catch(()=>{});uiClose();go(()=>startLevel(false))};
ACT.gagain=()=>{G.runT=0;G.power=0;uiClose();go(()=>startLevel(false))};
ACT.gdel=()=>ui(`<h2>DELETE COURSE?</h2><p class="sm">This removes "${esc(GAL.cur.n)}" and its times from the gallery for everyone. It can't be undone.</p><button class="bt red" data-a="gdel2">DELETE</button><button class="bt alt" data-a="gopen" data-v="${esc(GAL.cur.id)}">CANCEL</button>`);
ACT.gdel2=()=>api('del',{id:GAL.cur.id},true).then(()=>ACT.gallery(),e=>ui('<h2>DELETE FAILED</h2><p class="sm">'+errMsg(e)+'</p><button class="bt alt" data-a="gallery">BACK</button>'));
ACT.gtitle=()=>{uiClose();G.mode='story';state='title';stT=0;playMusic(0)};
function courseDone(ms){const c=G.course,a=acct();state='title';stT=0;G.mode='story';playMusic(0);
  const head=`<h2>COURSE CLEAR!</h2><p class="sm">${esc(c.n)} BY ${esc(c.by)}</p><p class="big">${fmtT(ms)}</p>`,btns='<button class="bt" data-a="gagain">PLAY AGAIN</button><button class="bt alt" data-a="gallery">GALLERY</button>';
  if(!a){ui(head+noAcct.replace('for this','to save your time')+btns);G.mode='course';return}
  ui(head+'<p class="sm">SAVING YOUR TIME...</p>');G.mode='course';
  api('time',{id:c.id,ms},true).then(r=>ui(head+`<p class="sm">${r.best<ms?'YOUR BEST IS STILL '+fmtT(r.best)+' · ':''}YOU ARE #${r.rank}</p><h3>BEST TIMES</h3>${timesList(r.top,a.name)}`+btns),e=>ui(head+'<p class="sm">'+errMsg(e)+'</p>'+btns))}

// ============================================================ title menu
let titleSel=0,tapXY=null;
const TITLE_ITEMS=['PLAY','ONLINE'];
function titleItemY(i){return Math.round(H*.66)+i*14}
function updTitle(){stT++;if(inp.p.u||inp.p.d){titleSel^=1;SFX.select()}
  if(inp.p.tap&&tapXY&&stT>20){for(let i=0;i<2;i++){const y=titleItemY(i);if(Math.abs(tapXY.y-y-2)<=7&&Math.abs(tapXY.x-W/2)<=60){titleSel=i;doTitle(i);return}}}
  if((inp.p.jump||inp.p.start)&&stT>20)doTitle(titleSel)}
function doTitle(i){initAudio();SFX.select();if(i===0)go(()=>{state='map';stT=0;G.mode='story';sel=Math.min(save.u,NL-1);playMusic(sel>>2)});else openHub()}

// ============================================================ main loop
function step(){frameN++;pollInput();
  if(fade.t===1){fade.v+=.08;if(fade.v>=1){fade.v=1;const cb=fade.cb;fade.cb=null;fade.t=0;cb&&cb()}}else fade.v=Math.max(0,fade.v-.08);
  if(!fade.cb&&!uiOpen)switch(state){
    case 'edit':updEdit();break;
    case 'title':updTitle();break;case 'map':updMap();break;
    case 'intro':stT++;if(stT>100||(stT>30&&confirmP())){state='play';playMusic(G.wi)}break;
    case 'play':updPlay();break;case 'pause':updPause();break;case 'clear':updClear();break;
    case 'gameover':updGameOver();break;case 'ending':updEnding();break}
  else if(state==='play'&&P&&P.dead)updPlayer();
  else if(uiOpen&&inCoop()&&state==='play')updPlay(true);
  musicTick()}
function render(){ctx.imageSmoothingEnabled=false;tEl.style.visibility=(state==='edit'||uiOpen)?'hidden':'';
  switch(state){case 'edit':renderEdit();break;case 'title':renderTitle();break;case 'map':renderMap();break;case 'intro':renderIntro();break;case 'play':renderPlay();break;case 'pause':renderPause();break;case 'clear':renderClear();break;case 'gameover':renderGameOver();break;case 'ending':renderEnding();break}
  if(fade.v>0){ctx.fillStyle=fadePats[Math.round(fade.v*16)];ctx.fillRect(0,0,W,H)}}
let acc=0,last=performance.now();
function frame(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<5){step();acc-=1000/60;n++}render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!window.__noAutoPause){state='pause';pauseSel=0}});
window.SPROUT={SP,txt,bigTitle,titleScene,heroFor,render,drawSky,drawBG,get ED(){return ED},get NET(){return NET},G,get L(){return L},get P(){return P},get state(){return state},warp(i){G.wi=i>>2;G.li=i&3;startLevel(false)},unlock(){save.u=20;writeSave()},genLevel,tick(n){for(let i=0;i<n;i++)step();render()}};
})();
</script>

<script src="../cursors.js?v=2"></script>
<script src="../outage.js?v=2"></script>
