<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game over · The Arcade</title>
<meta name="theme-color" content="#050506">
<!-- This page can show up at any address: the base points at the site root (/projects/ on the old GitHub address, / everywhere else) -->
<script>document.write('<base href="' + (location.hostname === 'noah-and-lars.github.io' ? '/projects/' : '/') + '">');</script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="arcade.css?v=25">
<style>
  .lost { flex: 1; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
  .lost .code { font: 800 clamp(80px, 22vw, 180px)/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -0.04em;
    color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .5); font-family: var(--font); font-stretch: 125%; }
  .lost h1 { margin: 4px 0 8px; font-size: clamp(26px, 5vw, 38px); letter-spacing: .2em; text-transform: uppercase; }
  .lost p { margin: 0 auto 26px; color: var(--muted); max-width: 420px; }
  .lost .btn { padding: 12px 24px; font-size: 16px; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><img class="logo" src="logo.svg" alt="">The Arcade</a>
</header>
<main class="lost">
  <div>
    <div class="code">404</div>
    <h1>Game over</h1>
    <p>There's nothing at this address. The link might have a typo, or the page was moved.</p>
    <a class="btn" href="./">Insert coin<span class="blink">_</span> Back to the arcade</a>
  </div>
</main>
<script src="moving.js?v=2"></script>
<script src="cursors.js?v=2"></script>
