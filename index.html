<body>
<div id="intro" class="intro" aria-hidden="true">
  <div class="intro-glow"></div>
  <h1 class="intro-title" id="introTitle">The Arcade</h1>
  <hr class="intro-line">
  <p class="intro-sub">Play instantly · No downloads</p>
</div>
<script>
// Play the intro once per visit, not every time someone comes back from a game. A tap skips it.
(() => {
  const intro = document.getElementById('intro');
  let seen = false;
  try { seen = sessionStorage.getItem('intro-seen'); sessionStorage.setItem('intro-seen', '1'); } catch (e) {}
  if (seen) { intro.remove(); return; }
  document.documentElement.classList.add('intro-on');
  // one span per letter so they can appear one after another
  const title = document.getElementById('introTitle');
  let i = 0;
  title.replaceChildren(...title.textContent.split(' ').flatMap((word, w) => {
    const box = document.createElement('span');
    box.className = 'word';
    for (const ch of word) {
      const s = document.createElement('span');
      s.textContent = ch; s.style.animationDelay = (0.5 + 0.06 * i++).toFixed(2) + 's';
      box.appendChild(s);
    }
    i++;
    return w ? [' ', box] : [box];
  }));
  const done = () => { intro.remove(); document.documentElement.classList.remove('intro-on'); };
  intro.addEventListener('click', () => {
    intro.classList.add('skip');
    for (const el of document.querySelectorAll('.intro-on .wrap, .intro-on .foot')) el.style.animationDelay = '0s';
  });
  intro.addEventListener('animationend', e => { if (e.target === intro) done(); });
})();
</script>
<header class="top">
  <a class="brand" href="index.html"><img class="logo" src="logo.svg" alt="">The Arcade</a>
  <nav class="tabs" aria-label="Sections">
    <a class="tab on" href="index.html" aria-current="page">Games</a>
    <a class="tab" href="chat.html"><span class="wide">Global chat</span><span class="narrow">Chat</span> <b id="chatN" class="tab-n" hidden></b></a>
  </nav>
  <input id="search" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
</header>


<main class="wrap">
  <div id="online" class="live" role="status" hidden><i aria-hidden="true"></i><b>0</b><span>people on the arcade right now</span></div>
  <a id="feature" class="feature"></a>

  <section id="recentWrap" class="section" hidden>
    <h2 class="sec-h">Continue playing</h2>
    <div id="recent" class="recent"></div>
  </section>

  <section class="section">
    <div class="sec-bar">
      <h2 class="sec-h" id="gridTitle">All games</h2>
      <nav id="cats" class="chips" aria-label="Categories"></nav>
    </div>
    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="empty" class="empty" hidden>No games match that search.</p>
  </section>

  <section id="newsWrap" class="section news">
    <h2 class="sec-h">What's new</h2>
    <ol id="news"></ol>
  </section>
</main>

<footer class="foot">
  <p>The Arcade · <span id="count"></span></p>
</footer>

<script src="games.js?v=117"></script>
<script>
const $ = id => document.getElementById(id);
const playUrl = g => 'play.html?game=' + encodeURIComponent(g.id);
const byId = Object.fromEntries(GAMES.map(g => [g.id, g]));
const TROPHY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 1h8v1h3v2.5A3.5 3.5 0 0 1 11.7 8 4 4 0 0 1 9 10.4V12h2v2H5v-2h2v-1.6A4 4 0 0 1 4.3 8 3.5 3.5 0 0 1 1 4.5V2h3zm8 2.5V6.3A1.5 1.5 0 0 0 13 5V3.5zM4 3.5H3V5a1.5 1.5 0 0 0 1 1.3z"/></svg>';
let active = 'All';

$('count').textContent = GAMES.length + (GAMES.length === 1 ? ' game' : ' games');

// Featured: whichever game arrived or changed most recently
function renderFeature() {
  // Pinned: Cube Assault is in the banner even when another game is updated more recently
  const g = GAMES.find(x => x.id === 'cube-assault') || [...GAMES].sort((a, b) => Date.parse(b.updated) - Date.parse(a.updated))[0];
  const badge = Arcade.badge(g), stat = Arcade.stat(g);
  const f = $('feature');
  f.href = playUrl(g);
  f.innerHTML = `<img class="feature-art" alt="">
    <div class="feature-body">
      <span class="eyebrow"></span>
      <h1></h1>
      <p class="feature-tag"></p>
      <div class="feature-meta"></div>
      <span class="btn big"><span aria-hidden="true">▶</span> Play now</span>
    </div>`;
  f.querySelector('img').src = g.thumb;
  f.querySelector('.eyebrow').textContent = g.id === 'free-criminal' ? 'NEW: v1.9 · The big one' : g.id === 'russian-roulette' ? 'New gamemode: Buckshot' : g.id === 'rocket-rivals' ? 'NEW GAME: Rocket Rivals 1.0' : g.id === 'football' ? 'NEW: Football 1.0.1 · Change your keys' : g.id === 'cube-assault' ? 'NEW: v2.9.13 · Mall, Forest and Seaside maps' : badge === 'NEW' ? 'New game' : badge === 'UPDATED' ? 'Just updated' : 'Featured';
  f.querySelector('h1').textContent = g.title;
  f.querySelector('.feature-tag').textContent = g.tagline;
  const meta = f.querySelector('.feature-meta');
  for (const t of [g.category, g.controls]) { const s = document.createElement('span'); s.textContent = t; meta.appendChild(s); }
  if (stat) { const s = document.createElement('span'); s.className = 'best'; s.innerHTML = TROPHY; s.append(stat); meta.appendChild(s); }
}

function renderRecent() {
  const list = Arcade.recent(3);
  $('recentWrap').hidden = !list.length;
  $('recent').replaceChildren(...list.map(g => {
    const a = document.createElement('a');
    a.className = 'mini'; a.href = playUrl(g);
    a.innerHTML = '<img alt=""><div><b></b><span></span></div><span class="mini-play" aria-hidden="true">▶</span>';
    a.querySelector('img').src = g.thumb;
    a.querySelector('b').textContent = g.title;
    a.querySelector('div span').textContent = Arcade.stat(g) || 'Keep playing';
    return a;
  }));
}

for (const c of ['All', ...new Set(GAMES.map(g => g.category))]) {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = c;
  b.onclick = () => { active = c; render(); };
  $('cats').appendChild(b);
}

function tile(g) {
  const a = document.createElement('a');
  a.className = 'tile'; a.href = playUrl(g);
  const badge = Arcade.badge(g), stat = Arcade.stat(g);
  a.innerHTML = `
    <div class="thumb"><img alt="" loading="lazy">${badge ? `<span class="badge${badge === 'UPDATED' ? ' upd' : badge === 'DISCONTINUED' ? ' off' : ''}">${badge}</span>` : ''}</div>
    <div class="info">
      <h2></h2>
      <p class="desc"></p>
      <div class="meta"><span class="tag"></span><span class="ctl"></span></div>
      ${stat ? '<p class="best">' + TROPHY + '<span></span></p>' : ''}
      <p class="playing" hidden><i aria-hidden="true"></i><span><b>0</b> playing now</span></p>
    </div>`;
  a.querySelector('.playing').dataset.g = g.id;
  a.querySelector('img').src = g.thumb;
  a.querySelector('h2').textContent = g.title;
  a.querySelector('.desc').textContent = g.description;
  a.querySelector('.tag').textContent = g.category;
  a.querySelector('.ctl').textContent = g.controls;
  if (stat) a.querySelector('.best span').textContent = stat;
  return a;
}

function renderNews() {
  $('news').replaceChildren(...NEWS.slice(0, 5).map(n => {
    const li = document.createElement('li');
    const g = byId[n.game];
    li.innerHTML = '<time></time><a></a>';
    li.querySelector('time').textContent = new Date(n.date + 'T12:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    const a = li.querySelector('a');
    a.textContent = n.text;
    if (g) a.href = playUrl(g); else if (n.href) a.href = n.href; else a.removeAttribute('href');
    return li;
  }));
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  // the order of the All games grid: these eight first (two rows of four), then everything else as listed in games.js
  const FIRST = ['cube-assault', 'russian-roulette', 'free-criminal', 'gamble-your-life-away', 'bull-run', 'cube-tower-defense', 'chess', 'poly-racer'];
  const rank = g => { const i = FIRST.indexOf(g.id); return i < 0 ? FIRST.length + GAMES.indexOf(g) : i; };
  const list = [...GAMES].sort((a, b) => rank(a) - rank(b)).filter(g =>
    (active === 'All' || g.category === active) &&
    (!q || (g.title + ' ' + g.description + ' ' + g.category).toLowerCase().includes(q)));
  $('grid').replaceChildren(...list.map(tile));
  $('empty').hidden = list.length > 0;
  for (const b of $('cats').children) b.classList.toggle('on', b.textContent === active);
  // while searching, only show the results
  document.body.classList.toggle('searching', !!q);
  $('gridTitle').textContent = q ? 'Results' : 'All games';
  paintPlaying();
}

// How many people are playing each game, on its card (from the same live count as the one at the top)
let live = null;
function paintPlaying() {
  for (const el of document.querySelectorAll('.playing[data-g]')) {
    el.hidden = !live;
    if (!live) continue;
    const n = live.byGame[el.dataset.g] || 0;
    el.classList.toggle('none', n < 1);
    el.querySelector('b').textContent = ArcadeOnline.label(n, live);
  }
}

$('search').addEventListener('input', render);

renderFeature(); renderRecent(); renderNews(); render();
// Live count of everyone on the arcade (home page and every game)
ArcadeOnline.subscribe(c => {
  live = c; paintPlaying();
  $('online').hidden = !c || c.total < 1;
  if (!c) return;
  $('online').querySelector('b').textContent = ArcadeOnline.label(c.total, c);
  $('online').querySelector('span').textContent = (c.total === 1 && !c.full ? 'person' : 'people') + ' on the arcade right now';
  // how many are on the Global chat page, on its tab
  const n = c.byGame.chat || 0;
  $('chatN').hidden = !n; $('chatN').textContent = n;
  $('chatN').title = n + (n === 1 ? ' person' : ' people') + ' in the chat';
});
ArcadeOnline.start('home');
// scores change while you play in another tab, so refresh when you come back
addEventListener('pageshow', () => { renderFeature(); renderRecent(); render(); });
</script>
