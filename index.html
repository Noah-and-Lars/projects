<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noah's and Lars's Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='2' width='12' height='12' rx='3' fill='%236c5ce7'/><rect x='6' y='6' width='4' height='4' fill='%23fff'/></svg>">
<link rel="stylesheet" href="arcade.css?v=3">
</head>
<body>
<div id="intro" class="intro" aria-hidden="true">
  <div class="intro-glow"></div>
  <h1 class="intro-title" id="introTitle">Noah's and Lars's Arcade</h1>
  <hr class="intro-line">
  <p class="intro-sub">Made by Lars and Noah</p>
</div>
<script>
// Play the intro once per visit, not every time someone comes back from a game. A tap skips it.
(() => {
  const intro = document.getElementById('intro');
  let seen = false;
  try { seen = sessionStorage.getItem('intro-seen'); sessionStorage.setItem('intro-seen', '1'); } catch (e) {}
  if (seen) { intro.remove(); return; }
  document.documentElement.classList.add('intro-on');
  // one span per letter so they can appear one after another
  const title = document.getElementById('introTitle');
  let i = 0;
  title.replaceChildren(...title.textContent.split(' ').flatMap((word, w) => {
    const box = document.createElement('span');
    box.className = 'word';
    for (const ch of word) {
      const s = document.createElement('span');
      s.textContent = ch; s.style.setProperty('--i', i++);
      box.appendChild(s);
    }
    i++;
    return w ? [' ', box] : [box];
  }));
  const done = () => { intro.remove(); document.documentElement.classList.remove('intro-on'); };
  intro.addEventListener('click', () => {
    intro.classList.add('skip');
    for (const el of document.querySelectorAll('.intro-on .wrap, .intro-on .foot')) el.style.animationDelay = '0s';
  });
  intro.addEventListener('animationend', e => { if (e.target === intro) done(); });
})();
</script>
<header class="top">
  <a class="brand" href="index.html"><span class="logo"></span>Noah's and Lars's Arcade</a>
  <input id="search" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
</header>

<main class="wrap">
  <section class="hero">
    <h1>Pick a game. Play instantly.</h1>
    <p>No downloads, no sign-ups. Everything runs right in your browser.</p>
  </section>

  <nav id="cats" class="chips" aria-label="Categories"></nav>

  <section id="grid" class="grid" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>No games match that search.</p>
</main>

<footer class="foot">
  <p>Made by Lars and Noah · <span id="count"></span></p>
  <p>Found a bug, or a game won't load? Email <a class="contact"></a></p>
</footer>

<script src="games.js?v=3"></script>
<script>
const grid = document.getElementById('grid');
const cats = document.getElementById('cats');
const search = document.getElementById('search');
const empty = document.getElementById('empty');
let active = 'All';

fillContact('Arcade problem');

document.getElementById('count').textContent =
  GAMES.length + (GAMES.length === 1 ? ' game' : ' games');

const categories = ['All', ...new Set(GAMES.map(g => g.category))];
for (const c of categories) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = c;
  b.onclick = () => { active = c; render(); };
  cats.appendChild(b);
}

function tile(g) {
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = 'play.html?game=' + encodeURIComponent(g.id);
  a.innerHTML = `
    <div class="thumb"><img src="${g.thumb}" alt="" loading="lazy">
      ${g.isNew ? '<span class="badge">NEW</span>' : ''}</div>
    <div class="info">
      <h2></h2>
      <p class="desc"></p>
      <div class="meta"><span class="tag"></span><span class="ctl"></span></div>
    </div>`;
  a.querySelector('h2').textContent = g.title;
  a.querySelector('.desc').textContent = g.description;
  a.querySelector('.tag').textContent = g.category;
  a.querySelector('.ctl').textContent = g.controls;
  return a;
}

function render() {
  const q = search.value.trim().toLowerCase();
  const list = GAMES.filter(g =>
    (active === 'All' || g.category === active) &&
    (!q || (g.title + ' ' + g.description + ' ' + g.category).toLowerCase().includes(q)));
  grid.replaceChildren(...list.map(tile));
  empty.hidden = list.length > 0;
  for (const b of cats.children) b.classList.toggle('on', b.textContent === active);
}

search.addEventListener('input', render);
render();
</script>
</body>
</html>
