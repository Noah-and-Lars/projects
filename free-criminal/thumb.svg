  <g fill="#e9d36b"><rect x="10" y="161" width="24" height="3"/><rect x="60" y="161" width="24" height="3"/><rect x="110" y="161" width="24" height="3"/><rect x="160" y="161" width="24" height="3"/><rect x="210" y="161" width="24" height="3"/><rect x="260" y="161" width="24" height="3"/></g>
