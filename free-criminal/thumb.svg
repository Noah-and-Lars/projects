    <rect x="172" y="76" width="36" height="74"/><rect x="210" y="40" width="28" height="110"/><rect x="240" y="68" width="30" height="82"/>
    <rect x="272" y="52" width="24" height="98"/><rect x="298" y="78" width="22" height="72"/>
