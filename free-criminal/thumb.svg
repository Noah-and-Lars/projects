    <radialGradient id="red" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff3b3b" stop-opacity=".9"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b7bff" stop-opacity=".9"/><stop offset="1" stop-color="#3b7bff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="320" height="180" fill="url(#sky)"/>
