<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loadout pictures</title>
    <!--
      The loadout menu's pictures (assets/loadout/thumbs/*.webp): every gun
      seen from its right side, the PF-9's attachments as layers over it, and
      every outfit option. render_thumbs.mjs (npm run build-loadout-thumbs)
      opens this page in a headless browser and saves what it draws; opened
      by hand (served as the game is), it shows them, each with a link to
      save it. ?only=<name prefix> draws just those.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <style>
      body { margin: 0; padding: 16px; background: #0c0d10; color: #ccc; font: 13px system-ui, sans-serif; }
      .out { display: inline-block; margin: 0 10px 10px 0; text-align: center; vertical-align: top; }
      .out img { display: block; height: 128px; background: radial-gradient(ellipse 80% 80% at 50% 45%, #2a2f36 0%, #15171b 65%, #0b0c0e 100%); }
      a { color: #e0352b; }
    </style>
  </head>
  <body>
    <p id="status">Drawing…</p>
    <div id="outs"></div>
    <script type="module" src="thumbs.js"></script>
  </body>
</html>
